<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('ThemeEngine') ?>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-primary-hover: #4F46E5;
      --color-primary-rgb: 99,102,241;
      --color-primary-glow: rgba(99,102,241,0.14);
      --color-primary-glow-strong: rgba(99,102,241,0.32);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      overflow: hidden;
    }

    /* Animated Particles */
    .particles {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .particles span {
      position: absolute; display: block; background: rgba(255,255,255,0.04);
      animation: rise 20s linear infinite; bottom: -150px; border-radius: 50%;
    }
    .particles span:nth-child(1){ left:10%; width:80px; height:80px; animation-delay:0s; }
    .particles span:nth-child(2){ left:20%; width:20px; height:20px; animation-delay:2s; animation-duration:12s; }
    .particles span:nth-child(3){ left:35%; width:40px; height:40px; animation-delay:4s; }
    .particles span:nth-child(4){ left:50%; width:60px; height:60px; animation-delay:0s; animation-duration:18s; }
    .particles span:nth-child(5){ left:65%; width:20px; height:20px; animation-delay:0s; }
    .particles span:nth-child(6){ left:75%; width:100px; height:100px; animation-delay:3s; }
    .particles span:nth-child(7){ left:85%; width:30px; height:30px; animation-delay:7s; }
    .particles span:nth-child(8){ left:45%; width:25px; height:25px; animation-delay:10s; animation-duration:30s; }
    .particles span:nth-child(9){ left:5%; width:15px; height:15px; animation-delay:2s; animation-duration:35s; }
    .particles span:nth-child(10){ left:90%; width:120px; height:120px; animation-delay:0s; animation-duration:11s; }

    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg); opacity:1; }
      100% { transform: translateY(-1200px) rotate(720deg); opacity:0; }
    }

    /* Login Card */
    .login-card {
      position: relative; z-index: 1; width: 440px; padding: 42px 38px;
      background: rgba(255,255,255,0.04); backdrop-filter: blur(25px);
      border-radius: 24px; border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      animation: cardIn 0.6s ease-out;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(40px) scale(0.95); }
      to { opacity:1; transform: translateY(0) scale(1); }
    }

    /* Header */
    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header .logo {
      width: 64px; height: 64px; margin: 0 auto 14px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px var(--color-primary-glow-strong);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }
    .login-header .logo .material-icons-round { font-size: 34px; color: #fff; }
    .login-header h1 { font-size: 24px; font-weight: 700; color: #fff; }
    .login-header h1 span { background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; transition: background 0.35s ease; }
    .login-header p { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }

    /* Fields */
    .field { position: relative; margin-bottom: 18px; }
    .field .material-icons-round {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.3); font-size: 20px; transition: color 0.3s;
    }
    .field input {
      width: 100%; padding: 15px 15px 15px 50px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; font-size: 14px; color: #fff;
      font-family: 'Poppins', sans-serif; outline: none; transition: 0.3s;
    }
    .field input:focus { border-color: var(--color-primary); background: var(--color-primary-glow); box-shadow: 0 0 25px var(--color-primary-glow); }
    .field input:focus ~ .material-icons-round { color: var(--color-primary); }
    .field input::placeholder { color: rgba(255,255,255,0.25); }

    /* Button */
    .login-btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
      font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
      font-family: 'Poppins', sans-serif; letter-spacing: 1px;
      transition: transform 0.3s, box-shadow 0.3s, background 0.35s ease; position: relative; overflow: hidden;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px var(--color-primary-glow-strong); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .btn-spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Message */
    .msg { text-align: center; margin-top: 14px; padding: 11px; border-radius: 10px; font-size: 12px; font-weight: 500; display: none; animation: msgIn 0.3s ease; }
    @keyframes msgIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
    .msg.success { display: block; background: rgba(0,200,83,0.1); color: #00e676; border: 1px solid rgba(0,200,83,0.2); }
    .msg.error { display: block; background: rgba(233,69,96,0.1); color: #ff5252; border: 1px solid rgba(233,69,96,0.2); }
    .build-id { margin-top: 13px; text-align: center; color: rgba(255,255,255,0.28); font: 10px/1.2 monospace; }

    @media (max-width:480px) {
      .login-card { width: 92%; padding: 28px 22px; }
      .login-header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-card">
    <div class="login-header">
      <div class="logo"><span class="material-icons-round">checkroom</span></div>
      <h1>Welcome to <span>Fashion</span></h1>
      <p>Flow Management System</p>
    </div>

    <!-- Login -->
    <div class="field">
      <span class="material-icons-round">person</span>
      <input type="text" id="loginId" placeholder="Login ID" autocomplete="off">
    </div>
    <div class="field">
      <span class="material-icons-round">lock</span>
      <input type="password" id="password" placeholder="Password" autocomplete="off">
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">
      <span id="btnLabel">LOGIN</span>
      <div class="btn-spinner" id="btnSpinner"></div>
    </button>

    <div class="msg" id="msg"></div>
    <div class="build-id">Build <?= FMS_BUILD_ID ?></div>
  </div>

  <script>
    /**
     * Safely starts a google.script.run call.
     *
     * WHY THIS EXISTS: calling google.script.run.someMissingFunction()
     * throws a SYNCHRONOUS TypeError ("... is not a function") when that
     * server function isn't present in the Apps Script project. Because it
     * throws instead of failing asynchronously, withFailureHandler() never
     * runs - so the login button used to spin forever while the only clue
     * sat hidden in the browser console. This checks the function exists
     * first and routes every failure through onFailure(), so the UI always
     * recovers and always explains what to fix.
     */
    function fmsCallServer(fnName, args, onSuccess, onFailure) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        onFailure({ message: 'Google Apps Script connection not available. Open the web app URL (ending in /exec or /dev) - this page cannot run as a local file.' });
        return;
      }

      var settled = false;
      var timeoutId = setTimeout(function() {
        if (settled) return;
        settled = true;
        onFailure({ message: 'Server did not respond within 45 seconds. Check your connection, then run fmsDiagnose() and open the exact WEB APP URL shown in its log.' });
      }, 45000);

      function succeed(value) {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        onSuccess(value);
      }

      function fail(error) {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        onFailure(error || { message: 'Unknown server error.' });
      }

      var runner;
      try {
        runner = google.script.run.withSuccessHandler(succeed).withFailureHandler(fail);
      } catch (e) {
        fail({ message: 'Could not reach the server: ' + e.message });
        return;
      }

      if (typeof runner[fnName] !== 'function') {
        fail({ message: 'Deployment mismatch: server function "' + fnName + '()" is not in the Apps Script version behind this URL.\n\n' +
          '1. Open the SAME Apps Script project used by this /exec URL.\n' +
          '2. Replace and SAVE Code.gs and WorkflowEngine.gs (TAT_Calculator.gs is optional).\n' +
          '3. Delete any leftover starter-kit Code/Index/Main file.\n' +
          '4. Run fmsDiagnose(); open the WEB APP URL printed in its log.\n' +
          '5. Deploy > Manage deployments > Edit > Version: New version.\n\n' +
          'Adding files to a different project or only saving without a New version does not update an existing /exec URL.' });
        return;
      }

      try {
        runner[fnName].apply(runner, args || []);
      } catch (e) {
        fail({ message: 'Could not start "' + fnName + '()": ' + e.message });
      }
    }

    function setLoginBusy(isBusy) {
      var btn = document.getElementById('loginBtn');
      var label = document.getElementById('btnLabel');
      var spinner = document.getElementById('btnSpinner');
      if (label) label.style.display = isBusy ? 'none' : 'inline';
      if (spinner) spinner.style.display = isBusy ? 'block' : 'none';
      if (btn) btn.disabled = isBusy;
    }

    function doLogin() {
      var loginId = document.getElementById('loginId').value.trim();
      var password = document.getElementById('password').value.trim();
      var msg = document.getElementById('msg');

      if (!loginId) { showMsg('Please enter Login ID!', 'error'); return; }
      if (!password) { showMsg('Please enter Password!', 'error'); return; }

      setLoginBusy(true);
      msg.className = 'msg'; msg.style.display = 'none';

      fmsCallServer('validateLogin', [loginId, password],
        function(res) {
          setLoginBusy(false);
          if (res && res.success) {
            showMsg(res.message, 'success');
            var session = {
              userName: res.userName,
              loginId: res.loginId,
              sheetUrl: res.sheetUrl,
              masterSheet: res.masterSheet,
              stepsSheet: res.stepsSheet,
              dropdownSheet: res.dropdownSheet
            };
            setTimeout(function() { goToDashboard(session); }, 1200);
          } else {
            showMsg((res && res.message) ? res.message : 'Login failed.', 'error');
          }
        },
        function(err) {
          // ALWAYS restores the button - the spinner can never get stuck now.
          setLoginBusy(false);
          showMsg((err && err.message) ? err.message : 'Unknown error', 'error');
        }
      );
    }

    function showMsg(text, type) {
      var m = document.getElementById('msg');
      m.textContent = text;
      m.className = 'msg ' + type;
      m.style.display = 'block';
      m.style.whiteSpace = 'pre-line'; // keeps multi-line setup guidance readable
    }

    function goToDashboard(session) {
      fmsCallServer('getDashboardHtml', [],
        function(html) {
          var sessionScript = '<script>var FMS_SESSION = ' + JSON.stringify(session) + ';<\/script>';
          html = html.replace('</head>', sessionScript + '</head>');
          document.open();
          document.write(html);
          document.close();
        },
        function(err) {
          setLoginBusy(false);
          showMsg('Dashboard load error: ' + ((err && err.message) ? err.message : 'unknown'), 'error');
        }
      );
    }

    document.addEventListener('keydown', function(e) { if(e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
