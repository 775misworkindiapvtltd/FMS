<style>
/* ============================================
   FMS - GLOBAL STYLES (Shared across pages)
   ============================================ */

:root {
  /* ---- Dynamic color scheme tokens (controlled by ThemeEngine.html) ---- */
  --color-primary: #6366F1;
  --color-primary-hover: #4F46E5;
  --color-primary-light: #e6e7fb;
  --color-primary-rgb: 99,102,241;
  --color-primary-glow: rgba(99,102,241,0.14);
  --color-primary-glow-strong: rgba(99,102,241,0.32);

  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-card: rgba(255,255,255,0.03);
  --bg-card-hover: rgba(255,255,255,0.06);
  --bg-surface: var(--bg-secondary);
  --text-primary: #ffffff;
  --text-main: var(--text-primary);
  --text-secondary: rgba(255,255,255,0.6);
  --text-muted: rgba(255,255,255,0.3);

  /* Legacy accent aliases - kept so all existing components using
     --accent* continue to work and now respond to the color scheme. */
  --accent: var(--color-primary);
  --accent-light: var(--color-primary-light);
  --accent-hover: var(--color-primary-hover);
  --accent-gradient: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));

  --danger: #ff5252;
  --success: #00e676;
  --warning: #ffab40;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --border-color: var(--border);
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.4);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --sidebar-width: 260px;
  --sidebar-collapsed: 68px;
  --topbar-height: 48px;
  --font-size-base: 14px;
  --transition: 0.3s ease;

  /* A / A+ / A++ font-size buttons ONLY affect the main table content
     area (the column header row down to, but NOT including, the
     pagination bar) - never the topbar, sidebar, or pagination controls.
     Default 1 = no scaling. Overridden ONLY inside #mainContent below,
     via the body.font-* classes, so topbar/sidebar (outside #mainContent)
     never see anything but the default. */
  --content-font-scale: 1;
}

body.font-small #mainContent { --content-font-scale: 0.85; }
body.font-medium #mainContent { --content-font-scale: 1; }
body.font-large #mainContent { --content-font-scale: 1.25; }

/* Explicitly reset back to "no scaling" for the pagination bar - this is
   the lower boundary and must never resize, even though it lives inside
   #mainContent. */
.table-pagination { --content-font-scale: 1; }

[data-theme="light"] {
  --bg-primary: #f0f2f5;
  --bg-secondary: #ffffff;
  --bg-card: rgba(0,0,0,0.02);
  --bg-card-hover: rgba(0,0,0,0.04);
  --bg-surface: var(--bg-secondary);
  --text-primary: #1a1a2e;
  --text-secondary: rgba(0,0,0,0.6);
  --text-muted: rgba(0,0,0,0.35);
  --border: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.15);
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  /* Smooth cross-fade whenever color scheme / display mode changes */
  transition: background-color 0.35s ease, color 0.35s ease;
}
/* Scoped (not blanket "html *") theme-transition helper - applied to the
   interactive/branded surfaces that actually change with the color scheme,
   to avoid transition overhead on large re-rendered lists (e.g. 1000-row table). */
.theme-transition, .icon-btn, .font-btn, .user-badge, .nav-item, .nav-group-header,
.status-tab, .btn, .btn-fill, .page-btn, .color-card, .mode-tile,
.pending-row, .content-page, .modal-box, .form-field input, .form-field select, .form-field textarea {
  transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
}

/* CRITICAL LAYOUT RULE: the OUTER page (html/body) must NEVER scroll.
   The topbar and sidebar are position:fixed relative to the viewport -
   if the body were allowed to overflow/scroll (e.g. because some inner
   content grew slightly taller than expected), the fixed header/sidebar
   could appear to "disappear" or judder during that scroll on some
   mobile browsers / inside the Apps Script iframe. Locking html+body to
   exactly 100% height with overflow:hidden makes this structurally
   impossible - ALL scrolling is forced into the designated inner
   containers below (.table-scroll-wrap, .sidebar-nav, .home-page,
   .modal-body), which is exactly what should scroll anyway. */
html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: var(--font-size-base);
  transition: background var(--transition), color var(--transition);
}

/* Font Size Classes */
body.font-small { --font-size-base: 12px; font-size: 12px; }
body.font-medium { --font-size-base: 14px; font-size: 14px; }
body.font-large { --font-size-base: 17px; font-size: 17px; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ===== TOP BAR ===== */
.topbar {
  position: fixed; top: 0; left: var(--sidebar-collapsed); right: 0; height: var(--topbar-height);
  background: var(--bg-secondary); border-bottom: 2px solid var(--color-primary);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 1000; backdrop-filter: blur(20px);
  transition: background var(--transition), border-color 0.35s ease, left 0.28s cubic-bezier(0.4,0,0.2,1);
  /* Everything in the header ALWAYS stays on a single line - never wraps
     to a second row. If the window is too narrow to fit everything, the
     bar scrolls horizontally instead of wrapping. */
  flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
}
.topbar::-webkit-scrollbar { display: none; }
.topbar-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap; margin-left: auto; }

.topbar-brand { font-size: 15px; font-weight: 700; }
.topbar-brand span { color: var(--accent); }

/* Icon-box logo (rounded square with the brand icon), used in the
   redesigned header title block. */
.topbar-logo-box {
  width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
  background: var(--accent-gradient); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px var(--color-primary-glow-strong);
}
.topbar-logo-box .material-icons-round { font-size: 18px; color: #fff; }

/* Title block is now a single line (no stacked subtitle underneath) -
   this was the actual cause of the topbar looking like "2 rows": the
   title+subtitle stack made the topbar's content taller than its fixed
   height, visually pushing/clipping things. The "Last Updated" line now
   lives on the Home page itself instead (see .home-last-updated). */
.topbar-title-block { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-title { font-size: 14px; font-weight: 700; color: var(--text-primary); white-space: nowrap; transition: font-size 0.15s ease; flex-shrink: 0; }
.topbar-title .brand-fms { color: var(--accent); }

/* Breadcrumb (current Step / Header) shown right after "FMS Fashion" on
   the SAME topbar line - populated by JS (updateTopbarBreadcrumb() in
   Scripts.html) whenever the user opens a Step's table, and cleared on
   Home. A vertical divider separates it from the app title. */
.topbar-breadcrumb {
  display: flex; align-items: center; gap: 6px; padding-left: 10px;
  border-left: 1px solid var(--border); font-size: calc(12px * var(--content-font-scale));
  color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0;
}
.topbar-breadcrumb:empty { display: none; border-left: none; padding-left: 0; }
.topbar-breadcrumb .material-icons-round { font-size: 15px; color: var(--accent); flex-shrink: 0; }
.topbar-breadcrumb strong { color: var(--text-primary); font-weight: 600; }
.topbar-breadcrumb .breadcrumb-sep { color: var(--text-muted); }

/* Auto-shrink step (applied by JS via autoShrinkTopbar() in Scripts.html
   when the topbar's content is wider than the available space) - shrinks
   the least-essential text/spacing first, so everything keeps fitting on
   ONE line without ever needing to wrap or horizontally scroll, for as
   long as realistically possible. */
.topbar.topbar-compact { padding: 0 10px; }
.topbar.topbar-compact .topbar-title { font-size: 12px; }
.topbar.topbar-compact .topbar-left { gap: 8px; }
.topbar.topbar-compact .topbar-right { gap: 5px; }
.topbar.topbar-compact .user-avatar-role { display: none; }
.topbar.topbar-compact .user-avatar-chip { padding: 3px 8px 3px 3px; }
.topbar.topbar-compact .font-btn { padding: 3px 6px; font-size: 9.5px; }
.topbar.topbar-compact .icon-btn { width: 28px; height: 28px; }
.topbar.topbar-compact .icon-btn .material-icons-round { font-size: 16px; }
.topbar.topbar-ultra-compact .topbar-clock { display: none; }
.topbar.topbar-ultra-compact .user-avatar-name { font-size: 9.5px; }
.topbar.topbar-ultra-compact .topbar-logo-box { width: 28px; height: 28px; }

/* User avatar chip (initials circle + name/role text) - replaces the
   plain icon+name user-badge in the redesigned header. */
.user-avatar-chip { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border); }
.user-avatar-initials {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent-gradient); color: #fff; font-size: 10.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.user-avatar-text { display: flex; flex-direction: column; line-height: 1.2; }
.user-avatar-name { font-size: 10.5px; font-weight: 600; color: var(--text-primary); }
.user-avatar-role { font-size: 8.5px; color: var(--text-muted); }

/* Icon Button */
.icon-btn {
  width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); font-size: 0;
}
.icon-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.icon-btn .material-icons-round { font-size: 18px; }

/* Font Controls */
.font-controls { display: flex; gap: 3px; }
.font-btn {
  padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); cursor: pointer;
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 10.5px;
  transition: var(--transition);
}
.font-btn:hover, .font-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* User Badge */
.user-badge {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px;
  background: var(--accent-gradient); border-radius: var(--radius-sm);
  color: #fff; font-size: 10.5px; font-weight: 500;
}
.user-badge .material-icons-round { font-size: 15px; }

/* Live Clock (top-right) - "Last Updated" now lives on the Home page
   itself (.home-last-updated) instead of the topbar, so the header
   stays a clean single row. */
.topbar-clock {
  display: flex; align-items: center; padding: 4px 12px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.sync-icon { font-size: 15px; color: var(--text-muted); transition: color 0.3s; }
.sync-icon.syncing { color: var(--accent); animation: spin-sync 1s linear infinite; }
@keyframes spin-sync { to { transform: rotate(360deg); } }
.clock-time { font-size: 12px; font-weight: 600; color: var(--text-primary); font-family: 'Poppins', monospace; }
.last-updated-text.updated-flash { color: var(--success); }

/* ===== SIDEBAR (hover-to-expand icon rail) =====
   Default state = a narrow, always-visible "icon rail" (icon on top,
   tiny caption underneath). Hovering the mouse over it (or tapping the
   topbar's pin button on touch devices) expands it to show full labels,
   overlaying the main content with a shadow rather than pushing/reflowing
   the page layout underneath. */
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1499;
  opacity: 0; visibility: hidden; transition: var(--transition);
  backdrop-filter: blur(3px);
}
.sidebar-overlay.active { opacity: 1; visibility: visible; }

.sidebar {
  /* Sidebar rail now spans the FULL viewport height (top:0 to bottom),
     sitting to the left of the topbar (which starts after the rail's
     collapsed width) - a classic "activity bar" layout, matching the
     request for the rail to reach all the way to the top. */
  position: fixed; top: 0; left: 0; width: var(--sidebar-collapsed);
  height: 100vh; background: var(--bg-secondary); z-index: 1600;
  border-right: 1px solid var(--border);
  transition: width 0.28s cubic-bezier(0.4,0,0.2,1), box-shadow 0.28s ease;
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar:hover, .sidebar.pinned {
  width: var(--sidebar-width);
  box-shadow: 16px 0 40px rgba(0,0,0,0.28);
}

.sidebar-header {
  padding: 12px 8px; border-bottom: 2px solid var(--color-primary);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; min-height: 44px; gap: 6px;
  transition: border-color 0.35s ease;
}
.sidebar-header h3 {
  font-size: 12.5px; font-weight: 600; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; opacity: 0; width: 0; transition: opacity 0.15s ease;
}
.sidebar:hover .sidebar-header h3, .sidebar.pinned .sidebar-header h3 { opacity: 1; width: auto; }
.sidebar-header .icon-btn { flex-shrink: 0; }

.sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px; }
.sidebar:hover .sidebar-nav, .sidebar.pinned .sidebar-nav { padding: 10px; }

/* Nav Groups - collapsed (default): icon on top, tiny caption below */
.nav-group { margin-bottom: 4px; }
.nav-group-header {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 10px 2px; border-radius: var(--radius-sm); cursor: pointer;
  background: var(--bg-card); border: 1px solid var(--border);
  transition: var(--transition); user-select: none; text-align: center;
}
.nav-group-header .group-icon { font-size: 19px; color: var(--text-muted); flex-shrink: 0; }
.nav-group-header:hover { background: var(--color-primary-glow); border-color: var(--accent); }
.nav-group-header .header-text {
  font-size: 8.5px; font-weight: 600; color: var(--text-primary); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56px;
}
.nav-group-header .arrow { display: none; font-size: 16px; color: var(--text-muted); transition: transform 0.3s; }
.nav-group.expanded .nav-group-header { background: var(--color-primary-glow); border-color: var(--accent); }
.nav-group.expanded .nav-group-header .arrow { transform: rotate(180deg); }

.nav-group-items { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; padding-left: 0; }
.nav-group.expanded .nav-group-items { max-height: 600px; }
/* While the rail is collapsed, never reveal sub-items even if a group's
   accordion state is "expanded" internally - there's no room to show them */
.sidebar:not(:hover):not(.pinned) .nav-group-items { max-height: 0 !important; }

/* Sub-items - collapsed (default): icon on top, tiny caption below */
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 8px 2px; margin-top: 3px; border-radius: 6px;
  cursor: pointer; transition: var(--transition); color: var(--text-secondary);
  font-size: 8px; font-weight: 400; text-align: center;
}
.nav-item:hover { background: var(--color-primary-glow); color: var(--accent); }
.nav-item.active { background: var(--color-primary-glow); color: var(--accent); font-weight: 500; }
.nav-item .material-icons-round { font-size: 16px; }
.nav-item span:not(.material-icons-round) {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56px; line-height: 1.15;
}

/* ---- Expanded state (mouse hover OR pinned via topbar button):
   switch group headers + items back to a normal horizontal icon+label row ---- */
.sidebar:hover .nav-group-header, .sidebar.pinned .nav-group-header {
  flex-direction: row; justify-content: space-between; text-align: left; padding: 11px 14px; gap: 8px;
}
.sidebar:hover .nav-group-header .header-text, .sidebar.pinned .nav-group-header .header-text {
  font-size: 12px; max-width: none; flex: 1;
}
.sidebar:hover .nav-group-header .arrow, .sidebar.pinned .nav-group-header .arrow { display: inline-block; }

.sidebar:hover .nav-item, .sidebar.pinned .nav-item {
  flex-direction: row; justify-content: flex-start; text-align: left; padding: 9px 12px; gap: 8px;
}
.sidebar:hover .nav-item span:not(.material-icons-round), .sidebar.pinned .nav-item span:not(.material-icons-round) {
  font-size: 11.5px; max-width: none;
}

/* ===== MAIN CONTENT ===== */
/* Always reserve space for the collapsed icon rail so content never sits
   underneath it; the rail expands OVER this on hover (position:fixed),
   so no reflow/jump happens when hovering. */
.main-content {
  /* Reduced padding on all sides - this was the visible "gap" between the
     collapsed sidebar rail / topbar and the actual table content
     (highlighted in green by the user): top 6px->4px, left/right
     18px->10px, bottom 14px->8px. */
  margin-top: var(--topbar-height); margin-left: var(--sidebar-collapsed); padding: 4px 10px 8px;
  min-height: calc(100vh - var(--topbar-height));
  height: calc(100vh - var(--topbar-height));
  display: flex; flex-direction: column;
  transition: var(--transition);
  box-sizing: border-box;
}

/* Welcome */
.welcome-section { text-align: center; padding: 70px 20px; }
.welcome-section .welcome-icon { font-size: 72px; color: var(--accent); margin-bottom: 18px; opacity: 0.5; }
.welcome-section h2 {
  font-size: 26px; font-weight: 700; margin-bottom: 8px;
  background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.welcome-section p { color: var(--text-secondary); font-size: 13px; max-width: 380px; margin: 0 auto; }

/* Content Page (non-table pages, e.g. Welcome) */
.content-page {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px; min-height: 280px;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.content-page h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.content-page .subtitle { color: var(--text-muted); font-size: 12px; margin-bottom: 16px; }

/* ===== PENDING LIST (Workflow Engine) ===== */
.pending-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.pending-count {
  background: var(--accent-gradient); color: #fff; font-size: 11px; font-weight: 600;
  padding: 4px 12px; border-radius: 20px;
}
.pending-list { display: flex; flex-direction: column; gap: 10px; }
.pending-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); cursor: pointer; transition: var(--transition);
}
.pending-row:hover { border-color: var(--accent); background: var(--color-primary-glow); transform: translateX(3px); }
.pending-row .pending-summary { font-size: 12.5px; font-weight: 500; color: var(--text-primary); }
.pending-row .pending-planned { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.pending-row .pending-arrow { color: var(--accent); font-size: 20px; flex-shrink: 0; }
.pending-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.pending-empty .material-icons-round { font-size: 50px; opacity: 0.4; margin-bottom: 10px; display: block; }
.pending-loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 12px; }

/* ===== MODAL / POPUP FORM ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 3000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; visibility: hidden; transition: var(--transition); backdrop-filter: blur(4px);
}
.modal-overlay.active { opacity: 1; visibility: visible; }

.modal-box {
  background: var(--bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--border);
  width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); transform: scale(0.92) translateY(20px);
  transition: transform 0.3s ease, max-width 0.25s ease;
}
.modal-overlay.active .modal-box { transform: scale(1) translateY(0); }

/* When a Step's form has many questions, the modal widens and switches
   its fields to a 2-column grid (see .form-fields-grid below) so the
   whole form fits without the user needing to scroll to reach Submit. */
.modal-box.modal-wide { max-width: 760px; }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

/* 2-column field grid - activated (via JS adding .form-fields-grid) once
   a form has enough questions that a single column would need scrolling
   to reach Submit. Fields that need full width (Long Text, File upload)
   still span both columns even inside the grid. A vertical divider line
   runs the full height between the two columns (per user request), via a
   ::before pseudo-element positioned in the grid's middle gap column. */
.form-fields-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px;
  position: relative;
}
.form-fields-grid::before {
  content: ''; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 1px; background: var(--border); pointer-events: none;
}
.form-fields-grid .form-field { margin-bottom: 12px; }
.form-fields-grid .form-field.field-span-2 { grid-column: 1 / -1; }

.form-field { margin-bottom: 16px; }
.form-field label {
  display: block; font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  transition: color 0.2s ease;
}
/* Once a question has been answered/filled, its label switches to the
   accent color + a checkmark, so it's immediately obvious at a glance
   which fields are done vs. still pending, in the whole form. */
.form-field.field-filled label { color: var(--color-primary); }
.form-field.field-filled label::after {
  content: 'check_circle'; font-family: 'Material Icons Round'; font-size: 13px;
  margin-left: 5px; vertical-align: middle; letter-spacing: 0; text-transform: none;
}
.form-field input[type="text"],
.form-field input[type="number"],
.form-field textarea,
.form-field select {
  width: 100%; padding: 11px 13px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text-primary);
  font-family: 'Poppins', sans-serif; outline: none; transition: var(--transition);
}
.form-field input:focus, .form-field textarea:focus, .form-field select:focus { border-color: var(--accent); }
.form-field textarea { resize: vertical; min-height: 70px; }

.form-field .readonly-display {
  padding: 11px 13px; background: rgba(255,171,64,0.08); border: 1px dashed var(--warning);
  border-radius: var(--radius-sm); font-size: 12.5px; color: var(--warning); font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.form-field .readonly-display .material-icons-round { font-size: 16px; }

.file-drop {
  border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 20px;
  text-align: center; cursor: pointer; transition: var(--transition); color: var(--text-muted); font-size: 12px;
}
.file-drop:hover { border-color: var(--accent); color: var(--accent); }
.file-drop input[type="file"] { display: none; }
/* Once at least one file is uploaded for a required FILE question */
.file-drop.file-drop-done { border-color: var(--success); color: var(--success); border-style: solid; }
.file-required-hint {
  margin-top: 6px; font-size: 10.5px; color: var(--warning); font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}
.file-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.file-chip {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 6px; font-size: 11px; color: var(--text-secondary);
}
.file-chip .remove-file { color: var(--danger); cursor: pointer; font-size: 15px; }

.btn {
  flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none; cursor: pointer;
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; transition: var(--transition);
}
.btn-primary { background: var(--accent-gradient); color: #fff; }
.btn-primary:hover { box-shadow: 0 8px 20px var(--color-primary-glow-strong); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
/* Specifically disabled because a required file hasn't been uploaded yet
   (vs. disabled because a save is already in progress) */
.btn-primary.btn-disabled-upload { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); }

.form-msg { text-align: center; padding: 10px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 14px; display: none; }
.form-msg.success { display: block; background: rgba(0,230,118,0.1); color: var(--success); border: 1px solid rgba(0,230,118,0.2); }
.form-msg.error { display: block; background: rgba(255,82,82,0.1); color: var(--danger); border: 1px solid rgba(255,82,82,0.2); }

/* ===== DATA TABLE (mirrors real sheet, per-step columns only) ===== */
/* Fills the full remaining viewport height so max rows are visible on one
   page - no big heading, no wasted top whitespace (per user request). */
.table-page { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* ROOT-CAUSE FIX for "pagination/scrollbar not visible": #tableContainer
   (the JS-rendered inner div - see loadStepTable()/renderDataTable() in
   Scripts.html) had NO layout rules of its own. .table-page correctly
   passed down flex:1/min-height:0, but that only constrains #tableContainer
   as a whole - without #tableContainer ALSO being display:flex, its own
   children (.status-tabs-row, .table-scroll-wrap, .table-pagination)
   just stacked in normal block flow with no height limit, growing taller
   than the visible area. Since the outer <body> is intentionally
   overflow:hidden (see the "outer page never scrolls" rule above), that
   overflow was silently clipped off-screen - which is exactly why the
   pagination bar and the table's own scrollbar were invisible. Mirroring
   the same flex rules onto #tableContainer fixes it structurally: now
   .table-scroll-wrap (flex:1; min-height:0) actually shrinks to fit the
   remaining space and shows its own scrollbar, while the toolbar row and
   pagination bar (flex-shrink:0) stay pinned at the top/bottom. */
#tableContainer { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* Everything above the table lives in ONE single toolbar line now:
   breadcrumb title -> status tabs (Pending/Completed/All/Overdue) ->
   global search -> column-toggle -> page-size. The table's own header
   row (thead) follows IMMEDIATELY after this line with no extra gap. */
.status-tabs-row {
  display: flex; align-items: center;
  gap: 10px; margin-bottom: 0; flex-shrink: 0;
  /* Never wrap to a second line on desktop - scroll horizontally instead
     if the window is too narrow to fit everything. */
  flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  padding-bottom: 6px;
}
.status-tabs-row::-webkit-scrollbar { display: none; }
.status-tabs { display: flex; gap: 6px; flex-shrink: 0; white-space: nowrap; }
/* Square (not pill/circle) tabs - per user request, uses the same
   --radius-sm token as every other button in the app (icon-btn, page-btn,
   btn-fill, etc.) instead of a fully-rounded pill shape. */
.status-tab {
  padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
  font-family: 'Poppins', sans-serif; font-size: calc(11.5px * var(--content-font-scale)); font-weight: 500; transition: var(--transition);
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
}
.status-tab:hover { border-color: var(--accent); color: var(--accent); }
.status-tab.active { background: var(--accent-gradient); color: #fff; border-color: transparent; }
.status-tab-count {
  background: rgba(255,255,255,0.2); padding: 1px 6px; border-radius: 4px; font-size: calc(9.5px * var(--content-font-scale)); font-weight: 600;
}
.status-tab:not(.active) .status-tab-count { background: var(--border); }

/* Search box sits right after the status tabs, and flexes to fill
   whatever space remains before the column-toggle/page-size controls. */
.table-search {
  flex: 1 1 180px; min-width: 140px; max-width: 320px; display: flex; align-items: center; gap: 8px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 6px 12px; flex-shrink: 1;
}
.table-search .material-icons-round { font-size: 16px; color: var(--text-muted); }
.table-search input {
  border: none; background: transparent; outline: none; color: var(--text-primary);
  font-family: 'Poppins', sans-serif; font-size: calc(12.5px * var(--content-font-scale)); width: 100%;
}
.table-toolbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: auto; }
.page-size-select {
  font-size: calc(11.5px * var(--content-font-scale)); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.page-size-select select {
  padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); font-family: 'Poppins', sans-serif;
  font-size: calc(11.5px * var(--content-font-scale)); outline: none;
}

.table-scroll-wrap {
  overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md);
  flex: 1; min-height: 0; /* let the table fill all remaining vertical space */
}
/* Column content wraps (instead of truncating/ellipsis) so that shrinking
   or growing a column via the resize handle reflows the text to fit the
   new width - both in the data cells AND the header label if it needs
   more than one line at a narrow width.

   IMPORTANT: width is "auto" with NO min-width:100% - and table-layout is
   fixed. Every <th> gets an explicit inline px width (see
   renderDataTable() / startColResize() in Scripts.html), so the table's
   total width is simply the SUM of all column widths. This means resizing
   ONE column only changes that column - the others never redistribute or
   stretch to compensate. If the columns' total is narrower than the
   viewport, blank space is left after the last column (intentional, per
   user request) - the .table-scroll-wrap wrapper scrolls horizontally
   when the total is wider than the viewport instead. */
.data-table { width: auto; border-collapse: collapse; font-size: calc(12px * var(--content-font-scale)); white-space: normal; table-layout: fixed; }
/* IMPORTANT: this header background must be a fully OPAQUE color, never
   a translucent rgba() token like --color-primary-glow. This is a
   position:sticky header - while scrolling the table body vertically,
   any transparency here lets the data rows scrolling underneath show
   through and visually overlap/"ghost" with the header text (exactly
   the bug reported: row text bleeding through the header row). Solid
   --bg-surface (with a light accent-tinted border instead of a tinted
   fill) keeps the visual "this header is accented" cue without ever
   letting content bleed through. */
.data-table thead th {
  position: sticky; top: 0; background: var(--bg-surface); color: var(--text-primary);
  font-weight: 700; text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--color-primary);
  user-select: none; z-index: 2; overflow: hidden; vertical-align: top;
  transition: background-color 0.35s ease, border-color 0.35s ease;
}
/* Column name + filter icon sit side by side on ONE line inside the
   header cell - no more permanent search-row underneath every column
   (per user request). Clicking the icon opens a small popover instead. */
.th-inner { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.data-table thead th .th-label {
  cursor: pointer; white-space: normal;
  overflow-wrap: break-word; word-break: break-word; line-height: 1.3; flex: 1;
}
.data-table thead th .th-label:hover { color: var(--accent); }
.data-table thead th.col-action, .data-table thead th.col-serial { cursor: default; white-space: nowrap; }

/* Small filter icon button next to each column name (search icon for
   text columns, calendar icon for Date/Time columns). Turns accent-
   colored once that column has an active filter applied. */
.col-filter-btn {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; border: none;
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
  transition: var(--transition);
}
.col-filter-btn:hover { background: var(--color-primary-glow); color: var(--accent); }
.col-filter-btn .material-icons-round { font-size: 14px; }
.col-filter-btn.active { color: var(--color-primary); background: var(--color-primary-glow); }

.col-resize-handle {
  position: absolute; top: 0; right: 0; bottom: 0; width: 6px; cursor: col-resize;
  z-index: 3;
}
.col-resize-handle:hover { background: var(--color-primary-glow-strong); }

.col-serial { width: 46px; min-width: 46px; max-width: 46px; text-align: center !important; color: var(--text-muted); font-weight: 500; }

/* Vertical divider line immediately BEFORE the "Planned" column -
   separates the base/identifying columns from this Step's own workflow
   columns (Planned/Actual/fill-in fields). Runs the full height of the
   table (every header row + every data row), explicitly requested. */
.col-before-planned { border-left: 2px solid var(--success) !important; }

.data-table tbody td {
  padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary);
  white-space: normal; overflow-wrap: break-word; word-break: break-word;
  vertical-align: middle;
}
.data-table tbody td.col-serial, .data-table tbody td.col-action { white-space: nowrap; }
.data-table tbody tr:hover td { background: var(--color-primary-glow); }
.table-empty-cell { text-align: center !important; padding: 40px !important; color: var(--text-muted); }

/* "Click Here" links for any raw http(s) URL found in a cell value */
.cell-link {
  color: var(--color-primary); font-weight: 600; text-decoration: none;
  border-bottom: 1.5px solid var(--color-primary); padding-bottom: 1px; font-size: calc(11.5px * var(--content-font-scale));
}
.cell-link:hover { color: var(--color-primary-hover); border-color: var(--color-primary-hover); }

.btn-fill {
  padding: 4px 12px; border-radius: 7px; border: none; background: var(--accent-gradient);
  color: #fff; font-family: 'Poppins', sans-serif; font-size: calc(10.5px * var(--content-font-scale)); font-weight: 600; cursor: pointer;
  transition: var(--transition);
}
.btn-fill:hover { box-shadow: 0 6px 16px var(--color-primary-glow-strong); }
.status-badge-done {
  padding: 4px 10px; border-radius: 7px; background: rgba(0,230,118,0.12); color: var(--success);
  font-size: calc(10.5px * var(--content-font-scale)); font-weight: 600;
}

/* ===== OVERDUE HIGHLIGHTING ===== */
/* A row is overdue when it's still Pending AND its Planned date/time has
   already passed. Subtle tinted background on the whole row + a compact
   red/orange badge next to the Fill button (per user request). */
tr.row-overdue td { background: rgba(255,82,82,0.06); }
tr.row-overdue:hover td { background: rgba(255,82,82,0.12); }
tr.row-overdue td.col-serial { border-left: 3px solid var(--danger); }
.status-tab-overdue { color: var(--danger) !important; border-color: rgba(255,82,82,0.3) !important; }
.status-tab-overdue:hover { border-color: var(--danger) !important; }
.status-tab-overdue.active { background: linear-gradient(135deg, #ff5252, #d32f2f) !important; color: #fff !important; }

/* Pagination bar height reduced ~15% overall (per user request, circled
   in red): margin-top 8px->6px, and every button/text inside it uses
   less vertical padding + slightly smaller font so the whole bar sits
   noticeably shorter without becoming hard to tap/read. */
.table-pagination {
  display: flex; align-items: center; justify-content: space-between; margin-top: 6px; flex-wrap: wrap; gap: 8px; flex-shrink: 0;
}
/* Pagination bar's own font sizes are fixed px (NOT scaled by
   --content-font-scale) - A/A+/A++ must never affect this bar, even
   though it lives inside #mainContent, per user request. */
.pagination-info { font-size: 10px; color: var(--text-muted); }
.pagination-controls { display: flex; align-items: center; gap: 8px; }
.page-btn {
  padding: 4px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); cursor: pointer;
  font-family: 'Poppins', sans-serif; font-size: 10.5px; font-weight: 500; transition: var(--transition);
}
.page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-indicator { font-size: 10.5px; color: var(--text-secondary); }

/* ===== COLUMN SHOW/HIDE PANEL ===== */
.column-toggle-wrap { position: relative; }
.column-panel {
  position: absolute; top: calc(100% + 6px); right: 0; width: 230px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); z-index: 50; opacity: 0; visibility: hidden;
  max-height: 0; overflow: hidden; transition: opacity 0.2s ease;
}
.column-panel.open { opacity: 1; visibility: visible; max-height: 320px; overflow-y: auto; padding: 10px; }
.column-panel-title {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-muted); margin-bottom: 8px;
}
.column-panel-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 6px;
  font-size: 12px; color: var(--text-primary); cursor: pointer;
}
.column-panel-item:hover { background: var(--color-primary-glow); }
.column-panel-item input { cursor: pointer; accent-color: var(--color-primary); }
.column-panel-reset {
  width: 100%; margin-top: 6px; padding: 7px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-card); color: var(--color-primary); font-family: 'Poppins', sans-serif;
  font-size: 11px; font-weight: 600; cursor: pointer;
}
.column-panel-reset:hover { background: var(--color-primary-glow); }

/* ===== HOME DASHBOARD (summary of all assigned Steps) ===== */
.home-page { flex: 1; overflow-y: auto; padding-bottom: 10px; }

.home-header { margin-bottom: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.home-header h2 { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
.home-header .subtitle { font-size: 12.5px; color: var(--text-secondary); }

/* "Last updated on ..." line at the top of the Home page */
.home-last-updated {
  font-size: 11px; color: var(--text-muted); padding: 5px 12px; border-radius: 20px;
  background: var(--bg-card); border: 1px solid var(--border); white-space: nowrap;
  transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
}
.home-last-updated.updated-flash { color: var(--success); border-color: rgba(0,230,118,0.3); background: rgba(0,230,118,0.08); }
.home-last-updated-loading { display: flex; align-items: center; gap: 5px; }
.home-last-updated-loading .sync-icon { font-size: 13px !important; }

/* Brief highlight flash on the stat cards row when new numbers arrive
   from a background refresh (matches the "Last Updated" flash). */
.home-stats-row.stats-updated-flash .home-stat-card { animation: statFlash 2.5s ease; }
@keyframes statFlash {
  0% { box-shadow: 0 0 0 2px rgba(0,230,118,0.5); }
  100% { box-shadow: none; }
}

.home-stats-row { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.home-stat-card {
  flex: 1; min-width: 160px; display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; border-radius: var(--radius-lg); border: 1px solid var(--border);
  background: var(--bg-card);
}
.home-stat-card .material-icons-round { font-size: 30px; padding: 10px; border-radius: var(--radius-md); }
.home-stat-card.stat-pending .material-icons-round { color: var(--warning); background: rgba(255,171,64,0.12); }
.home-stat-card.stat-completed .material-icons-round { color: var(--success); background: rgba(0,230,118,0.12); }
.home-stat-card.stat-total .material-icons-round { color: var(--color-primary); background: var(--color-primary-glow); }
.home-stat-count { font-size: 24px; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
.home-stat-pct { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-left: 6px; }
.stat-pending .home-stat-pct { color: var(--warning); }
.stat-completed .home-stat-pct { color: var(--success); }
.home-stat-label { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

.home-group { margin-bottom: 22px; }
.home-group-title {
  display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600;
  color: var(--text-primary); margin-bottom: 12px;
}
.home-group-title .material-icons-round { font-size: 17px; color: var(--accent); }

.home-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.home-step-card {
  padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--bg-card); cursor: pointer; transition: var(--transition);
}
.home-step-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.home-step-card.has-pending { border-left: 3px solid var(--warning); }
.home-step-card-title {
  font-size: 12.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.home-step-card-counts { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 8px; }
.hs-pending { color: var(--warning); font-weight: 600; }
.hs-completed { color: var(--success); font-weight: 600; }
.home-step-progress { height: 5px; border-radius: 4px; background: var(--border); overflow: hidden; }
.home-step-progress-fill { height: 100%; background: var(--success); border-radius: 4px; transition: width 0.4s ease; }
.home-step-card-error { font-size: 10.5px; color: var(--danger); }

/* ===== RESET FILTERS BUTTON (top of the toolbar line) ===== */
.reset-filters-btn {
  display: flex; align-items: center; gap: 5px; padding: 6px 12px; flex-shrink: 0;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); cursor: pointer; font-family: 'Poppins', sans-serif;
  font-size: calc(11px * var(--content-font-scale)); font-weight: 500; white-space: nowrap;
  transition: var(--transition);
}
.reset-filters-btn:hover { border-color: var(--danger); color: var(--danger); }
.reset-filters-btn .material-icons-round { font-size: 15px; }

/* ===== PER-COLUMN TEXT FILTER POPOVER (icon-triggered) ===== */
.text-filter-overlay {
  position: fixed; inset: 0; background: transparent; z-index: 3500;
  opacity: 0; visibility: hidden;
}
.text-filter-overlay.active { opacity: 1; visibility: visible; }

.text-filter-popover {
  position: fixed; z-index: 3501; display: flex; align-items: center; gap: 6px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); padding: 8px 10px; width: 220px;
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.text-filter-popover.open { opacity: 1; visibility: visible; transform: translateY(0); }
.text-filter-popover .material-icons-round { font-size: 16px; color: var(--text-muted); flex-shrink: 0; }
.text-filter-popover input {
  flex: 1; border: none; background: transparent; outline: none; color: var(--text-primary);
  font-family: 'Poppins', sans-serif; font-size: 12.5px; min-width: 0;
}
.text-filter-clear { cursor: pointer; }
.text-filter-clear:hover { color: var(--danger); }

/* ===== DATE-RANGE PICKER (dual calendar + presets) ===== */
.date-range-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 3500;
  opacity: 0; visibility: hidden; transition: opacity 0.15s ease;
}
.date-range-overlay.active { opacity: 1; visibility: visible; }

.date-range-picker {
  position: fixed; z-index: 3501; display: flex;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity 0.18s ease, transform 0.18s ease; overflow: hidden;
}
.date-range-picker.open { opacity: 1; visibility: visible; transform: translateY(0); }

.drp-presets {
  width: 130px; flex-shrink: 0; padding: 10px; display: flex; flex-direction: column; gap: 2px;
  border-right: 1px solid var(--border); background: var(--bg-card);
