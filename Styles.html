<style>
/* ============================================
   FMS - GLOBAL STYLES (Shared across pages)
   ============================================ */

:root {
  /* ---- Dynamic color scheme tokens (controlled by ThemeEngine.html) ---- */
  --color-primary: #6366F1;
  --color-primary-hover: #4F46E5;
  --color-primary-light: #e6e7fb;
  --color-primary-rgb: 99,102,241;
  --color-primary-glow: rgba(99,102,241,0.14);
  --color-primary-glow-strong: rgba(99,102,241,0.32);

  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-card: rgba(255,255,255,0.03);
  --bg-card-hover: rgba(255,255,255,0.06);
  --bg-surface: var(--bg-secondary);
  --text-primary: #ffffff;
  --text-main: var(--text-primary);
  --text-secondary: rgba(255,255,255,0.6);
  --text-muted: rgba(255,255,255,0.3);

  /* Legacy accent aliases - kept so all existing components using
     --accent* continue to work and now respond to the color scheme. */
  --accent: var(--color-primary);
  --accent-light: var(--color-primary-light);
  --accent-hover: var(--color-primary-hover);
  --accent-gradient: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));

  --danger: #ff5252;
  --success: #00e676;
  --warning: #ffab40;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --border-color: var(--border);
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.4);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --sidebar-width: 280px;
  --topbar-height: 60px;
  --font-size-base: 14px;
  --transition: 0.3s ease;
}

[data-theme="light"] {
  --bg-primary: #f0f2f5;
  --bg-secondary: #ffffff;
  --bg-card: rgba(0,0,0,0.02);
  --bg-card-hover: rgba(0,0,0,0.04);
  --bg-surface: var(--bg-secondary);
  --text-primary: #1a1a2e;
  --text-secondary: rgba(0,0,0,0.6);
  --text-muted: rgba(0,0,0,0.35);
  --border: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.15);
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  /* Smooth cross-fade whenever color scheme / display mode changes */
  transition: background-color 0.35s ease, color 0.35s ease;
}
/* Scoped (not blanket "html *") theme-transition helper - applied to the
   interactive/branded surfaces that actually change with the color scheme,
   to avoid transition overhead on large re-rendered lists (e.g. 1000-row table). */
.theme-transition, .icon-btn, .font-btn, .user-badge, .nav-item, .nav-group-header,
.status-tab, .btn, .btn-fill, .page-btn, .color-card, .mode-tile,
.pending-row, .content-page, .modal-box, .form-field input, .form-field select, .form-field textarea {
  transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: var(--font-size-base);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}

/* Font Size Classes */
body.font-small { --font-size-base: 12px; font-size: 12px; }
body.font-medium { --font-size-base: 14px; font-size: 14px; }
body.font-large { --font-size-base: 17px; font-size: 17px; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ===== TOP BAR ===== */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-height);
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 1000; backdrop-filter: blur(20px);
  transition: background var(--transition);
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

.topbar-brand { font-size: 17px; font-weight: 700; }
.topbar-brand span { color: var(--accent); }

/* Icon Button */
.icon-btn {
  width: 38px; height: 38px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); font-size: 0;
}
.icon-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.icon-btn .material-icons-round { font-size: 20px; }

/* Font Controls */
.font-controls { display: flex; gap: 3px; }
.font-btn {
  padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); cursor: pointer;
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11px;
  transition: var(--transition);
}
.font-btn:hover, .font-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* User Badge */
.user-badge {
  display: flex; align-items: center; gap: 7px; padding: 5px 12px;
  background: var(--accent-gradient); border-radius: var(--radius-sm);
  color: #fff; font-size: 11px; font-weight: 500;
}
.user-badge .material-icons-round { font-size: 16px; }

/* Live Clock + Last Updated (top-right) */
.topbar-clock {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.topbar-clock .sync-icon {
  font-size: 15px; color: var(--text-muted); transition: color 0.3s;
}
.topbar-clock .sync-icon.syncing { color: var(--accent); animation: spin-sync 1s linear infinite; }
@keyframes spin-sync { to { transform: rotate(360deg); } }
.clock-block { display: flex; flex-direction: column; line-height: 1.25; }
.clock-time { font-size: 12px; font-weight: 600; color: var(--text-primary); font-family: 'Poppins', monospace; }
.last-updated-text { font-size: 9px; color: var(--text-muted); white-space: nowrap; }
.last-updated-text.updated-flash { color: var(--success); }

/* ===== SIDEBAR ===== */
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500;
  opacity: 0; visibility: hidden; transition: var(--transition);
  backdrop-filter: blur(3px);
}
.sidebar-overlay.active { opacity: 1; visibility: visible; }

.sidebar {
  position: fixed; top: 0; left: -300px; width: var(--sidebar-width);
  height: 100vh; background: var(--bg-secondary); z-index: 2000;
  border-right: 1px solid var(--border); transition: left 0.3s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
}
.sidebar.open { left: 0; }

.sidebar-header {
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-header h3 { font-size: 15px; font-weight: 600; color: var(--text-primary); }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 10px; }

/* Nav Groups */
.nav-group { margin-bottom: 6px; }
.nav-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 14px; border-radius: var(--radius-sm); cursor: pointer;
  background: var(--bg-card); border: 1px solid var(--border);
  transition: var(--transition); user-select: none;
}
.nav-group-header:hover { background: var(--color-primary-glow); border-color: var(--accent); }
.nav-group-header .header-text { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.nav-group-header .arrow { font-size: 18px; color: var(--text-muted); transition: transform 0.3s; }
.nav-group.expanded .nav-group-header { background: var(--color-primary-glow); border-color: var(--accent); }
.nav-group.expanded .nav-group-header .arrow { transform: rotate(180deg); }

.nav-group-items { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; padding-left: 10px; }
.nav-group.expanded .nav-group-items { max-height: 600px; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; margin-top: 3px; border-radius: 6px;
  cursor: pointer; transition: var(--transition); color: var(--text-secondary);
  font-size: 11.5px; font-weight: 400;
}
.nav-item:hover { background: var(--color-primary-glow); color: var(--accent); }
.nav-item.active { background: var(--color-primary-glow); color: var(--accent); font-weight: 500; }
.nav-item .material-icons-round { font-size: 15px; }

/* ===== MAIN CONTENT ===== */
.main-content {
  margin-top: var(--topbar-height); padding: 28px;
  min-height: calc(100vh - var(--topbar-height)); transition: var(--transition);
}

/* Welcome */
.welcome-section { text-align: center; padding: 70px 20px; }
.welcome-section .welcome-icon { font-size: 72px; color: var(--accent); margin-bottom: 18px; opacity: 0.5; }
.welcome-section h2 {
  font-size: 26px; font-weight: 700; margin-bottom: 8px;
  background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.welcome-section p { color: var(--text-secondary); font-size: 13px; max-width: 380px; margin: 0 auto; }

/* Content Page */
.content-page {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px; min-height: 280px;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.content-page h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.content-page .subtitle { color: var(--text-muted); font-size: 12px; margin-bottom: 16px; }

/* ===== PENDING LIST (Workflow Engine) ===== */
.pending-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.pending-count {
  background: var(--accent-gradient); color: #fff; font-size: 11px; font-weight: 600;
  padding: 4px 12px; border-radius: 20px;
}
.pending-list { display: flex; flex-direction: column; gap: 10px; }
.pending-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); cursor: pointer; transition: var(--transition);
}
.pending-row:hover { border-color: var(--accent); background: var(--color-primary-glow); transform: translateX(3px); }
.pending-row .pending-summary { font-size: 12.5px; font-weight: 500; color: var(--text-primary); }
.pending-row .pending-planned { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.pending-row .pending-arrow { color: var(--accent); font-size: 20px; flex-shrink: 0; }
.pending-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.pending-empty .material-icons-round { font-size: 50px; opacity: 0.4; margin-bottom: 10px; display: block; }
.pending-loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 12px; }

/* ===== MODAL / POPUP FORM ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 3000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; visibility: hidden; transition: var(--transition); backdrop-filter: blur(4px);
}
.modal-overlay.active { opacity: 1; visibility: visible; }

.modal-box {
  background: var(--bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--border);
  width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); transform: scale(0.92) translateY(20px); transition: transform 0.3s ease;
}
.modal-overlay.active .modal-box { transform: scale(1) translateY(0); }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

.form-field { margin-bottom: 16px; }
.form-field label {
  display: block; font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
}
.form-field input[type="text"],
.form-field input[type="number"],
.form-field textarea,
.form-field select {
  width: 100%; padding: 11px 13px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text-primary);
  font-family: 'Poppins', sans-serif; outline: none; transition: var(--transition);
}
.form-field input:focus, .form-field textarea:focus, .form-field select:focus { border-color: var(--accent); }
.form-field textarea { resize: vertical; min-height: 70px; }

.form-field .readonly-display {
  padding: 11px 13px; background: rgba(255,171,64,0.08); border: 1px dashed var(--warning);
  border-radius: var(--radius-sm); font-size: 12.5px; color: var(--warning); font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.form-field .readonly-display .material-icons-round { font-size: 16px; }

.file-drop {
  border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 20px;
  text-align: center; cursor: pointer; transition: var(--transition); color: var(--text-muted); font-size: 12px;
}
.file-drop:hover { border-color: var(--accent); color: var(--accent); }
.file-drop input[type="file"] { display: none; }
.file-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.file-chip {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 6px; font-size: 11px; color: var(--text-secondary);
}
.file-chip .remove-file { color: var(--danger); cursor: pointer; font-size: 15px; }

.btn {
  flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none; cursor: pointer;
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; transition: var(--transition);
}
.btn-primary { background: var(--accent-gradient); color: #fff; }
.btn-primary:hover { box-shadow: 0 8px 20px var(--color-primary-glow-strong); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); }

.form-msg { text-align: center; padding: 10px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 14px; display: none; }
.form-msg.success { display: block; background: rgba(0,230,118,0.1); color: var(--success); border: 1px solid rgba(0,230,118,0.2); }
.form-msg.error { display: block; background: rgba(255,82,82,0.1); color: var(--danger); border: 1px solid rgba(255,82,82,0.2); }

/* ===== DATA TABLE (mirrors real sheet, per-step columns only) ===== */
.table-page { padding: 22px; }
.table-page-header { margin-bottom: 16px; }

.status-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.status-tab {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
  font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 500; transition: var(--transition);
  display: flex; align-items: center; gap: 6px;
}
.status-tab:hover { border-color: var(--accent); color: var(--accent); }
.status-tab.active { background: var(--accent-gradient); color: #fff; border-color: transparent; }
.status-tab-count {
  background: rgba(255,255,255,0.2); padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600;
}
.status-tab:not(.active) .status-tab-count { background: var(--border); }

.table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.table-search {
  flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 14px;
}
.table-search .material-icons-round { font-size: 18px; color: var(--text-muted); }
.table-search input {
  border: none; background: transparent; outline: none; color: var(--text-primary);
  font-family: 'Poppins', sans-serif; font-size: 13px; width: 100%;
}
.page-size-select {
  font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.page-size-select select {
  padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); font-family: 'Poppins', sans-serif;
  font-size: 12px; outline: none;
}

.table-scroll-wrap {
  overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md);
  max-height: 60vh; overflow-y: auto;
}
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
.data-table thead th {
  position: sticky; top: 0; background: var(--bg-secondary); color: var(--text-primary);
  font-weight: 600; text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; z-index: 2;
}
.data-table thead th:hover { color: var(--accent); }
.data-table thead th.col-action { cursor: default; }
.data-table thead th.col-action:hover { color: var(--text-primary); }

.col-search-row th { top: 41px; background: var(--bg-secondary); padding: 6px 8px; z-index: 1; }
.col-search-row input {
  width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); font-family: 'Poppins', sans-serif;
  font-size: 11px; outline: none; box-sizing: border-box;
}
.col-search-row input:focus { border-color: var(--accent); }

.data-table tbody td {
  padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-secondary);
}
.data-table tbody tr:hover td { background: var(--color-primary-glow); }
.table-empty-cell { text-align: center !important; padding: 40px !important; color: var(--text-muted); }

.btn-fill {
  padding: 6px 14px; border-radius: 8px; border: none; background: var(--accent-gradient);
  color: #fff; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer;
  transition: var(--transition);
}
.btn-fill:hover { box-shadow: 0 6px 16px var(--color-primary-glow-strong); }
.status-badge-done {
  padding: 5px 12px; border-radius: 8px; background: rgba(0,230,118,0.12); color: var(--success);
  font-size: 11px; font-weight: 600;
}

.table-pagination {
  display: flex; align-items: center; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; gap: 10px;
}
.pagination-info { font-size: 11.5px; color: var(--text-muted); }
.pagination-controls { display: flex; align-items: center; gap: 10px; }
.page-btn {
  padding: 7px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary); cursor: pointer;
  font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 500; transition: var(--transition);
}
.page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-indicator { font-size: 12px; color: var(--text-secondary); }

/* ===== APPEARANCE DRAWER (Display Mode + Color Scheme + Live Preview) ===== */
.appearance-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 4000;
  opacity: 0; visibility: hidden; transition: var(--transition); backdrop-filter: blur(4px);
}
.appearance-overlay.active { opacity: 1; visibility: visible; }

.appearance-drawer {
  position: fixed; top: 0; right: -420px; width: 400px; max-width: 92vw;
  height: 100vh; background: var(--bg-surface); z-index: 4001;
  border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
  transition: right 0.32s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
}
.appearance-drawer.open { right: 0; }

.appearance-drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.appearance-drawer-title {
  display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--text-primary);
}
.appearance-drawer-title .material-icons-round { color: var(--color-primary); font-size: 20px; }

.appearance-drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.appearance-section { margin-bottom: 26px; }
.appearance-section:last-child { margin-bottom: 0; }
.appearance-section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 12px;
}

/* Display Mode segmented tiles */
.display-mode-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode-tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 14px 8px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
  font-family: 'Poppins', sans-serif;
}
.mode-tile .material-icons-round { font-size: 22px; color: var(--text-muted); }
.mode-tile-label { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.mode-tile-desc { font-size: 9.5px; color: var(--text-muted); text-align: center; line-height: 1.2; }
.mode-tile:hover { border-color: var(--color-primary); }
.mode-tile.active {
  border-color: var(--color-primary); background: var(--color-primary-glow);
  box-shadow: 0 0 0 3px var(--color-primary-glow);
}
