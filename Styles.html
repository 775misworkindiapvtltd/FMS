.column-panel.open { max-height: calc(100vh - var(--topbar-height) - 225px); padding: 12px; }
.column-panel-title { padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--text-primary); font-size: 11px; }
.column-panel-item { padding: 7px 6px; }
.column-panel-reset { background: var(--surface-soft); }
.table-scroll-wrap { margin-top: 10px; border-radius: 10px; background: var(--surface-elevated); box-shadow: var(--shadow-soft); }
.data-table { background: var(--surface-elevated); }
.data-table thead th { background: var(--table-header-bg); color: var(--table-header-text); border-bottom-color: rgba(255,255,255,.25); padding: 9px 10px; }
.data-table thead th .th-label:hover { color: #dbeafe; }
.col-filter-btn { color: rgba(255,255,255,.65); }
.col-filter-btn:hover, .col-filter-btn.active { color: #fff; background: rgba(255,255,255,.16); }
.data-table tbody tr:nth-child(even) td { background: rgba(148,163,184,.045); }
.data-table tbody td { padding: 8px 10px; border-bottom-color: var(--border); }
.data-table tbody tr:hover td { background: var(--color-primary-glow); }
.col-serial { width: 54px; min-width: 54px; max-width: 54px; }
.col-action { min-width: 116px; }
.data-table thead th.col-serial { position: sticky; left: 0; z-index: 6; background: var(--table-header-bg); }
.data-table tbody td.col-serial { position: sticky; left: 0; z-index: 3; background: var(--surface-elevated); box-shadow: 3px 0 5px rgba(15,23,42,.05); }
.data-table thead th.col-action { position: sticky; right: 0; z-index: 6; background: var(--table-header-bg); box-shadow: -4px 0 7px rgba(15,23,42,.12); }
.data-table tbody td.col-action { position: sticky; right: 0; z-index: 3; background: var(--surface-elevated); box-shadow: -4px 0 7px rgba(15,23,42,.07); }
.data-table tbody tr:nth-child(even) td.col-serial,
.data-table tbody tr:nth-child(even) td.col-action { background: var(--surface-soft); }
.data-table tbody tr:hover td.col-serial,
.data-table tbody tr:hover td.col-action { background: var(--surface-soft); }
.multi-step-table thead tr.step-group-row th { color: #fff; background: var(--table-group-bg); border-bottom-color: rgba(255,255,255,.22); }
.multi-step-table thead tr.step-group-row th.group-base,
.multi-step-table thead tr.step-group-row th.col-action { color: #fff; background: var(--table-details-bg); }
.multi-step-table thead tr.step-group-row th.col-serial { position: sticky; left: 0; z-index: 8; }
.multi-step-table thead tr.step-group-row th.col-action { position: sticky; right: 0; z-index: 8; }
.multi-step-table th.col-group-start, .multi-step-table td.col-group-start { border-left-color: #60a5fa; }
.btn-fill { padding: 6px 12px; border-radius: 7px; white-space: nowrap; }
.step-chip { padding: 5px 8px; }

/* Professional pagination with row-size control at the bottom */
.table-pagination { min-height: 46px; margin-top: 0; padding: 7px 4px 0; overflow: visible; }
.pagination-info { color: var(--text-secondary); font-size: 10.5px; }
.pagination-info strong { color: var(--text-primary); font-weight: 600; }
.pagination-right { display: flex; align-items: center; gap: 18px; }
.page-size-select { font-size: 10.5px; }
.page-size-select select { padding: 5px 24px 5px 8px; background: var(--surface-elevated); }
.pagination-controls { gap: 6px; }
.page-btn { display: inline-flex; align-items: center; gap: 3px; padding: 5px 9px; background: var(--surface-elevated); }
.page-btn .material-icons-round { font-size: 15px; }
.page-indicator { padding: 0 6px; }

/* Text size now lives with the rest of Appearance settings */
.font-size-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.font-size-tiles .font-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 5px; background: var(--bg-card); }
.font-size-tiles .font-btn strong { font-size: 13px; }
.font-size-tiles .font-btn span { font-size: 8.5px; font-weight: 500; }

/* ===========================================================
   COMPACT DENSITY PASS
   The application is an operational data tool, so vertical space
   belongs to rows - not to padding, hero blocks or decoration.
   Every chrome element below is driven by density tokens that ALSO
   respond to the A / A+ / A++ setting, so "small" genuinely compacts
   the whole workspace instead of only shrinking table text.
   =========================================================== */
:root {
  --topbar-height: 52px;
  --density-gap: 8px;
  --workspace-pad: 9px;
  --row-pad-y: 5px;
  --cell-pad-x: 9px;
  --control-h: 30px;
  --strip-h: 38px;
}
body.font-small {
  --density-gap: 6px; --workspace-pad: 7px; --row-pad-y: 3px;
  --cell-pad-x: 7px; --control-h: 27px; --strip-h: 34px;
}
body.font-large {
  --density-gap: 10px; --workspace-pad: 12px; --row-pad-y: 8px;
  --cell-pad-x: 11px; --control-h: 34px; --strip-h: 44px;
}

.main-content { padding: var(--workspace-pad); }

/* Header chrome scaled down to match the slimmer bar */
.topbar { padding: 0 14px; }
.topbar-logo-box { width: 30px; height: 30px; border-radius: 8px; }
.topbar-logo-box .material-icons-round { font-size: 16px; }
.topbar-title { font-size: 13.5px; }
.topbar .icon-btn { width: 30px; height: 30px; }
.topbar .icon-btn .material-icons-round { font-size: 17px; }
.topbar-action-btn { height: 30px; padding: 0 10px; font-size: 11px; }
.topbar-action-btn .material-icons-round { font-size: 16px; }
.topbar .user-avatar-chip { padding: 2px 9px 2px 2px; }
.topbar .user-avatar-initials { width: 24px; height: 24px; font-size: 10px; }
.sidebar-header { min-height: var(--topbar-height); height: var(--topbar-height); padding: 8px 10px; }
.sidebar-brand-mark { width: 30px; height: 30px; flex-basis: 30px; font-size: 16px; }

/* Slim single-line context strip (title + workflow + view switcher) */
.table-page-header {
  min-height: var(--strip-h); padding: 0 10px; gap: 10px;
  border-radius: 9px 9px 0 0;
}
.table-page-heading { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.table-page-heading h1 {
  margin: 0; font-size: calc(13px * var(--content-font-scale)); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.table-page-eyebrow {
  display: inline; padding-left: 8px; border-left: 1px solid var(--border);
  font-size: calc(9.5px * var(--content-font-scale)); letter-spacing: .5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.view-switcher { padding: 2px; }
.view-switch-btn {
  min-width: 0; height: calc(var(--control-h) - 6px); padding: 0 10px;
  font-size: calc(10.5px * var(--content-font-scale));
}
.view-switch-btn .material-icons-round { font-size: 14px; }

/* Slim utility toolbar */
.table-utility-toolbar { min-height: var(--strip-h); padding: 4px 8px; gap: 8px; }
.status-tab { height: var(--control-h); padding: 0 9px; }
.table-toolbar-actions { gap: 5px; }
.table-search { flex: 0 1 250px; min-width: 150px; padding: 0 9px; height: var(--control-h); }
.table-search input { font-size: calc(11.5px * var(--content-font-scale)); }
.toolbar-btn { height: var(--control-h); padding: 0 9px; }

/* Dense data grid - narrow rows, tight cells, compact headers */
.table-scroll-wrap { margin-top: var(--density-gap); border-radius: 8px; }
.data-table { font-size: calc(11.5px * var(--content-font-scale)); }
.data-table thead th {
  padding: 5px var(--cell-pad-x); font-size: calc(10.5px * var(--content-font-scale));
  line-height: 1.25; border-bottom-width: 1px;
}
.data-table tbody td {
  padding: var(--row-pad-y) var(--cell-pad-x); line-height: 1.3;
}
.th-inner { gap: 3px; }
.col-filter-btn { width: 17px; height: 17px; }
.col-filter-btn .material-icons-round { font-size: 12px; }
.col-serial { width: auto; min-width: 0; max-width: none; }
.col-serial-sizer { width: 44px; }
.col-action { width: auto; min-width: 0; max-width: none; }
.col-action-sizer { width: 104px; }
.multi-step-table thead tr.step-group-row th { padding: 4px var(--cell-pad-x); font-size: calc(9.5px * var(--content-font-scale)); }
.multi-step-table thead tr.step-group-row + tr th { top: 25px; }
.btn-fill { padding: 4px 10px; font-size: calc(10px * var(--content-font-scale)); }
.status-badge-done { padding: 3px 8px; }
.step-chip { padding: 3px 7px; }
.step-chips { gap: 3px; }

/* Every column can be resized from the Columns panel. System columns are
   always visible but expose the same exact-width controls as data columns. */
.column-panel { width: 390px; }
.column-panel.open { padding: 10px; }
.column-panel-title { margin-bottom: 3px; padding-bottom: 0; border-bottom: 0; }
.column-panel-hint { padding-bottom: 7px; margin-bottom: 6px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 9.5px; line-height: 1.35; }
.column-panel-section-title { margin: 8px 2px 4px; color: var(--text-muted); font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
.column-config-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
  min-height: 34px; padding: 4px 3px; border-bottom: 1px solid var(--border);
}
.column-config-row:hover { background: var(--color-primary-glow); }
.column-config-label { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-primary); font-size: 10.5px; cursor: pointer; }
.column-config-label > .material-icons-round:first-child { color: var(--text-muted); font-size: 14px; }
.column-config-label input { flex: 0 0 auto; margin: 0; accent-color: var(--color-primary); }
.column-config-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.column-config-system .column-config-label { cursor: default; }
.column-width-editor { display: flex; align-items: center; gap: 3px; }
.column-width-step, .column-width-reset {
  width: 23px; height: 23px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 5px; background: var(--surface-soft); color: var(--text-secondary);
  font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
}
.column-width-step:hover, .column-width-reset:hover { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-glow); }
.column-width-reset .material-icons-round { font-size: 13px; }
.column-width-input {
  width: 49px; height: 23px; padding: 0 3px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface-elevated); color: var(--text-primary); outline: none; text-align: right;
  font-family: 'Poppins', sans-serif; font-size: 9.5px;
}
.column-width-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-glow); }
.column-width-unit { color: var(--text-muted); font-size: 8.5px; }
.column-panel-footer {
  position: sticky; bottom: -10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin: 7px -3px -3px; padding: 7px 3px 3px; background: var(--surface-elevated); border-top: 1px solid var(--border);
}
