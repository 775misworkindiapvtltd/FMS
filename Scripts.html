<script>
// ============================================
// FMS - GLOBAL SCRIPTS (Shared across pages)
// ============================================

var FMS_CLIENT_BUILD_ID = '2026-07-22-column-width-2';

var FMS = {
  sidebarOpen: true,
  currentTheme: 'dark',
  currentFontSize: 'medium',
  tableCache: {},        // "header|||step" -> { columns, rows, fetchedAt }
  multiTableCache: {},   // header -> { columns, columnGroups, steps, rows, fetchedAt }
  permissionsCache: null,
  lastSyncTime: null,
  autoRefreshTimer: null,
  clockTimer: null,
  syncInFlight: false,
  AUTO_REFRESH_MS: 10 * 60 * 1000, // 10 minutes

  // 'step'  = Step View  - one step at a time (pick it in the sidebar)
  // 'table' = Table View - the whole pipeline side by side, showing only
  //           the steps this user is permitted to action.
  // Remembered across sessions in localStorage (see VIEW_STORAGE_KEY).
  viewMode: 'step'
};

var VIEW_STORAGE_KEY = 'fms_view_mode';

// Defensive localStorage access (private browsing / storage disabled)
function fmsStoreGet(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
function fmsStoreSet(key, val) { try { window.localStorage.setItem(key, val); } catch (e) { /* ignore */ } }

function getStoredViewMode() {
  var v = fmsStoreGet(VIEW_STORAGE_KEY);
  return (v === 'table' || v === 'step') ? v : 'step';
}

/**
 * Switches between Step View and Table View, remembers the choice for
 * next time, and immediately re-renders whatever the user is looking at.
 * Called by the segmented view-switcher in the table toolbar.
 */
function setViewMode(mode) {
  if (mode !== 'step' && mode !== 'table') return;
  if (FMS.viewMode === mode) return;
  FMS.viewMode = mode;
  fmsStoreSet(VIEW_STORAGE_KEY, mode);

  // Nothing open yet (e.g. on Home) - the new mode just applies next time
  // a step/header is opened from the sidebar.
  if (!FMS.currentHeader) return;

  if (mode === 'table') {
    updateTopbarBreadcrumb('All My Steps', FMS.currentHeader);
    loadMultiStepTable(FMS.currentHeader);
  } else {
    // Coming back to Step View: reopen the step the user last worked on
    // for this header, falling back to their first permitted step there.
    var step = FMS.currentStep || firstPermittedStepFor(FMS.currentHeader);
    if (!step) return;
    FMS.currentStep = step;
    updateTopbarBreadcrumb(step, FMS.currentHeader);
    loadStepTable(FMS.currentHeader, step);
  }
}

function firstPermittedStepFor(headerName) {
  var perms = FMS.permissionsCache || {};
  var steps = perms[headerName];
  if (steps && steps.length) return steps[0];
  for (var h in perms) {
    if (String(h).trim().toUpperCase() === String(headerName).trim().toUpperCase()) {
      return (perms[h] && perms[h].length) ? perms[h][0] : null;
    }
  }
  return null;
}

/**
 * Segmented Step View / Table View switcher, rendered at the start of the
 * table toolbar line in BOTH views so it's always reachable.
 */
function viewSwitcherHtml() {
  return '<div class="view-switcher" role="group" aria-label="View mode">' +
    '<button type="button" class="view-switch-btn' + (FMS.viewMode === 'step' ? ' active' : '') + '" ' +
      'onclick="setViewMode(\'step\')" title="Step View - work on one step at a time">' +
      '<span class="material-icons-round">view_agenda</span>Step</button>' +
    '<button type="button" class="view-switch-btn' + (FMS.viewMode === 'table' ? ' active' : '') + '" ' +
      'onclick="setViewMode(\'table\')" title="Table View - all my steps side by side">' +
      '<span class="material-icons-round">table_chart</span>Table</button>' +
    '</div>';
}

/**
 * Re-renders whichever data view is currently on screen. Every toolbar
 * control (sorting, filtering, paging, column show/hide, resizing) calls
 * this instead of renderDataTable() directly, so all of them work
 * identically in both views.
 */
function rerenderCurrentTable() {
  // Width/visibility controls rebuild the table synchronously. Preserve
  // the Columns panel's own scroll position so editing a lower column
  // does not jump the user back to the first item after every click.
  var oldPanel = document.getElementById('columnPanel');
  var panelScrollTop = oldPanel ? oldPanel.scrollTop : 0;
  if (FMS.viewMode === 'table') renderMultiStepTable(FMS.currentHeader);
  else renderDataTable(FMS.currentHeader, FMS.currentStep);
  var newPanel = document.getElementById('columnPanel');
  if (newPanel && panelScrollTop) newPanel.scrollTop = panelScrollTop;
}

// ===== LIVE CLOCK (top-right, ticks every second) =====
function startLiveClock() {
  updateLiveClock();
  if (FMS.clockTimer) clearInterval(FMS.clockTimer);
  FMS.clockTimer = setInterval(updateLiveClock, 1000);
}

/**
 * Auto-shrinks the topbar's font/spacing (via 2 escalating CSS classes)
 * whenever its content is about to overflow the available width - this
 * lets the header stay on ONE line for as long as realistically
 * possible, instead of wrapping to a 2nd row or forcing a horizontal
 * scrollbar. Runs on load, window resize, and sidebar expand/collapse
 * (since that changes how much width the topbar has).
 *
 * Strategy: start from the least-compact state, measure real overflow
 * (scrollWidth > clientWidth), and escalate through 2 levels only if
 * still overflowing at each step. Always tries to de-escalate back to
 * normal first, so it recovers cleanly if the window grows again.
 */
function autoShrinkTopbar() {
  var topbar = document.querySelector('.topbar');
  if (!topbar) return;

  topbar.classList.remove('topbar-compact', 'topbar-ultra-compact');

  if (isTopbarOverflowing(topbar)) {
    topbar.classList.add('topbar-compact');
  }
  if (isTopbarOverflowing(topbar)) {
    topbar.classList.add('topbar-ultra-compact');
  }
}

function isTopbarOverflowing(topbar) {
  // A small 2px tolerance avoids flip-flopping right at the exact boundary
  return topbar.scrollWidth > topbar.clientWidth + 2;
}

var topbarResizeDebounce = null;
function scheduleTopbarAutoShrink() {
  if (topbarResizeDebounce) clearTimeout(topbarResizeDebounce);
  topbarResizeDebounce = setTimeout(autoShrinkTopbar, 80);
}

function updateLiveClock() {
  var el = document.getElementById('liveClock');
  if (!el) return;
  var now = new Date();
  var pad = function(n) { return (n < 10 ? '0' : '') + n; };
  el.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}

// ===== AUTO-REFRESH (background, silent - no spinners, no reload feel) =====
function startAutoRefresh() {
  if (FMS.autoRefreshTimer) clearInterval(FMS.autoRefreshTimer);
  FMS.autoRefreshTimer = setInterval(function() {
    silentRefreshCurrentView();
  }, FMS.AUTO_REFRESH_MS);
}

function setSyncingState(isSyncing) {
  var icon = document.getElementById('syncIcon');
  if (icon) icon.classList.toggle('syncing', isSyncing);
  renderLastUpdatedPill();
}

// Same "DD Mon YY HH:MM:SS" style used everywhere else in FMS (table
// cells, popup form Planned value, pending-list captions) - kept as a
// small client-side mirror of TAT_Calculator.gs's formatResult() so the
// topbar clock/status doesn't need a round-trip to the server.
var FMS_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatFmsDate(d) {
  var pad2 = function(n) { return ('0' + n).slice(-2); };
  var dd = pad2(d.getDate()) + ' ' + FMS_MONTHS[d.getMonth()] + ' ' + pad2(d.getFullYear() % 100);
  // Mirror formatResult() in TAT_Calculator.gs: omit the time entirely
  // when it's exactly 00:00:00 (a pure date with no meaningful time).
  if (d.getHours() === 0 && d.getMinutes() === 0 && d.getSeconds() === 0) return dd;
  return dd + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}

var LAST_SYNC_STORAGE_KEY = 'fms_last_sync_time';

/**
 * Always-visible "Updated: ..." pill in the topbar (every page, not just
 * Home) - shows the real last-successful-sync time, persisted across page
 * reloads so it's never blank/wrong right after opening the app. Turns
 * green with a spinning icon while a background sync is in flight (see
 * setSyncingState()), so refreshing is always visibly happening without
 * ever blocking the UI.
 */
function setLastUpdatedNow(changed) {
  FMS.lastSyncTime = new Date();
  fmsStoreSet(LAST_SYNC_STORAGE_KEY, FMS.lastSyncTime.getTime());
  renderLastUpdatedPill();
  var el = document.getElementById('lastUpdatedText');
  if (el) el.textContent = 'Updated: ' + formatFmsDate(FMS.lastSyncTime);
  if (changed) flashLastUpdatedPill();
}

function flashLastUpdatedPill() {
  var pill = document.getElementById('topbarLastUpdated');
  if (!pill) return;
  pill.classList.add('updated-flash');
  setTimeout(function() { pill.classList.remove('updated-flash'); }, 2200);
}

function renderLastUpdatedPill() {
  var pill = document.getElementById('topbarLastUpdated');
  if (!pill) return;
  if (FMS.syncInFlight) {
    pill.classList.add('is-syncing');
    pill.innerHTML = '<span class="material-icons-round sync-icon syncing">sync</span><span>Refreshing...</span>';
    return;
  }
  pill.classList.remove('is-syncing');
  if (!FMS.lastSyncTime) {
    pill.innerHTML = '<span class="material-icons-round sync-icon">sync</span><span>Loading latest data...</span>';
    return;
  }
  pill.innerHTML = '<span class="material-icons-round sync-icon">check_circle</span><span>Updated: ' + formatFmsDate(FMS.lastSyncTime) + '</span>';
}

/**
 * Restores the last-known sync time from a previous session/page load so
 * the pill never shows "Loading latest data..." right after the browser
 * itself was refreshed, even before the first background fetch completes.
 */
function restoreLastSyncTime() {
  var stored = fmsStoreGet(LAST_SYNC_STORAGE_KEY);
  var ms = parseInt(stored, 10);
  if (isFinite(ms) && ms > 0) FMS.lastSyncTime = new Date(ms);
  renderLastUpdatedPill();
}

/**
 * Silently re-fetch permissions (sidebar) + current table (if any) in the
 * background. Does NOT show any loading spinner - only a small sync icon
 * animation - and only touches the DOM if the data actually changed.
 */
function silentRefreshCurrentView() {
  if (FMS.syncInFlight) return;
  if (typeof FMS_SESSION === 'undefined') return;
  FMS.syncInFlight = true;
  setSyncingState(true);

  var pending = 1;
  var anyChanged = false;

  function done() {
    pending--;
    if (pending <= 0) {
      FMS.syncInFlight = false;
      setSyncingState(false);
      setLastUpdatedNow(anyChanged);
    }
  }

  // Refresh sidebar permissions silently (remembers headers/questions, just checks for changes)
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        var newStr = JSON.stringify(res.permissions);
        var oldStr = JSON.stringify(FMS.permissionsCache);
        if (newStr !== oldStr) {
          FMS.permissionsCache = res.permissions;
          renderSidebar(res.permissions);
          anyChanged = true;
        }
        persistPermissionsCache();
      }
      done();
    })
    .withFailureHandler(function() { done(); })
    .getUserPermissions(FMS_SESSION.userName);

  // Refresh Home dashboard summary silently, if user is currently on it
  if (!FMS.currentHeader && !FMS.currentStep) {
    pending++;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          var newStr = JSON.stringify(res);
          var oldStr = JSON.stringify(FMS.homeSummaryCache);
          if (newStr !== oldStr) {
            FMS.homeSummaryCache = res;
            FMS.homeLastUpdated = new Date();
            if (!FMS.currentHeader && !FMS.currentStep && document.getElementById('mainContent')) {
              renderHomeDashboard(res, false, true);
            }
            anyChanged = true;
          }
          persistHomeSummaryCache();
        }
        done();
      })
      .withFailureHandler(function() { done(); })
      .wfGetHomeSummary(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, FMS_SESSION.userName);
  }

  // Refresh the wide Table View silently, if that's what's on screen
  if (FMS.viewMode === 'table' && FMS.currentHeader) {
    pending++;
    var multiHeader = FMS.currentHeader;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          var schemasChanged = cacheFormSchemasFromTable(multiHeader, null, res);
          var newStr = JSON.stringify(res.rows) + JSON.stringify(res.columns);
          var cachedMulti = FMS.multiTableCache[multiHeader];
          var oldStr = cachedMulti ? (JSON.stringify(cachedMulti.rows) + JSON.stringify(cachedMulti.columns)) : null;
          if (newStr !== oldStr) {
            FMS.multiTableCache[multiHeader] = res;
            if (FMS.viewMode === 'table' && FMS.currentHeader === multiHeader) {
              applyMultiTableData(res);
              if (document.getElementById('tableContainer')) renderMultiStepTable(multiHeader);
            }
            anyChanged = true;
          }
          if (schemasChanged) anyChanged = true;
        }
        done();
      })
      .withFailureHandler(function() { done(); })
      .wfGetMultiStepTableData(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, multiHeader, FMS_SESSION.userName);
  }

  // Refresh current single-step table silently, if that's what's on screen
  if (FMS.viewMode !== 'table' && FMS.currentHeader && FMS.currentStep) {
    pending++;
    var refreshHeader = FMS.currentHeader;
    var refreshStep = FMS.currentStep;
    var cacheKey = refreshHeader + '|||' + refreshStep;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          var schemaChanged = cacheFormSchemasFromTable(refreshHeader, refreshStep, res);
          var newStr = JSON.stringify(res.rows) + JSON.stringify(res.columns);
          var cached = FMS.tableCache[cacheKey];
          var oldStr = cached ? (JSON.stringify(cached.rows) + JSON.stringify(cached.columns)) : null;
          if (newStr !== oldStr) {
            FMS.tableCache[cacheKey] = {
              columns: res.columns,
              columnTypes: res.columnTypes || [],
              defaultHiddenCols: res.defaultHiddenCols || [],
              baseColCount: res.baseColCount || 0,
              rows: res.rows,
              fetchedAt: new Date()
            };
            // The response may arrive after the user has opened another
            // step. Update the captured step's cache regardless, but never
            // reconcile its schema against or mutate the currently visible
            // table unless that exact step is still active.
            var stillViewingCapturedStep = FMS.viewMode !== 'table' &&
              FMS.currentHeader === refreshHeader &&
              FMS.currentStep === refreshStep &&
              FMS.table.cacheKey === cacheKey;
            if (stillViewingCapturedStep) {
              FMS.table.columns = res.columns;
              FMS.table.columnTypes = res.columnTypes || [];
              reconcileColumnPrefsForColumns(FMS.table.columns);
              FMS.table.rows = res.rows;
              applyDefaultHiddenCols(res.defaultHiddenCols);
              if (document.getElementById('tableContainer')) rerenderCurrentTable();
            }
            anyChanged = true;
          }
          if (schemaChanged) anyChanged = true;
        }
        done();
      })
      .withFailureHandler(function() { done(); })
      .wfGetStepTableData(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, refreshHeader, refreshStep);
  }
}

// ===== SIDEBAR =====
// Desktop uses a deliberate, stable expanded/collapsed state (never
// hover-expands over the workspace). Mobile uses the same control as an
// overlay drawer. The desktop preference is remembered between sessions.
var SIDEBAR_STORAGE_KEY = 'fms_sidebar_state';
var FONT_SIZE_STORAGE_KEY = 'fms_font_size';

function isMobileLayout() {
  return window.matchMedia ? window.matchMedia('(max-width: 768px)').matches : window.innerWidth <= 768;
}

function initializeSidebar() {
  FMS.wasMobileLayout = isMobileLayout();
  if (FMS.wasMobileLayout) {
    closeSidebar(false);
    return;
  }
  var saved = fmsStoreGet(SIDEBAR_STORAGE_KEY);
  if (saved === 'collapsed') closeSidebar(false);
  else openSidebar(false);
}

function toggleSidebar() {
  if (FMS.sidebarOpen) closeSidebar(true); else openSidebar(true);
}

function updateSidebarControl() {
  var expanded = FMS.sidebarOpen;
  var menuIcon = document.querySelector('.topbar-menu-btn .material-icons-round');
  var sideIcon = document.querySelector('.sidebar-toggle-btn .material-icons-round');
  var sideButton = document.querySelector('.sidebar-toggle-btn');
  var menuButton = document.querySelector('.topbar-menu-btn');
  if (menuIcon) menuIcon.textContent = expanded ? 'menu_open' : 'menu';
  if (sideIcon) sideIcon.textContent = expanded ? 'chevron_left' : 'chevron_right';
  if (sideButton) sideButton.title = expanded ? 'Collapse navigation' : 'Expand navigation';
  if (menuButton) menuButton.title = expanded ? 'Collapse navigation' : 'Expand navigation';
}

function openSidebar(persist) {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.add('pinned');
  document.body.classList.add('sidebar-expanded');
  if (overlay) overlay.classList.toggle('active', isMobileLayout());
  FMS.sidebarOpen = true;
  if (persist !== false && !isMobileLayout()) fmsStoreSet(SIDEBAR_STORAGE_KEY, 'expanded');
  updateSidebarControl();
  scheduleTopbarAutoShrink();
}

function closeSidebar(persist) {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.remove('pinned');
  document.body.classList.remove('sidebar-expanded');
  if (overlay) overlay.classList.remove('active');
  FMS.sidebarOpen = false;
  if (persist !== false && !isMobileLayout()) fmsStoreSet(SIDEBAR_STORAGE_KEY, 'collapsed');
  updateSidebarControl();
  scheduleTopbarAutoShrink();
}

function closeSidebarAfterNavigation() {
  if (isMobileLayout()) closeSidebar(false);
}

function handleDashboardResize() {
  scheduleTopbarAutoShrink();
  var mobile = isMobileLayout();
  if (FMS.wasMobileLayout === mobile) return;
  FMS.wasMobileLayout = mobile;
  if (mobile) closeSidebar(false);
  else initializeSidebar();
}

// ===== THEME =====
// Delegates to the global FMS Theme Engine (ThemeEngine.html) so the quick
// topbar toggle stays perfectly in sync with the full Appearance drawer
// (localStorage, data-theme on <html>, system-mode awareness, etc).
function toggleTheme() {
  if (typeof FMSTheme === 'undefined') return; // ThemeEngine not loaded (defensive)
  var resolved = FMSTheme.getResolvedTheme();
  FMSTheme.setDisplayMode(resolved === 'dark' ? 'light' : 'dark');
  FMS.currentTheme = FMSTheme.getResolvedTheme();
}

// ===== FONT SIZE =====
function restoreFontSize() {
  var stored = fmsStoreGet(FONT_SIZE_STORAGE_KEY);
  setFontSize(stored === 'small' || stored === 'large' ? stored : 'medium', false);
}

function setFontSize(size, persist) {
  if (size !== 'small' && size !== 'medium' && size !== 'large') size = 'medium';
  document.body.classList.remove('font-small', 'font-medium', 'font-large');
  document.body.classList.add('font-' + size);
  FMS.currentFontSize = size;
  if (persist !== false) fmsStoreSet(FONT_SIZE_STORAGE_KEY, size);

  var btns = document.querySelectorAll('.font-btn');
  btns.forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-font-size') === size);
  });
}

// ===== SIDEBAR NAVIGATION =====
function renderSidebar(permissions) {
  var nav = document.getElementById('sidebarNavGroups');
  var html = '';

  for (var header in permissions) {
    var items = permissions[header];
    html += '<div class="nav-group">';
    html += '<div class="nav-group-header" onclick="toggleGroup(this)" title="' + escapeAttr(header) + '">';
    html += '<span class="material-icons-round group-icon">folder</span>';
    html += '<span class="header-text">' + escapeHtml(header) + '</span>';
    html += '<span class="material-icons-round arrow">expand_more</span>';
    html += '</div>';
    html += '<div class="nav-group-items">';
    for (var i = 0; i < items.length; i++) {
      html += '<div class="nav-item" onclick="openPage(\'' + escapeAttr(items[i]) + '\', \'' + escapeAttr(header) + '\', event)" title="' + escapeAttr(items[i]) + '">';
      html += '<span class="material-icons-round">chevron_right</span>';
      html += '<span>' + escapeHtml(items[i]) + '</span>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  if (!html) {
    html = '<div style="padding:30px; text-align:center; color:var(--text-muted); font-size:12px;">No permissions assigned.</div>';
  }

  nav.innerHTML = html;
}

function toggleGroup(el) {
  var group = el.parentElement;

  // BUG FIX: the sidebar no longer auto-expands on hover (replaced with a
  // deliberate pin/collapse toggle for a more stable feel). That broke
  // clicking a folder while the rail is collapsed - the accordion WAS
  // toggling "expanded" internally, but ".sidebar:not(.pinned)
  // .nav-group-items { max-height: 0 !important; }" kept every step
  // hidden, so nothing visibly happened. Clicking a folder now pins the
  // sidebar open FIRST (if it isn't already), so its steps are always
  // actually visible, exactly like before.
  var sidebar = document.getElementById('sidebar');
  var wasCollapsed = sidebar && !sidebar.classList.contains('pinned');
  if (wasCollapsed) openSidebar(!isMobileLayout());

  // Close all other groups
  var allGroups = document.querySelectorAll('.nav-group');
  allGroups.forEach(function(g) {
    if (g !== group) g.classList.remove('expanded');
  });

  // If the sidebar had to be expanded just now, always OPEN this group
  // (don't toggle it closed) - a click on a collapsed folder should
  // always reveal its steps, never collapse something invisible.
  if (wasCollapsed) group.classList.add('expanded');
  else group.classList.toggle('expanded');
}

function openPage(pageName, headerName, evt) {
  closeSidebarAfterNavigation();
  // window.event is deprecated/unreliable (undefined in Firefox and in
  // some sandboxed iframes) - this was the actual root cause of sidebar
  // clicks silently doing nothing. The onclick handlers now pass the
  // real event explicitly; window.event is kept only as a last-resort
  // fallback for any older inline handler that hasn't been updated.
  var clickEvent = evt || window.event;

  // Mark active nav item (Home item included, so it un-highlights too)
  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(item) { item.classList.remove('active'); });
  if (clickEvent && clickEvent.target && clickEvent.target.closest) {
    var clicked = clickEvent.target.closest('.nav-item');
    if (clicked) clicked.classList.add('active');
  }

  FMS.currentHeader = headerName;
  FMS.currentStep = pageName;

  // Table View is per-HEADER (the whole pipeline at once), so clicking any
  // step of a header opens that header's wide table instead of the single
  // step - while still remembering which step was clicked, so switching
  // back to Step View returns the user exactly where they expected.
  if (FMS.viewMode === 'table') {
    updateTopbarBreadcrumb('All My Steps', headerName);
    loadMultiStepTable(headerName);
  } else {
    updateTopbarBreadcrumb(pageName, headerName);
    loadStepTable(headerName, pageName);
  }
}

/**
 * Shows/clears the "Step / Header" breadcrumb in the TOPBAR itself,
 * right after the "FMS Fashion" title (on the same single line) - per
 * user request, instead of it living inside the table's own toolbar row.
 */
function updateTopbarBreadcrumb(stepName, headerName) {
  var el = document.getElementById('topbarBreadcrumb');
  if (!el) return;
  if (!stepName) {
    el.innerHTML = '';
  } else {
    el.innerHTML = '<span class="material-icons-round">assignment</span>' +
      '<strong>' + escapeHtml(stepName) + '</strong>' +
      '<span class="breadcrumb-sep">/</span>' + escapeHtml(headerName);
  }
  scheduleTopbarAutoShrink(); // breadcrumb text changes the topbar's content width
}

// ===== HOME DASHBOARD (summary of all assigned Steps) =====
function goHome() {
  closeSidebarAfterNavigation();
  FMS.currentHeader = null;
  FMS.currentStep = null;
  updateTopbarBreadcrumb(null, null);

  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(item) { item.classList.remove('active'); });
  var homeItem = document.getElementById('navHomeItem');
  if (homeItem) homeItem.classList.add('active');

  loadHomeDashboard();
}

var HOME_SUMMARY_STORAGE_KEY = 'fms_home_summary_cache';
var PERMISSIONS_STORAGE_KEY = 'fms_permissions_cache';
var FORM_SCHEMA_STORAGE_KEY = 'fms_form_schema_cache_v2';
var FORM_SCHEMA_CACHE_MS = 30 * 60 * 1000; // fast reopen, refreshed silently every 30 minutes

/**
 * Persists the Home summary + sidebar permissions to localStorage so that
 * even a full BROWSER reload (not just switching tabs inside the app)
 * shows the last-known data instantly, instead of a loading state -
 * exactly like reopening the app after closing the tab. A silent
 * background refresh always follows immediately after.
 */
// Cache keys are scoped per logged-in user - critical on a shared/kiosk
// browser, where a second person logging in must NEVER briefly see the
// previous user's Home numbers or sidebar permissions before the first
// background refresh happens to overwrite them.
function currentCacheOwner() {
  if (typeof FMS_SESSION !== 'undefined' && FMS_SESSION && FMS_SESSION.userName) {
    return String(FMS_SESSION.userName).trim().toLowerCase();
  }
  return 'anonymous';
}
function scopedStorageKey(baseKey) {
  return baseKey + '::' + encodeURIComponent(currentCacheOwner());
}

function persistHomeSummaryCache() {
  if (FMS.homeSummaryCache) fmsStoreSet(scopedStorageKey(HOME_SUMMARY_STORAGE_KEY), JSON.stringify(FMS.homeSummaryCache));
}
function persistPermissionsCache() {
  if (FMS.permissionsCache) fmsStoreSet(scopedStorageKey(PERMISSIONS_STORAGE_KEY), JSON.stringify(FMS.permissionsCache));
}
function persistFormStructureCache() {
  if (FMS.formStructureCache) fmsStoreSet(scopedStorageKey(FORM_SCHEMA_STORAGE_KEY), JSON.stringify(FMS.formStructureCache));
}
function restorePersistedCaches() {
  try {
    var home = fmsStoreGet(scopedStorageKey(HOME_SUMMARY_STORAGE_KEY));
    if (home) FMS.homeSummaryCache = JSON.parse(home);
  } catch (e) { /* ignore corrupt cache */ }
  try {
    var perms = fmsStoreGet(scopedStorageKey(PERMISSIONS_STORAGE_KEY));
    if (perms) FMS.permissionsCache = JSON.parse(perms);
  } catch (e) { /* ignore corrupt cache */ }
  try {
    var schemas = fmsStoreGet(scopedStorageKey(FORM_SCHEMA_STORAGE_KEY));
    if (schemas) {
      var parsedSchemas = JSON.parse(schemas);
      if (parsedSchemas && typeof parsedSchemas === 'object') FMS.formStructureCache = parsedSchemas;
    }
  } catch (e) { /* ignore corrupt cache */ }
}

function loadHomeDashboard() {
  var cached = FMS.homeSummaryCache;

  if (cached) {
    // Instant render from cache (same "remembered" pattern as the tables),
    // then silently refresh counts in the background.
    renderHomeDashboard(cached, false);
    fetchHomeSummaryInBackground(false);
  } else {
    // NEVER show a "Loading..." spinner on Home - render the full page
    // shell INSTANTLY with placeholder zero counts (isSkeleton=true shows
    // "Loading latest data..." in place of a timestamp), then silently
    // fetch the real numbers in the background and update in place the
    // moment they arrive - so the page always feels already-loaded.
    renderHomeDashboard({ success: true, totalPending: 0, totalCompleted: 0, totalOverdue: 0, groups: [] }, true);
    fetchHomeSummaryInBackground(true);
  }
}

function fetchHomeSummaryInBackground(isFirstLoad) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        if (isFirstLoad) {
          document.getElementById('mainContent').innerHTML =
            '<div class="pending-empty"><span class="material-icons-round">error_outline</span>' + escapeHtml(res.message || 'Could not load dashboard') + '</div>';
        }
        return;
      }
      var changed = JSON.stringify(res) !== JSON.stringify(FMS.homeSummaryCache);
      FMS.homeSummaryCache = res;
      FMS.homeLastUpdated = new Date();
      persistHomeSummaryCache();
      // Only touch the DOM if the user is still on the Home page
      if (!FMS.currentHeader && !FMS.currentStep) {
        renderHomeDashboard(res, false, changed);
      }
      setLastUpdatedNow(changed);
    })
    .withFailureHandler(function(err) {
      if (isFirstLoad) {
        document.getElementById('mainContent').innerHTML = '<div class="pending-empty">' + escapeHtml(err.message) + '</div>';
      }
    })
    .wfGetHomeSummary(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, FMS_SESSION.userName);
}

function renderHomeDashboard(res, isSkeleton, justUpdated) {
  var main = document.getElementById('mainContent');
  var now = new Date();
  var hour = now.getHours();
  var greeting = hour < 12 ? 'Good Morning' : (hour < 17 ? 'Good Afternoon' : 'Good Evening');

  var html = '<div class="home-page">';

  // "Last updated on ..." line at the TOP of the Home page itself - shows
  // "Loading latest data..." only for the very first instant render
  // (before any real fetch has ever completed), and the actual date/time
  // of the most recent successful refresh after that (flashes green
  // briefly whenever the numbers actually changed).
  var lastUpdatedLine = isSkeleton
    ? '<span class="home-last-updated-loading"><span class="material-icons-round sync-icon syncing">sync</span>Loading latest data...</span>'
    : 'Last updated on ' + formatFmsDate(FMS.homeLastUpdated || new Date());

  html += '<div class="home-header">' +
    '<div><h2>' + greeting + ', ' + escapeHtml(FMS_SESSION.userName) + '</h2>' +
    '<p class="subtitle">Here\'s a summary of everything assigned to you.</p></div>' +
    '<div class="home-last-updated' + (justUpdated ? ' updated-flash' : '') + '" id="homeLastUpdated">' + lastUpdatedLine + '</div>' +
    '</div>';

  var totalPending = res.totalPending || 0;
  var totalCompleted = res.totalCompleted || 0;
  var totalOverdue = res.totalOverdue || 0;
  var grandTotal = totalPending + totalCompleted;
  var pendingPct = grandTotal > 0 ? Math.round((totalPending / grandTotal) * 100) : 0;
  var completedPct = grandTotal > 0 ? Math.round((totalCompleted / grandTotal) * 100) : 0;

  html += '<div class="home-stats-row' + (justUpdated ? ' stats-updated-flash' : '') + '">';
  html += homeStatCardHtml('Pending', totalPending, 'pending_actions', 'stat-pending', pendingPct, 'Awaiting your action');
  html += homeStatCardHtml('Overdue', totalOverdue, 'warning_amber', 'stat-overdue', null, 'Past planned date');
  html += homeStatCardHtml('Completed', totalCompleted, 'task_alt', 'stat-completed', completedPct, 'Successfully closed');
  html += homeStatCardHtml('Total Items', grandTotal, 'inventory_2', 'stat-total', null, 'Across your workflows');
  html += '</div>';

  if (totalOverdue > 0 && res.groups && res.groups.length) {
    html += '<section class="home-attention-panel">' +
      '<div class="home-section-heading"><div><span class="section-eyebrow">Priority</span><h3>Needs Your Attention</h3></div>' +
      '<span class="attention-summary">' + totalOverdue + ' overdue</span></div>' +
      '<div class="attention-items">';
    res.groups.forEach(function(group) {
      (group.steps || []).forEach(function(stepEntry) {
        if ((stepEntry.overdue || 0) > 0) html += homeAttentionItemHtml(group.header, stepEntry);
      });
    });
    html += '</div></section>';
  }

  html += '<div class="home-section-heading workflow-heading"><div><span class="section-eyebrow">Workspace</span><h3>Workflow Overview</h3></div></div>';

  if (!res.groups || res.groups.length === 0) {
    if (isSkeleton) {
      // First-ever instant render, before we know if there are any groups
      // yet - stay blank/neutral rather than claiming "no steps assigned".
      html += '<div class="pending-loading">&nbsp;</div>';
    } else {
      html += '<div class="pending-empty"><span class="material-icons-round">inbox</span>No steps assigned to you yet.</div>';
    }
  } else {
    res.groups.forEach(function(group) {
      html += '<div class="home-group">';
      html += '<div class="home-group-title"><span class="material-icons-round">folder</span>' + escapeHtml(group.header) + '</div>';
      html += '<div class="home-cards-grid">';
      group.steps.forEach(function(stepEntry) {
        html += homeStepCardHtml(group.header, stepEntry);
      });
      html += '</div></div>';
    });
  }

  html += '</div>';
  main.innerHTML = html;

  if (justUpdated) {
    setTimeout(function() {
      var el = document.getElementById('homeLastUpdated');
      if (el) el.classList.remove('updated-flash');
      var statsRow = document.querySelector('.home-stats-row.stats-updated-flash');
      if (statsRow) statsRow.classList.remove('stats-updated-flash');
    }, 2500);
  }
}

function homeStatCardHtml(label, count, icon, extraClass, pct, hint) {
  var pctHtml = (pct !== null && pct !== undefined) ? '<span class="home-stat-pct">' + pct + '%</span>' : '';
  return '<div class="home-stat-card ' + extraClass + '">' +
    '<span class="material-icons-round home-stat-icon">' + icon + '</span>' +
    '<div class="home-stat-content"><div class="home-stat-label">' + escapeHtml(label) + '</div>' +
    '<div class="home-stat-count">' + count + pctHtml + '</div>' +
    '<div class="home-stat-hint">' + escapeHtml(hint || '') + '</div></div>' +
    '</div>';
}

function homeAttentionItemHtml(headerName, stepEntry) {
  return '<button type="button" class="attention-item" onclick="openPage(\'' + escapeAttr(stepEntry.step) + '\', \'' + escapeAttr(headerName) + '\', event)">' +
    '<span class="attention-icon material-icons-round">priority_high</span>' +
    '<span class="attention-copy"><strong>' + escapeHtml(stepEntry.step) + '</strong><small>' + escapeHtml(headerName) + '</small></span>' +
    '<span class="attention-count">' + (stepEntry.overdue || 0) + ' overdue</span>' +
    '<span class="material-icons-round attention-arrow">arrow_forward</span>' +
    '</button>';
}

function homeStepCardHtml(headerName, stepEntry) {
  var hasError = !!stepEntry.error;
  var pending = stepEntry.pending || 0;
  var completed = stepEntry.completed || 0;
  var overdue = stepEntry.overdue || 0;
  var total = pending + completed;
  var completedPct = total > 0 ? Math.round((completed / total) * 100) : 0;

  var html = '<article class="home-step-card' + (pending > 0 ? ' has-pending' : '') + (overdue > 0 ? ' has-overdue' : '') + '" onclick="openPage(\'' + escapeAttr(stepEntry.step) + '\', \'' + escapeAttr(headerName) + '\', event)">';
  html += '<div class="home-step-card-head"><div class="home-step-card-title">' + escapeHtml(stepEntry.step) + '</div>' +
    '<span class="material-icons-round">arrow_outward</span></div>';

  if (hasError) {
    html += '<div class="home-step-card-error">' + escapeHtml(stepEntry.error) + '</div>';
  } else {
    html += '<div class="home-step-card-counts">' +
      '<span class="hs-pending">' + pending + ' Pending</span>' +
      (overdue > 0 ? '<span class="hs-overdue">' + overdue + ' Overdue</span>' : '') +
      '<span class="hs-completed">' + completed + ' Done</span>' +
      '</div>';
    html += '<div class="home-step-progress" title="' + completedPct + '% completed"><div class="home-step-progress-fill" style="width:' + completedPct + '%"></div></div>' +
      '<div class="home-step-card-footer"><span>' + completedPct + '% complete</span><strong>Open step</strong></div>';
  }

  html += '</article>';
  return html;
}

// ===== WORKFLOW: DATA TABLE (mirrors the real sheet) =====
FMS.table = {
  columns: [],
  columnTypes: [],   // parallel to columns[] - 'DATE' marks a date/time column
  rows: [],
  filterStatus: 'pending',   // 'pending' | 'completed' | 'all'
  globalSearch: '',
  colSearch: {},              // colIndex -> search text
  sortCol: null,
  sortDir: 'asc',
  page: 1,
  pageSize: 50,
  colWidths: {},               // colIndex -> px width (resizable columns)
  hiddenCols: {},               // colIndex -> true if hidden
  columnPanelOpen: false,
  justResized: false,
  cacheKey: null
};

// Remembers column width/visibility choices PER STEP and across browser
// sessions. Special width keys "__serial" and "__action" belong to the
// two system columns that frame every data table.
var COLUMN_PREFS_STORAGE_KEY = 'fms_column_prefs_v2';
FMS.columnPrefs = {};
FMS.columnPrefsLoaded = false;

function ensureColumnPrefsLoaded() {
  if (FMS.columnPrefsLoaded) return;
  FMS.columnPrefsLoaded = true;
  var stored = fmsStoreGet(COLUMN_PREFS_STORAGE_KEY);
  if (!stored) return;
  try {
    var parsed = JSON.parse(stored);
    if (parsed && typeof parsed === 'object') FMS.columnPrefs = parsed;
  } catch (e) {
    FMS.columnPrefs = {};
  }
}

function currentColumnPrefsOwner() {
  if (typeof FMS_SESSION !== 'undefined' && FMS_SESSION && FMS_SESSION.userName) {
    return String(FMS_SESSION.userName).trim().toLowerCase();
  }
  return 'anonymous';
}

function scopedColumnPrefsKey(cacheKey) {
  return encodeURIComponent(currentColumnPrefsOwner()) + '|||' + cacheKey;
}

function getColumnPrefs(cacheKey) {
  ensureColumnPrefsLoaded();
  var scopedKey = scopedColumnPrefsKey(cacheKey);
  if (!FMS.columnPrefs[scopedKey]) {
    FMS.columnPrefs[scopedKey] = { colWidths: {}, hiddenCols: {}, hasSavedPrefs: false, columnSignature: '' };
  }
  // Backward-compatible defensive shape repair for preferences saved by
  // earlier versions before width editing existed in the Columns panel.
  var prefs = FMS.columnPrefs[scopedKey];
  if (!prefs.colWidths || typeof prefs.colWidths !== 'object') prefs.colWidths = {};
  if (!prefs.hiddenCols || typeof prefs.hiddenCols !== 'object') prefs.hiddenCols = {};
  return prefs;
}

function columnSchemaSignature(columns) {
  return (columns || []).map(function(name) { return String(name); }).join('\u001f');
}

function reconcileColumnPrefsForColumns(columns) {
  if (!FMS.table.cacheKey) return;
  var prefs = getColumnPrefs(FMS.table.cacheKey);
  var signature = columnSchemaSignature(columns);
  if (prefs.columnSignature && prefs.columnSignature !== signature) {
    // Index-based data-column preferences no longer describe the same
    // schema. Preserve only the two identity-stable system widths.
    var systemWidths = {};
    if (prefs.colWidths.__serial) systemWidths.__serial = prefs.colWidths.__serial;
    if (prefs.colWidths.__action) systemWidths.__action = prefs.colWidths.__action;
    prefs.colWidths = systemWidths;
    prefs.hiddenCols = {};
    prefs.hasSavedPrefs = false;
  }
  prefs.columnSignature = signature;
  FMS.table.colWidths = prefs.colWidths;
  FMS.table.hiddenCols = prefs.hiddenCols;
  FMS.table.hasSavedColPrefs = prefs.hasSavedPrefs;
  fmsStoreSet(COLUMN_PREFS_STORAGE_KEY, JSON.stringify(FMS.columnPrefs));
}

/**
 * Applies the backend's defaultHiddenCols (currently just the audit-trail
 * "Modified By"/"Modified At" columns) ONLY if the user hasn't already
 * made their own Show/Hide choices for this step - so a user's manual
 * "unhide Modified By" choice is never silently re-hidden on a later
 * background refresh.
 */
function applyDefaultHiddenCols(defaultHiddenCols) {
  if (FMS.table.hasSavedColPrefs) return; // user already customized - don't override
  (defaultHiddenCols || []).forEach(function(idx) {
    FMS.table.hiddenCols[idx] = true;
  });
}

// ================================================================
// TABLE VIEW - the whole pipeline for one header, side by side,
// showing ONLY the steps this user is permitted to action.
// ================================================================

/**
 * Loads the multi-step (Table View) data for a header. Same instant
 * cache-then-silently-refresh pattern as loadStepTable(), so switching
 * back to a header you've already opened never shows a loading spinner.
 */
function loadMultiStepTable(headerName) {
  var main = document.getElementById('mainContent');
  var cacheKey = headerName + '|||__ALL_STEPS__';
  var cached = FMS.multiTableCache[headerName];

  FMS.table.filterStatus = 'pending';
  FMS.table.globalSearch = '';
  FMS.table.colSearch = {};
  FMS.table.sortCol = null;
  FMS.table.page = 1;
  FMS.table.cacheKey = cacheKey;
  FMS.table.columnPanelOpen = false;
  var prefs = getColumnPrefs(cacheKey);
  FMS.table.colWidths = prefs.colWidths;
  FMS.table.hiddenCols = prefs.hiddenCols;
  FMS.table.hasSavedColPrefs = prefs.hasSavedPrefs;

  var pageShell = '<div class="table-page"><div id="tableContainer"></div></div>';

  if (cached) {
    main.innerHTML = pageShell;
    applyMultiTableData(cached);
    renderMultiStepTable(headerName);
    warmFormsFromMultiTable(headerName, cached);
    fetchMultiStepTableInBackground(headerName, false);
  } else {
    main.innerHTML = pageShell;
    document.getElementById('tableContainer').innerHTML = '<div class="pending-loading">Loading your steps...</div>';
    fetchMultiStepTableInBackground(headerName, true);
  }
}

function applyMultiTableData(data) {
  FMS.table.columns = data.columns || [];
  FMS.table.columnTypes = data.columnTypes || [];
  reconcileColumnPrefsForColumns(FMS.table.columns);
  FMS.table.columnGroups = data.columnGroups || [];
  FMS.table.lockedCols = data.lockedCols || [];
  FMS.table.steps = data.steps || [];
  FMS.table.baseColCount = data.baseColCount || 0;
  FMS.table.totalPipelineSteps = data.totalPipelineSteps || 0;
  FMS.table.rows = data.rows || [];
  applyDefaultHiddenCols(data.defaultHiddenCols);
}

function fetchMultiStepTableInBackground(headerName, showErrorsInline) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        if (showErrorsInline) {
          document.getElementById('tableContainer').innerHTML =
            '<div class="pending-empty"><span class="material-icons-round">error_outline</span>' +
            escapeHtml(res.message || 'Could not load Table View') + '</div>';
        }
        return;
      }
      FMS.multiTableCache[headerName] = res;
      cacheFormSchemasFromTable(headerName, null, res);
      warmFormsFromMultiTable(headerName, res);
      // Only touch the DOM if the user is still on this header in Table View
      if (FMS.viewMode === 'table' && FMS.currentHeader === headerName) {
        applyMultiTableData(res);
        if (document.getElementById('tableContainer')) renderMultiStepTable(headerName);
      }
      setLastUpdatedNow(false);
    })
    .withFailureHandler(function(err) {
      if (showErrorsInline) {
        document.getElementById('tableContainer').innerHTML =
          '<div class="pending-empty">' + escapeHtml(err.message) + '</div>';
      }
    })
    .wfGetMultiStepTableData(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, headerName, FMS_SESSION.userName);
}

/**
 * Renders the wide Table View: a grouped header (one banner per step,
 * spanning that step's own columns) above the normal column-name row,
 * and a per-row Action cell carrying one compact chip per step the user
 * owns - clickable when that step is actionable, a green tick when it's
 * already done, and a padlock while an earlier step still blocks it.
 *
 * Deliberately reuses the exact same filtering/sorting/paging/column
 * machinery as the Step View (getFilteredSortedRows, colSearch, colWidths,
 * hiddenCols, pagination) so both views behave identically.
 */
function hasActiveTableFilters(t) {
  if (t.globalSearch || t.sortCol !== null || t.filterStatus !== 'pending') return true;
  for (var key in t.colSearch) {
    var value = t.colSearch[key];
    if (typeof value === 'object') {
      if (value && (value.start || value.end)) return true;
    } else if (value) return true;
  }
  return false;
}

/**
 * Compact context strip. Title, workflow and the view switcher share ONE
 * slim line so vertical space goes to data rows instead of decoration.
 */
function tablePageHeaderHtml(headerName, title) {
  return '<div class="table-page-header">' +
    '<div class="table-page-heading">' +
      '<h1>' + escapeHtml(title) + '</h1>' +
      '<span class="table-page-eyebrow">' + escapeHtml(headerName) + '</span>' +
    '</div>' +
    viewSwitcherHtml() +
    '</div>';
}

/**
 * Explicit <colgroup> for the data grid.
 *
 * REQUIRED for correct column widths: the table is table-layout:fixed, and
 * in that mode the browser derives every column's width from the FIRST row
 * only. In Table View the first row is the grouped step banner built from
 * colspan cells, so per-column widths set on the second (column-name) row
 * were silently ignored - which is why resizing/width settings appeared to
 * do nothing there. A colgroup defines the widths independently of any row,
 * so both views size columns identically and resizing always works.
 */
function compactStepsColumnWidth() {
  // 20px numeric chips + 3px gaps + compact cell padding. Width grows only
  // enough to keep every owned step on one line, avoiding tall wrapped rows.
  var count = Math.max(1, (FMS.table.steps || []).length);
  return Math.max(64, 12 + (count * 20) + (Math.max(0, count - 1) * 3));
}

function defaultColumnWidth(key) {
  if (key === '__serial') return 44;
  if (key === '__action') return FMS.viewMode === 'table' ? compactStepsColumnWidth() : 104;
  return 132;
}

function columnWidthBounds(key) {
  if (key === '__serial') return { min: 40, max: 160 };
  if (key === '__action') return {
    min: FMS.viewMode === 'table' ? compactStepsColumnWidth() : 72,
    max: Math.max(800, FMS.viewMode === 'table' ? compactStepsColumnWidth() : 800)
  };
  return { min: 56, max: 600 };
}

function getConfiguredColumnWidth(t, key) {
  var bounds = columnWidthBounds(key);
  var value = parseInt(t.colWidths[key], 10);
  if (!isFinite(value)) value = defaultColumnWidth(key);
  return Math.max(bounds.min, Math.min(bounds.max, value));
}

function tableColgroupHtml(visibleIdx, t, defaultWidth) {
  var serialWidth = getConfiguredColumnWidth(t, '__serial');
  var actionWidth = getConfiguredColumnWidth(t, '__action');
  var html = '<colgroup>' +
    '<col class="col-serial-sizer" data-col="__serial" style="width:' + serialWidth + 'px;">';
  visibleIdx.forEach(function(idx) {
    var w = getConfiguredColumnWidth(t, idx);
    html += '<col data-col="' + idx + '" style="width:' + w + 'px;">';
  });
  return html + '<col class="col-action-sizer" data-col="__action" style="width:' + actionWidth + 'px;"></colgroup>';
}

function tableUtilityToolbarHtml(t, allCount, pendingCount, overdueCount, completedCount) {
  var hiddenCount = 0;
  t.columns.forEach(function(col, idx) { if (t.hiddenCols[idx]) hiddenCount++; });
  var html = '<div class="table-utility-toolbar">';
  html += '<div class="status-tabs" role="tablist" aria-label="Record status">';
  html += statusTabHtml('all', 'All', allCount, t.filterStatus);
  html += statusTabHtml('pending', 'Pending', pendingCount, t.filterStatus);
  html += '<button class="status-tab status-tab-overdue' + (t.filterStatus === 'overdue' ? ' active' : '') + '" onclick="onStatusFilter(\'overdue\')">' +
    '<span class="material-icons-round">warning_amber</span>Overdue <span class="status-tab-count">' + overdueCount + '</span></button>';
  html += statusTabHtml('completed', 'Completed', completedCount, t.filterStatus);
  html += '</div>';
  html += '<div class="table-toolbar-actions">';
  html += '<label class="table-search"><span class="material-icons-round">search</span>' +
    '<input type="text" id="tableGlobalSearch" aria-label="Search all columns" placeholder="Search records..." value="' + escapeAttr(t.globalSearch) + '" oninput="onGlobalSearch(this.value)"></label>';
  if (hasActiveTableFilters(t)) {
    html += '<button type="button" class="toolbar-btn reset-filters-btn" onclick="resetAllFilters()" title="Clear search, filters and sorting">' +
      '<span class="material-icons-round">filter_alt_off</span><span>Clear</span></button>';
  }
  html += '<div class="column-toggle-wrap">' +
    '<button type="button" class="toolbar-btn columns-button' + (t.columnPanelOpen ? ' active' : '') + '" title="Show, hide and resize every column" aria-expanded="' + (t.columnPanelOpen ? 'true' : 'false') + '" onclick="toggleColumnPanel(event)">' +
      '<span class="material-icons-round">view_column</span><span>Columns</span>' +
      (hiddenCount ? '<span class="toolbar-count">' + hiddenCount + '</span>' : '') +
    '</button>' + renderColumnPanel(t) + '</div>';
  html += '</div></div>';
  return html;
}

function tablePaginationHtml(filteredCount, startIdx, totalPages) {
  var t = FMS.table;
  var from = filteredCount === 0 ? 0 : startIdx + 1;
  var to = Math.min(startIdx + t.pageSize, filteredCount);
  var html = '<div class="table-pagination">';
  html += '<span class="pagination-info">Showing <strong>' + from + '–' + to + '</strong> of <strong>' + filteredCount + '</strong> records</span>';
  html += '<div class="pagination-right">';
  html += '<label class="page-size-select"><span>Rows per page</span><select id="pageSizeSelect" onchange="onPageSizeChange(this.value)">' +
    [50, 100, 500, 1000].map(function(n) { return '<option value="' + n + '"' + (t.pageSize === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
    '</select></label>';
  html += '<div class="pagination-controls">';
  html += '<button class="page-btn" title="Previous page" ' + (t.page <= 1 ? 'disabled' : '') + ' onclick="onPageChange(' + (t.page - 1) + ')"><span class="material-icons-round">chevron_left</span><span>Previous</span></button>';
  html += '<span class="page-indicator">Page <strong>' + t.page + '</strong> of ' + totalPages + '</span>';
  html += '<button class="page-btn" title="Next page" ' + (t.page >= totalPages ? 'disabled' : '') + ' onclick="onPageChange(' + (t.page + 1) + ')"><span>Next</span><span class="material-icons-round">chevron_right</span></button>';
  html += '</div></div></div>';
  return html;
}

function renderMultiStepTable(headerName) {
  var t = FMS.table;
  var allRows = t.rows || [];
  var pendingCount = allRows.filter(function(r){ return r.status === 'pending'; }).length;
  var completedCount = allRows.filter(function(r){ return r.status === 'completed'; }).length;
  var overdueCount = allRows.filter(function(r){ return r.overdue; }).length;

  var filtered = getFilteredSortedRows();
  var totalPages = Math.max(1, Math.ceil(filtered.length / t.pageSize));
  if (t.page > totalPages) t.page = totalPages;
  var startIdx = (t.page - 1) * t.pageSize;
  var pageRows = filtered.slice(startIdx, startIdx + t.pageSize);

  var visibleIdx = [];
  t.columns.forEach(function(col, idx) { if (!t.hiddenCols[idx]) visibleIdx.push(idx); });

  var html = '';
  html += tablePageHeaderHtml(headerName, 'All My Steps');
  html += tableUtilityToolbarHtml(t, allRows.length, pendingCount, overdueCount, completedCount);

  if (!visibleIdx.length) {
    html += '<div class="pending-empty"><span class="material-icons-round">lock</span>' +
      'You don\'t have permission for any step in this workflow.</div>';
    document.getElementById('tableContainer').innerHTML = html;
    return;
  }

  // Group consecutive visible columns by their step (base columns share
  // the empty '' group) so each step gets ONE spanning banner cell.
  var groupSpans = [];
  visibleIdx.forEach(function(idx) {
    var g = (t.columnGroups && t.columnGroups[idx]) || '';
    var last = groupSpans[groupSpans.length - 1];
    if (last && last.group === g) last.count++;
    else groupSpans.push({ group: g, count: 1, firstIdx: idx });
  });

  var stepOrderByName = {};
  (t.steps || []).forEach(function(s) { stepOrderByName[s.step] = s.order; });

  var DEFAULT_COL_WIDTH = 132;
  html += '<div class="table-scroll-wrap"><table class="data-table multi-step-table" id="fmsDataTable">';
  html += tableColgroupHtml(visibleIdx, t, DEFAULT_COL_WIDTH);
  html += '<thead>';

  // ---- Grouped step banner row ----
  html += '<tr class="step-group-row">';
  html += '<th class="col-serial"></th>';
  groupSpans.forEach(function(g) {
    if (!g.group) {
      html += '<th colspan="' + g.count + '" class="group-base">Details</th>';
    } else {
      var order = stepOrderByName[g.group];
      var label = (order ? 'Step ' + order + ' · ' : '') + g.group;
      html += '<th colspan="' + g.count + '" class="group-step" title="' + escapeAttr(g.group) + '">' +
        escapeHtml(label) + '</th>';
    }
  });
  html += '<th class="col-action"></th>';
  html += '</tr>';

  // ---- Column name row (identical behaviour to Step View) ----
  html += '<tr>';
  html += '<th class="col-serial" data-col="__serial">S.No' +
    columnResizeHandleHtml('__serial', false, 'S.No') + '</th>';
  visibleIdx.forEach(function(idx) {
    var arrow = t.sortCol === idx ? (t.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    var w = getConfiguredColumnWidth(t, idx);
    var style = ' style="width:' + w + 'px; min-width:' + w + 'px; max-width:' + w + 'px;"';
    var isGroupStart = groupSpans.some(function(g) { return g.group && g.firstIdx === idx; });
    var isDate = isDateColumn(idx);
    var activeFilter = isDate
      ? !!(t.colSearch[idx] && (t.colSearch[idx].start || t.colSearch[idx].end))
      : !!t.colSearch[idx];
    var filterIcon = isDate ? 'date_range' : 'search';
    var filterAction = isDate ? 'openDateRangePicker(event,' + idx + ')' : 'openColumnTextFilter(event,' + idx + ')';
    html += '<th data-col="' + idx + '" class="' + (isGroupStart ? 'col-group-start' : '') + '"' + style + '>' +
      '<div class="th-inner">' +
      '<span class="th-label" onclick="onSortColumn(' + idx + ')">' + escapeHtml(t.columns[idx]) + arrow + '</span>' +
      '<button type="button" class="col-filter-btn' + (activeFilter ? ' active' : '') + '" onclick="' + filterAction + '" title="Filter this column">' +
      '<span class="material-icons-round">' + filterIcon + '</span></button>' +
      '</div>' +
      columnResizeHandleHtml(idx, false, t.columns[idx]) +
      '</th>';
  });
  html += '<th class="col-action" data-col="__action">Steps' +
    columnResizeHandleHtml('__action', true, 'Steps') + '</th>';
  html += '</tr></thead><tbody>';

  if (pageRows.length === 0) {
    html += '<tr><td colspan="' + (visibleIdx.length + 2) + '" class="table-empty-cell">No matching records found.</td></tr>';
  } else {
    pageRows.forEach(function(r, i) {
      html += '<tr class="' + (r.overdue ? 'row-overdue' : '') + '">';
      html += '<td class="col-serial">' + (startIdx + i + 1) + '</td>';
      visibleIdx.forEach(function(idx) {
        var isGroupStart = groupSpans.some(function(g) { return g.group && g.firstIdx === idx; });
        html += '<td class="' + (isGroupStart ? 'col-group-start' : '') + '">' + renderCellValue(r.cells[idx]) + '</td>';
      });

      // Numeric state chips keep the action column narrow: color carries
      // pending/completed/locked state and the tooltip retains full detail.
      html += '<td class="col-action"><div class="step-chips">';
      (r.steps || []).forEach(function(st) {
        var label = String(st.order);
        if (st.status === 'pending') {
          html += '<button class="step-chip chip-pending' + (st.overdue ? ' chip-overdue' : '') + '" ' +
            'onclick="openStepForm(\'' + escapeAttr(headerName) + '\',\'' + escapeAttr(st.step) + '\',' + r.row + ')" ' +
            'aria-label="Fill step ' + st.order + ': ' + escapeAttr(st.step) + '" ' +
            'title="Fill: ' + escapeAttr(st.step) + (st.overdue ? ' (overdue)' : '') + '">' + label + '</button>';
        } else if (st.status === 'completed') {
          html += '<span class="step-chip chip-done" aria-label="Step ' + st.order + ' completed" title="Done: ' + escapeAttr(st.step) + '">' + label + '</span>';
        } else {
          html += '<span class="step-chip chip-locked" aria-label="Step ' + st.order + ' locked" title="Waiting on an earlier step: ' + escapeAttr(st.step) + '">' + label + '</span>';
        }
      });
      html += '</div></td></tr>';
    });
  }

  html += '</tbody></table></div>';

  html += tablePaginationHtml(filtered.length, startIdx, totalPages);

  var existingWrap = document.querySelector('#tableContainer .table-scroll-wrap');
  var savedScrollLeft = existingWrap ? existingWrap.scrollLeft : 0;
  document.getElementById('tableContainer').innerHTML = html;
  var newWrap = document.querySelector('#tableContainer .table-scroll-wrap');
  if (newWrap && savedScrollLeft) newWrap.scrollLeft = savedScrollLeft;
}

/**
 * Loads a Step's table. If we already have cached data for this exact
 * header+step (from a previous visit or a background auto-refresh), it is
 * rendered INSTANTLY with no spinner - the header/questions/columns are
 * "remembered". A fresh copy is then fetched silently in the background
 * to pick up any new rows, without blocking or re-showing a loader.
 */
function loadStepTable(headerName, stepName) {
  var main = document.getElementById('mainContent');
  var cacheKey = headerName + '|||' + stepName;
  var cached = FMS.tableCache[cacheKey];

  FMS.table.filterStatus = 'pending';
  FMS.table.globalSearch = '';
  FMS.table.colSearch = {};
  FMS.table.sortCol = null;
  FMS.table.page = 1;
  FMS.table.cacheKey = cacheKey;
  FMS.table.columnPanelOpen = false;
  var prefs = getColumnPrefs(cacheKey);
  FMS.table.colWidths = prefs.colWidths;
  FMS.table.hiddenCols = prefs.hiddenCols;
  FMS.table.hasSavedColPrefs = prefs.hasSavedPrefs;
  // Clear Table-View-only metadata so a previously opened wide view can't
  // leak its step grouping / locked columns into this single-step render.
  FMS.table.columnGroups = [];
  FMS.table.lockedCols = [];
  FMS.table.steps = [];

  // Compact page-title strip (step name + header as a small breadcrumb)
  // is placed INLINE with the status tabs (same row) - saves one whole
  // line of vertical space so more table rows are visible on screen.
  var pageShell =
    '<div class="table-page">' +
    '<div id="tableContainer"></div>' +
    '</div>';

  if (cached) {
    // Instant render from cache - no spinner, no "circle ghoomna"
    main.innerHTML = pageShell;
    FMS.table.columns = cached.columns;
    FMS.table.columnTypes = cached.columnTypes || [];
    reconcileColumnPrefsForColumns(FMS.table.columns);
    FMS.table.rows = cached.rows;
    applyDefaultHiddenCols(cached.defaultHiddenCols);
    renderDataTable(headerName, stepName);
    var cachedPendingFormRow = (cached.rows || []).filter(function(row) { return row.status === 'pending'; })[0];
    if (cachedPendingFormRow) warmStepFormCache(headerName, stepName, cachedPendingFormRow.row);
    fetchStepTableInBackground(headerName, stepName, cacheKey, false);
  } else {
    // First time opening this step - show loader once
    main.innerHTML = pageShell;
    document.getElementById('tableContainer').innerHTML = '<div class="pending-loading">Loading data...</div>';
    fetchStepTableInBackground(headerName, stepName, cacheKey, true);
  }
}

function fetchStepTableInBackground(headerName, stepName, cacheKey, showErrorsInline) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        if (showErrorsInline) {
          document.getElementById('tableContainer').innerHTML =
            '<div class="pending-empty"><span class="material-icons-round">error_outline</span>' + escapeHtml(res.message || 'Error loading data') + '</div>';
        }
        return;
      }
      FMS.tableCache[cacheKey] = {
        columns: res.columns,
        columnTypes: res.columnTypes || [],
        defaultHiddenCols: res.defaultHiddenCols || [],
        baseColCount: res.baseColCount || 0,
        rows: res.rows,
        fetchedAt: new Date()
      };
      cacheFormSchemasFromTable(headerName, stepName, res);
      var firstPendingFormRow = (res.rows || []).filter(function(row) { return row.status === 'pending'; })[0];
      if (firstPendingFormRow) warmStepFormCache(headerName, stepName, firstPendingFormRow.row);
      // Only update the visible table if the user is still viewing this exact step
      if (FMS.currentHeader === headerName && FMS.currentStep === stepName) {
        FMS.table.columns = res.columns;
        FMS.table.columnTypes = res.columnTypes || [];
        reconcileColumnPrefsForColumns(FMS.table.columns);
        FMS.table.rows = res.rows;
        applyDefaultHiddenCols(res.defaultHiddenCols);
        if (document.getElementById('tableContainer')) {
          renderDataTable(headerName, stepName);
        }
      }
      setLastUpdatedNow(false);
    })
    .withFailureHandler(function(err) {
      if (showErrorsInline) {
        document.getElementById('tableContainer').innerHTML =
          '<div class="pending-empty">' + escapeHtml(err.message) + '</div>';
      }
    })
    .wfGetStepTableData(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, headerName, stepName);
}

// The cell itself holds a formatted string produced by formatResult() in
// TAT_Calculator.gs, always in the fixed "DD Mon YY HH:MM:SS" style (e.g.
// "24 Jul 26 17:43:32"). Parsed explicitly (not via new Date(str)) so this
// works identically across every browser, instead of relying on each
// browser's own date-string parsing quirks.
var FMS_MONTH_LOOKUP = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };

function parseFmsDate(str) {
  str = String(str || '').trim();
  // Full "DD Mon YY HH:MM:SS" (normal case)
  var m = /^(\d{2})\s+([A-Za-z]{3})\s+(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/.exec(str);
  if (m) {
    var monthIdx = FMS_MONTH_LOOKUP[m[2]];
    if (monthIdx === undefined) return null;
    var year = 2000 + parseInt(m[3], 10); // "26" -> 2026
    return new Date(year, monthIdx, parseInt(m[1], 10), parseInt(m[4], 10), parseInt(m[5], 10), parseInt(m[6], 10));
  }
  // Date-only "DD Mon YY" (formatResult() omits a 00:00:00 time entirely)
  var m2 = /^(\d{2})\s+([A-Za-z]{3})\s+(\d{2})$/.exec(str);
  if (m2) {
    var monthIdx2 = FMS_MONTH_LOOKUP[m2[2]];
    if (monthIdx2 === undefined) return null;
    var year2 = 2000 + parseInt(m2[3], 10);
    return new Date(year2, monthIdx2, parseInt(m2[1], 10), 0, 0, 0);
  }
  return null;
}

/**
 * Matches a cell's date against a { start: Date, end: Date } range
 * (inclusive, whole calendar days - time-of-day is ignored on both
 * sides). A null/undefined range means "no filter" (always matches).
 */
function cellMatchesDateRange(cellValue, range) {
  if (!range || (!range.start && !range.end)) return true;
  var str = String(cellValue || '').trim();
  if (!str) return false;
  var parsed = parseFmsDate(str) || new Date(str); // fallback for any non-FMS-formatted date text
  if (!parsed || isNaN(parsed.getTime())) return false;

  var cellDay = new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
  if (range.start) {
    var startDay = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate());
    if (cellDay.getTime() < startDay.getTime()) return false;
  }
  if (range.end) {
    var endDay = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate());
    if (cellDay.getTime() > endDay.getTime()) return false;
  }
  return true;
}

function isDateColumn(idx) {
  return (FMS.table.columnTypes || [])[idx] === 'DATE';
}

function getFilteredSortedRows() {
  var t = FMS.table;
  var rows = t.rows.filter(function(r) {
    if (t.filterStatus === 'overdue') {
      if (!r.overdue) return false;
    } else if (t.filterStatus !== 'all' && r.status !== t.filterStatus) {
      return false;
    }

    if (t.globalSearch) {
      var hay = r.cells.join(' ').toLowerCase();
      if (hay.indexOf(t.globalSearch.toLowerCase()) === -1) return false;
    }

    for (var colIdx in t.colSearch) {
      var term = t.colSearch[colIdx];
      if (!term) continue;
      if (isDateColumn(colIdx)) {
        if (!cellMatchesDateRange(r.cells[colIdx], term)) return false;
      } else {
        var cellVal = String(r.cells[colIdx] || '').toLowerCase();
        if (cellVal.indexOf(term.toLowerCase()) === -1) return false;
      }
    }
    return true;
  });

  if (t.sortCol !== null) {
    rows.sort(function(a, b) {
      var va = a.cells[t.sortCol] || '';
      var vb = b.cells[t.sortCol] || '';
      var na = parseFloat(va), nb = parseFloat(vb);
      var cmp;
      if (!isNaN(na) && !isNaN(nb) && va !== '' && vb !== '') {
        cmp = na - nb;
      } else {
        cmp = String(va).localeCompare(String(vb));
      }
      return t.sortDir === 'asc' ? cmp : -cmp;
    });
  }

  return rows;
}

// Detects a bare http(s) URL and renders it as a short "Click Here" link
// instead of dumping the raw URL into the cell (per user request).
var URL_PATTERN = /^https?:\/\/[^\s<>"']+$/i;

function safeHttpUrl(rawValue) {
  var value = String(rawValue == null ? '' : rawValue).trim();
  if (!URL_PATTERN.test(value)) return null;
  try {
    if (typeof URL === 'function') {
      var parsed = new URL(value);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
    }
  } catch (e) {
    return null;
  }
  return value;
}

function renderCellValue(rawValue) {
  var value = String(rawValue == null ? '' : rawValue).trim();
  var safeUrl = safeHttpUrl(value);
  if (safeUrl) {
    return '<a href="' + escapeHtmlAttr(safeUrl) + '" target="_blank" rel="noopener noreferrer" class="cell-link" onclick="event.stopPropagation()">Click Here</a>';
  }
  // Also handle cells with MULTIPLE comma separated URLs (e.g. multi-file uploads)
  var parts = value.split(/,\s*/);
  var safeParts = parts.map(function(part) { return safeHttpUrl(part); });
  if (parts.length > 1 && safeParts.every(function(part) { return !!part; })) {
    return safeParts.map(function(part, i) {
      return '<a href="' + escapeHtmlAttr(part) + '" target="_blank" rel="noopener noreferrer" class="cell-link" onclick="event.stopPropagation()">Click Here' + (parts.length > 1 ? ' ' + (i + 1) : '') + '</a>';
    }).join(', ');
  }
  return escapeHtml(value);
}

function renderDataTable(headerName, stepName) {
  var t = FMS.table;
  var allRows = t.rows;
  var pendingCount = allRows.filter(function(r){ return r.status === 'pending'; }).length;
  var completedCount = allRows.filter(function(r){ return r.status === 'completed'; }).length;
  var overdueCount = allRows.filter(function(r){ return r.overdue; }).length;

  var filtered = getFilteredSortedRows();
  var totalPages = Math.max(1, Math.ceil(filtered.length / t.pageSize));
  if (t.page > totalPages) t.page = totalPages;
  var startIdx = (t.page - 1) * t.pageSize;
  var pageRows = filtered.slice(startIdx, startIdx + t.pageSize);

  var visibleIdx = [];
  t.columns.forEach(function(col, idx) { if (!t.hiddenCols[idx]) visibleIdx.push(idx); });

  // A vertical divider line is drawn right BEFORE the "Planned" column -
  // it visually separates the base/identifying columns (Timestamp, Item
  // Name, etc.) from this Step's own workflow columns (Planned, Actual,
  // and everything the user fills in). Explicitly requested by the user.
  var plannedColIdx = t.columns.indexOf('Planned');

  var html = '';
  html += tablePageHeaderHtml(headerName, stepName);
  html += tableUtilityToolbarHtml(t, allRows.length, pendingCount, overdueCount, completedCount);

  // ---- Table (immediately follows the single toolbar line above) ----
  // Every column gets an EXPLICIT pixel width (a sensible default of 150px
  // if the user hasn't dragged it yet). Combined with table-layout:fixed
  // and the table itself being width:auto (not 100%), this guarantees that
  // resizing ONE column never causes any other column to grow/shrink to
  // compensate - the total table width is simply the sum of all column
  // widths, and leftover space (if any) stays blank after the last column.
  //
  // Per-column filtering is now ICON-DRIVEN instead of a permanent search
  // row under every header: a small icon sits right after the column
  // name (search icon for text columns, calendar icon for Date/Time
  // columns). Clicking it opens a small popover below that icon to type
  // a search term (or pick a date range) - no more a whole extra table
  // row of search boxes cluttering the header (per user request).
  var DEFAULT_COL_WIDTH = 132;
  html += '<div class="table-scroll-wrap"><table class="data-table" id="fmsDataTable">';
  html += tableColgroupHtml(visibleIdx, t, DEFAULT_COL_WIDTH);
  html += '<thead>';
  html += '<tr>';
  html += '<th class="col-serial" data-col="__serial">S.No' +
    columnResizeHandleHtml('__serial', false, 'S.No') + '</th>';
  visibleIdx.forEach(function(idx) {
    var arrow = t.sortCol === idx ? (t.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    var w = getConfiguredColumnWidth(t, idx);
    var style = ' style="width:' + w + 'px; min-width:' + w + 'px; max-width:' + w + 'px;"';
    var dividerClass = (idx === plannedColIdx) ? ' col-before-planned' : '';
    var isDate = isDateColumn(idx);
    var activeFilter = isDate
      ? !!(t.colSearch[idx] && (t.colSearch[idx].start || t.colSearch[idx].end))
      : !!t.colSearch[idx];
    var filterIcon = isDate ? 'date_range' : 'search';
    var filterAction = isDate ? 'openDateRangePicker(event,' + idx + ')' : 'openColumnTextFilter(event,' + idx + ')';
    html += '<th data-col="' + idx + '" class="' + dividerClass.trim() + '"' + style + '>' +
      '<div class="th-inner">' +
      '<span class="th-label" onclick="onSortColumn(' + idx + ')">' + escapeHtml(t.columns[idx]) + arrow + '</span>' +
      '<button type="button" class="col-filter-btn' + (activeFilter ? ' active' : '') + '" onclick="' + filterAction + '" title="Filter this column">' +
      '<span class="material-icons-round">' + filterIcon + '</span></button>' +
      '</div>' +
      columnResizeHandleHtml(idx, false, t.columns[idx]) +
      '</th>';
  });
  html += '<th class="col-action" data-col="__action">Action' +
    columnResizeHandleHtml('__action', true, 'Action') + '</th>';
  html += '</tr></thead><tbody>';

  if (pageRows.length === 0) {
    html += '<tr><td colspan="' + (visibleIdx.length + 2) + '" class="table-empty-cell">No matching records found.</td></tr>';
  } else {
    pageRows.forEach(function(r, i) {
      html += '<tr class="' + (r.overdue ? 'row-overdue' : '') + '">';
      html += '<td class="col-serial">' + (startIdx + i + 1) + '</td>';
      visibleIdx.forEach(function(idx) {
        var dividerClass = (idx === plannedColIdx) ? ' col-before-planned' : '';
        html += '<td class="' + dividerClass.trim() + '">' + renderCellValue(r.cells[idx]) + '</td>';
      });
      html += '<td class="col-action">';
      if (r.status === 'pending') {
        // No "Overdue" text/badge - the red row tint (tr.row-overdue) is
        // the only visual indicator, per user request.
        html += '<button class="btn-fill" onclick="openStepForm(\'' + escapeAttr(headerName) + '\',\'' + escapeAttr(stepName) + '\',' + r.row + ')">Fill Step</button>';
      } else {
        html += '<span class="status-badge-done">Done</span>';
      }
      html += '</td></tr>';
    });
  }

  html += '</tbody></table></div>';

  // ---- Pagination ----
  html += tablePaginationHtml(filtered.length, startIdx, totalPages);

  // Preserve the table's horizontal scroll position across re-renders
  // (sorting, filtering, searching, resizing, etc. all rebuild this HTML
  // from scratch, which would otherwise reset scrollLeft back to 0 every
  // time - very disorienting if the user had scrolled right to see a
  // far-right column before clicking a header to sort it).
  var existingWrap = document.querySelector('#tableContainer .table-scroll-wrap');
  var savedScrollLeft = existingWrap ? existingWrap.scrollLeft : 0;

  document.getElementById('tableContainer').innerHTML = html;

  var newWrap = document.querySelector('#tableContainer .table-scroll-wrap');
  if (newWrap && savedScrollLeft) newWrap.scrollLeft = savedScrollLeft;
}

// ===== COLUMN VISIBILITY + WIDTH PANEL =====
function columnWidthKeyArg(key) {
  return typeof key === 'number' ? String(key) : '\'' + key + '\'';
}

function columnResizeHandleHtml(key, isLeft, label) {
  var arg = columnWidthKeyArg(key);
  var safeLabel = escapeHtmlAttr(String(label || 'column'));
  return '<span class="col-resize-handle' + (isLeft ? ' col-resize-handle-left' : '') + '" ' +
    'role="separator" aria-orientation="vertical" tabindex="0" ' +
    'aria-label="Resize ' + safeLabel + ' column" ' +
    'title="Drag to resize · Double-click to Auto Fit" ' +
    'onmousedown="startColResize(event,' + arg + ')" ' +
    'ontouchstart="startColResize(event,' + arg + ')" ' +
    'ondblclick="autoFitColumn(' + arg + ',event)" ' +
    'onkeydown="onColumnResizeKeydown(event,' + arg + ')"></span>';
}

function columnWidthEditorHtml(key, t) {
  var value = getConfiguredColumnWidth(t, key);
  var bounds = columnWidthBounds(key);
  var arg = columnWidthKeyArg(key);
  return '<div class="column-width-editor" role="group" aria-label="Column width">' +
    '<button type="button" class="column-width-step" onclick="adjustColumnWidth(' + arg + ',-16)" title="Narrower" aria-label="Make column narrower">−</button>' +
    '<input class="column-width-input" type="number" min="' + bounds.min + '" max="' + bounds.max + '" step="4" value="' + value + '" ' +
      'onchange="setColumnWidth(' + arg + ',this.value)" aria-label="Width in pixels">' +
    '<span class="column-width-unit">px</span>' +
    '<button type="button" class="column-width-step" onclick="adjustColumnWidth(' + arg + ',16)" title="Wider" aria-label="Make column wider">+</button>' +
    '<button type="button" class="column-width-autofit" onclick="autoFitColumn(' + arg + ',event)" title="Auto Fit this column" aria-label="Auto Fit this column">' +
      '<span class="material-icons-round">fit_screen</span><span>Fit</span></button>' +
    '<button type="button" class="column-width-reset" onclick="resetColumnWidth(' + arg + ')" title="Reset this width" aria-label="Reset this column width">' +
      '<span class="material-icons-round">restart_alt</span></button>' +
    '</div>';
}

function systemColumnConfigHtml(key, label, icon, t) {
  return '<div class="column-config-row column-config-system">' +
    '<div class="column-config-label"><span class="material-icons-round">' + icon + '</span>' +
      '<span class="column-config-name">' + escapeHtml(label) + '</span>' +
      '<span class="material-icons-round column-lock-icon" title="Always visible">lock</span></div>' +
    columnWidthEditorHtml(key, t) +
    '</div>';
}

function renderColumnPanel(t) {
  if (!t.columnPanelOpen) return '<div class="column-panel" id="columnPanel"></div>';
  var actionLabel = FMS.viewMode === 'table' ? 'Steps' : 'Action';
  var html = '<div class="column-panel open" id="columnPanel" onclick="event.stopPropagation()">';
  html += '<div class="column-panel-title">Columns &amp; Widths</div>' +
    '<div class="column-panel-hint">Drag the visible grip on any header edge, double-click it to Auto Fit, or set an exact width below.</div>';

  html += '<div class="column-panel-section-title">System columns</div>';
  html += systemColumnConfigHtml('__serial', 'S.No', 'format_list_numbered', t);
  html += systemColumnConfigHtml('__action', actionLabel, 'bolt', t);

  html += '<div class="column-panel-section-title">Data columns</div>';
  var locked = t.lockedCols || [];
  t.columns.forEach(function(col, idx) {
    var isLocked = locked.indexOf(idx) !== -1;
    var checked = (!t.hiddenCols[idx] || isLocked) ? ' checked' : '';
    html += '<div class="column-config-row' + (isLocked ? ' item-locked' : '') + '">' +
      '<label class="column-config-label"' + (isLocked ? ' title="Plan dates are always visible"' : '') + '>' +
        '<input type="checkbox"' + checked + (isLocked ? ' disabled' : '') +
          ' onchange="toggleColumnVisibility(' + idx + ',this.checked)">' +
        '<span class="column-config-name">' + escapeHtml(col) + '</span>' +
        (isLocked ? '<span class="material-icons-round column-lock-icon">lock</span>' : '') +
      '</label>' +
      columnWidthEditorHtml(idx, t) +
      '</div>';
  });

  html += '<div class="column-panel-footer">' +
    '<button type="button" class="column-panel-reset" onclick="resetAllColumns()"><span class="material-icons-round">visibility</span>Show All</button>' +
    '<button type="button" class="column-panel-reset column-panel-autofit" onclick="autoFitAllColumns(event)"><span class="material-icons-round">fit_screen</span>Auto Fit All</button>' +
    '<button type="button" class="column-panel-reset" onclick="resetAllColumnWidths()"><span class="material-icons-round">width_normal</span>Reset Widths</button>' +
    '</div></div>';
  return html;
}

function toggleColumnPanel(e) {
  e.stopPropagation();
  FMS.table.columnPanelOpen = !FMS.table.columnPanelOpen;
  rerenderCurrentTable();
}

function toggleColumnVisibility(idx, isVisible) {
  var t = FMS.table;
  // Plan-date columns can never be hidden (see renderColumnPanel) - guard
  // here too, so it holds even if the disabled checkbox is bypassed.
  if ((t.lockedCols || []).indexOf(idx) !== -1) {
    delete t.hiddenCols[idx];
    t.columnPanelOpen = true;
    rerenderCurrentTable();
    return;
  }
  if (isVisible) {
    delete t.hiddenCols[idx];
  } else {
    // Never allow hiding every single column (keep at least 1 visible)
    var visibleCount = t.columns.filter(function(c, i) { return !t.hiddenCols[i]; }).length;
    if (visibleCount <= 1) return;
    t.hiddenCols[idx] = true;
  }
  t.hasSavedColPrefs = true; // user has now made an explicit choice - never auto-override again
  persistColumnPrefs();
  t.columnPanelOpen = true; // keep panel open while toggling checkboxes
  rerenderCurrentTable();
}

function resetAllColumns() {
  FMS.table.hiddenCols = {};
  FMS.table.hasSavedColPrefs = true;
  FMS.table.columnPanelOpen = true;
  persistColumnPrefs();
  rerenderCurrentTable();
}

function setColumnWidth(key, rawValue) {
  var bounds = columnWidthBounds(key);
  var value = parseInt(rawValue, 10);
  if (!isFinite(value)) value = defaultColumnWidth(key);
  value = Math.max(bounds.min, Math.min(bounds.max, value));
  FMS.table.colWidths[key] = value;
  FMS.table.hasSavedColPrefs = true;
  FMS.table.columnPanelOpen = true;
  persistColumnPrefs();
  rerenderCurrentTable();
}

function adjustColumnWidth(key, delta) {
  setColumnWidth(key, getConfiguredColumnWidth(FMS.table, key) + delta);
}

var autoFitMeasureCanvas = null;

function contentFontScale() {
  if (FMS.currentFontSize === 'small') return 0.85;
  if (FMS.currentFontSize === 'large') return 1.25;
  return 1;
}

function measureAutoFitText(text, bold, baseFontPx) {
  var value = String(text == null ? '' : text);
  var fontPx = (baseFontPx || 11.5) * contentFontScale();
  try {
    if (!autoFitMeasureCanvas) autoFitMeasureCanvas = document.createElement('canvas');
    var context = autoFitMeasureCanvas.getContext && autoFitMeasureCanvas.getContext('2d');
    if (context) {
      context.font = (bold ? '600 ' : '400 ') + fontPx + 'px Poppins, Arial, sans-serif';
      return context.measureText(value).width;
    }
  } catch (e) { /* deterministic fallback below */ }
  return value.length * (bold ? 0.65 : 0.6) * fontPx;
}

function autoFitDisplayText(rawValue) {
  var value = String(rawValue == null ? '' : rawValue).trim();
  if (safeHttpUrl(value)) return 'Click Here';
