<script>
// ============================================
// FMS - GLOBAL SCRIPTS (Shared across pages)
// ============================================

var FMS = {
  sidebarOpen: false,
  currentTheme: 'dark',
  currentFontSize: 'medium',
  tableCache: {},        // "header|||step" -> { columns, rows, fetchedAt }
  permissionsCache: null,
  lastSyncTime: null,
  autoRefreshTimer: null,
  clockTimer: null,
  syncInFlight: false,
  AUTO_REFRESH_MS: 5 * 60 * 1000 // 5 minutes
};

// ===== LIVE CLOCK (top-right, ticks every second) =====
function startLiveClock() {
  updateLiveClock();
  if (FMS.clockTimer) clearInterval(FMS.clockTimer);
  FMS.clockTimer = setInterval(updateLiveClock, 1000);
}

function updateLiveClock() {
  var el = document.getElementById('liveClock');
  if (!el) return;
  var now = new Date();
  var pad = function(n) { return (n < 10 ? '0' : '') + n; };
  el.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}

// ===== AUTO-REFRESH (background, silent - no spinners, no reload feel) =====
function startAutoRefresh() {
  if (FMS.autoRefreshTimer) clearInterval(FMS.autoRefreshTimer);
  FMS.autoRefreshTimer = setInterval(function() {
    silentRefreshCurrentView();
  }, FMS.AUTO_REFRESH_MS);
}

function setSyncingState(isSyncing) {
  var icon = document.getElementById('syncIcon');
  if (icon) icon.classList.toggle('syncing', isSyncing);
}

// Same "DD Mon YY HH:MM:SS" style used everywhere else in FMS (table
// cells, popup form Planned value, pending-list captions) - kept as a
// small client-side mirror of TAT_Calculator.gs's formatResult() so the
// topbar clock/status doesn't need a round-trip to the server.
var FMS_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatFmsDate(d) {
  var pad2 = function(n) { return ('0' + n).slice(-2); };
  var dd = pad2(d.getDate()) + ' ' + FMS_MONTHS[d.getMonth()] + ' ' + pad2(d.getFullYear() % 100);
  // Mirror formatResult() in TAT_Calculator.gs: omit the time entirely
  // when it's exactly 00:00:00 (a pure date with no meaningful time).
  if (d.getHours() === 0 && d.getMinutes() === 0 && d.getSeconds() === 0) return dd;
  return dd + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}

function setLastUpdatedNow(changed) {
  FMS.lastSyncTime = new Date();
  var el = document.getElementById('lastUpdatedText');
  if (!el) return;
  el.textContent = 'Updated: ' + formatFmsDate(FMS.lastSyncTime);
  if (changed) {
    el.classList.add('updated-flash');
    setTimeout(function() { el.classList.remove('updated-flash'); }, 2500);
  }
}

/**
 * Silently re-fetch permissions (sidebar) + current table (if any) in the
 * background. Does NOT show any loading spinner - only a small sync icon
 * animation - and only touches the DOM if the data actually changed.
 */
function silentRefreshCurrentView() {
  if (FMS.syncInFlight) return;
  if (typeof FMS_SESSION === 'undefined') return;
  FMS.syncInFlight = true;
  setSyncingState(true);

  var pending = 1;
  var anyChanged = false;

  function done() {
    pending--;
    if (pending <= 0) {
      FMS.syncInFlight = false;
      setSyncingState(false);
      setLastUpdatedNow(anyChanged);
    }
  }

  // Refresh sidebar permissions silently (remembers headers/questions, just checks for changes)
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        var newStr = JSON.stringify(res.permissions);
        var oldStr = JSON.stringify(FMS.permissionsCache);
        if (newStr !== oldStr) {
          FMS.permissionsCache = res.permissions;
          renderSidebar(res.permissions);
          anyChanged = true;
        }
      }
      done();
    })
    .withFailureHandler(function() { done(); })
    .getUserPermissions(FMS_SESSION.userName);

  // Refresh Home dashboard summary silently, if user is currently on it
  if (!FMS.currentHeader && !FMS.currentStep) {
    pending++;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          var newStr = JSON.stringify(res);
          var oldStr = JSON.stringify(FMS.homeSummaryCache);
          if (newStr !== oldStr) {
            FMS.homeSummaryCache = res;
            if (!FMS.currentHeader && !FMS.currentStep && document.getElementById('mainContent')) {
              renderHomeDashboard(res);
            }
            anyChanged = true;
          }
        }
        done();
      })
      .withFailureHandler(function() { done(); })
      .wfGetHomeSummary(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, FMS_SESSION.userName);
  }

  // Refresh current table silently, if user currently has one open
  if (FMS.currentHeader && FMS.currentStep) {
    pending++;
    var cacheKey = FMS.currentHeader + '|||' + FMS.currentStep;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          var newStr = JSON.stringify(res.rows) + JSON.stringify(res.columns);
          var cached = FMS.tableCache[cacheKey];
          var oldStr = cached ? (JSON.stringify(cached.rows) + JSON.stringify(cached.columns)) : null;
          if (newStr !== oldStr) {
            FMS.tableCache[cacheKey] = { columns: res.columns, columnTypes: res.columnTypes || [], rows: res.rows, fetchedAt: new Date() };
            FMS.table.columns = res.columns;
            FMS.table.columnTypes = res.columnTypes || [];
            FMS.table.rows = res.rows;
            // Only re-render if this table is still the one on screen
            if (document.getElementById('tableContainer')) {
              renderDataTable(FMS.currentHeader, FMS.currentStep);
            }
            anyChanged = true;
          }
        }
        done();
      })
      .withFailureHandler(function() { done(); })
      .wfGetStepTableData(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, FMS.currentHeader, FMS.currentStep);
  }
}

// ===== SIDEBAR =====
// The sidebar is now an always-visible "icon rail" that expands to show
// full labels automatically on mouse hover (pure CSS :hover) - no click
// needed. The topbar menu button / mobile flow instead toggles a "pinned"
// state, which forces the expanded view to stay open (used on touch
// devices where there's no hover, and as a manual pin/unpin on desktop).
function toggleSidebar() {
  if (FMS.sidebarOpen) closeSidebar(); else openSidebar();
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('pinned');
  document.getElementById('sidebarOverlay').classList.add('active');
  FMS.sidebarOpen = true;
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('pinned');
  document.getElementById('sidebarOverlay').classList.remove('active');
  FMS.sidebarOpen = false;
}

// ===== THEME =====
// Delegates to the global FMS Theme Engine (ThemeEngine.html) so the quick
// topbar toggle stays perfectly in sync with the full Appearance drawer
// (localStorage, data-theme on <html>, system-mode awareness, etc).
function toggleTheme() {
  if (typeof FMSTheme === 'undefined') return; // ThemeEngine not loaded (defensive)
  var resolved = FMSTheme.getResolvedTheme();
  FMSTheme.setDisplayMode(resolved === 'dark' ? 'light' : 'dark');
  FMS.currentTheme = FMSTheme.getResolvedTheme();
}

// ===== FONT SIZE =====
function setFontSize(size) {
  document.body.classList.remove('font-small', 'font-medium', 'font-large');
  document.body.classList.add('font-' + size);
  FMS.currentFontSize = size;
  
  var btns = document.querySelectorAll('.font-btn');
  btns.forEach(function(b) { b.classList.remove('active'); });
  var idx = size === 'small' ? 0 : (size === 'medium' ? 1 : 2);
  if (btns[idx]) btns[idx].classList.add('active');
}

// ===== SIDEBAR NAVIGATION =====
function renderSidebar(permissions) {
  var nav = document.getElementById('sidebarNavGroups');
  var html = '';

  for (var header in permissions) {
    var items = permissions[header];
    html += '<div class="nav-group">';
    html += '<div class="nav-group-header" onclick="toggleGroup(this)" title="' + escapeAttr(header) + '">';
    html += '<span class="material-icons-round group-icon">folder</span>';
    html += '<span class="header-text">' + escapeHtml(header) + '</span>';
    html += '<span class="material-icons-round arrow">expand_more</span>';
    html += '</div>';
    html += '<div class="nav-group-items">';
    for (var i = 0; i < items.length; i++) {
      html += '<div class="nav-item" onclick="openPage(\'' + escapeAttr(items[i]) + '\', \'' + escapeAttr(header) + '\')" title="' + escapeAttr(items[i]) + '">';
      html += '<span class="material-icons-round">chevron_right</span>';
      html += '<span>' + escapeHtml(items[i]) + '</span>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  if (!html) {
    html = '<div style="padding:30px; text-align:center; color:var(--text-muted); font-size:12px;">No permissions assigned.</div>';
  }

  nav.innerHTML = html;
}

function toggleGroup(el) {
  var group = el.parentElement;
  // Close all other groups
  var allGroups = document.querySelectorAll('.nav-group');
  allGroups.forEach(function(g) {
    if (g !== group) g.classList.remove('expanded');
  });
  group.classList.toggle('expanded');
}

function openPage(pageName, headerName) {
  closeSidebar();

  // Mark active nav item (Home item included, so it un-highlights too)
  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(item) { item.classList.remove('active'); });
  if (window.event && window.event.target) {
    var clicked = window.event.target.closest('.nav-item');
    if (clicked) clicked.classList.add('active');
  }

  FMS.currentHeader = headerName;
  FMS.currentStep = pageName;
  loadStepTable(headerName, pageName);
}

// ===== HOME DASHBOARD (summary of all assigned Steps) =====
function goHome() {
  closeSidebar();
  FMS.currentHeader = null;
  FMS.currentStep = null;

  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(item) { item.classList.remove('active'); });
  var homeItem = document.getElementById('navHomeItem');
  if (homeItem) homeItem.classList.add('active');

  loadHomeDashboard();
}

function loadHomeDashboard() {
  var cached = FMS.homeSummaryCache;

  if (cached) {
    // Instant render from cache (same "remembered" pattern as the tables),
    // then silently refresh counts in the background.
    renderHomeDashboard(cached, false);
    fetchHomeSummaryInBackground(false);
  } else {
    // NEVER show a "Loading..." spinner on Home - render the full page
    // shell INSTANTLY with placeholder zero counts (isSkeleton=true shows
    // "Loading latest data..." in place of a timestamp), then silently
    // fetch the real numbers in the background and update in place the
    // moment they arrive - so the page always feels already-loaded.
    renderHomeDashboard({ success: true, totalPending: 0, totalCompleted: 0, groups: [] }, true);
    fetchHomeSummaryInBackground(true);
  }
}

function fetchHomeSummaryInBackground(isFirstLoad) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        if (isFirstLoad) {
          document.getElementById('mainContent').innerHTML =
            '<div class="pending-empty"><span class="material-icons-round">error_outline</span>' + escapeHtml(res.message || 'Could not load dashboard') + '</div>';
        }
        return;
      }
      var changed = JSON.stringify(res) !== JSON.stringify(FMS.homeSummaryCache);
      FMS.homeSummaryCache = res;
      FMS.homeLastUpdated = new Date();
      // Only touch the DOM if the user is still on the Home page
      if (!FMS.currentHeader && !FMS.currentStep) {
        renderHomeDashboard(res, false, changed);
      }
      setLastUpdatedNow(changed);
    })
    .withFailureHandler(function(err) {
      if (isFirstLoad) {
        document.getElementById('mainContent').innerHTML = '<div class="pending-empty">' + escapeHtml(err.message) + '</div>';
      }
    })
    .wfGetHomeSummary(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, FMS_SESSION.userName);
}

function renderHomeDashboard(res, isSkeleton, justUpdated) {
  var main = document.getElementById('mainContent');
  var now = new Date();
  var hour = now.getHours();
  var greeting = hour < 12 ? 'Good Morning' : (hour < 17 ? 'Good Afternoon' : 'Good Evening');

  var html = '<div class="home-page">';

  // "Last updated on ..." line at the TOP of the Home page itself - shows
  // "Loading latest data..." only for the very first instant render
  // (before any real fetch has ever completed), and the actual date/time
  // of the most recent successful refresh after that (flashes green
  // briefly whenever the numbers actually changed).
  var lastUpdatedLine = isSkeleton
    ? '<span class="home-last-updated-loading"><span class="material-icons-round sync-icon syncing">sync</span>Loading latest data...</span>'
    : 'Last updated on ' + formatFmsDate(FMS.homeLastUpdated || new Date());

  html += '<div class="home-header">' +
    '<div><h2>' + greeting + ', ' + escapeHtml(FMS_SESSION.userName) + '</h2>' +
    '<p class="subtitle">Here\'s a summary of everything assigned to you.</p></div>' +
    '<div class="home-last-updated' + (justUpdated ? ' updated-flash' : '') + '" id="homeLastUpdated">' + lastUpdatedLine + '</div>' +
    '</div>';

  var totalPending = res.totalPending || 0;
  var totalCompleted = res.totalCompleted || 0;
  var grandTotal = totalPending + totalCompleted;
  var pendingPct = grandTotal > 0 ? Math.round((totalPending / grandTotal) * 100) : 0;
  var completedPct = grandTotal > 0 ? Math.round((totalCompleted / grandTotal) * 100) : 0;

  html += '<div class="home-stats-row' + (justUpdated ? ' stats-updated-flash' : '') + '">';
  html += homeStatCardHtml('Pending', totalPending, 'pending_actions', 'stat-pending', pendingPct);
  html += homeStatCardHtml('Completed', totalCompleted, 'task_alt', 'stat-completed', completedPct);
  html += homeStatCardHtml('Total Items', grandTotal, 'inventory_2', 'stat-total', null);
  html += '</div>';

  if (!res.groups || res.groups.length === 0) {
    if (isSkeleton) {
      // First-ever instant render, before we know if there are any groups
      // yet - stay blank/neutral rather than claiming "no steps assigned".
      html += '<div class="pending-loading">&nbsp;</div>';
    } else {
      html += '<div class="pending-empty"><span class="material-icons-round">inbox</span>No steps assigned to you yet.</div>';
    }
  } else {
    res.groups.forEach(function(group) {
      html += '<div class="home-group">';
      html += '<div class="home-group-title"><span class="material-icons-round">folder</span>' + escapeHtml(group.header) + '</div>';
      html += '<div class="home-cards-grid">';
      group.steps.forEach(function(stepEntry) {
        html += homeStepCardHtml(group.header, stepEntry);
      });
      html += '</div></div>';
    });
  }

  html += '</div>';
  main.innerHTML = html;

  if (justUpdated) {
    setTimeout(function() {
      var el = document.getElementById('homeLastUpdated');
      if (el) el.classList.remove('updated-flash');
      var statsRow = document.querySelector('.home-stats-row.stats-updated-flash');
      if (statsRow) statsRow.classList.remove('stats-updated-flash');
    }, 2500);
  }
}

function homeStatCardHtml(label, count, icon, extraClass, pct) {
  var pctHtml = (pct !== null && pct !== undefined) ? '<span class="home-stat-pct">' + pct + '%</span>' : '';
  return '<div class="home-stat-card ' + extraClass + '">' +
    '<span class="material-icons-round">' + icon + '</span>' +
    '<div><div class="home-stat-count">' + count + pctHtml + '</div><div class="home-stat-label">' + escapeHtml(label) + '</div></div>' +
    '</div>';
}

function homeStepCardHtml(headerName, stepEntry) {
  var hasError = !!stepEntry.error;
  var pending = stepEntry.pending || 0;
  var completed = stepEntry.completed || 0;
  var total = pending + completed;
  var completedPct = total > 0 ? Math.round((completed / total) * 100) : 0;
  var pendingPct = total > 0 ? (100 - completedPct) : 0;

  var html = '<div class="home-step-card' + (pending > 0 ? ' has-pending' : '') + '" onclick="openPage(\'' + escapeAttr(stepEntry.step) + '\', \'' + escapeAttr(headerName) + '\')">';
  html += '<div class="home-step-card-title">' + escapeHtml(stepEntry.step) + '</div>';

  if (hasError) {
    html += '<div class="home-step-card-error">' + escapeHtml(stepEntry.error) + '</div>';
  } else {
    html += '<div class="home-step-card-counts">' +
      '<span class="hs-pending">' + pending + ' Pending (' + pendingPct + '%)</span>' +
      '<span class="hs-completed">' + completed + ' Done (' + completedPct + '%)</span>' +
      '</div>';
    html += '<div class="home-step-progress"><div class="home-step-progress-fill" style="width:' + completedPct + '%"></div></div>';
  }

  html += '</div>';
  return html;
}

// ===== WORKFLOW: DATA TABLE (mirrors the real sheet) =====
FMS.table = {
  columns: [],
  columnTypes: [],   // parallel to columns[] - 'DATE' marks a date/time column
  rows: [],
  filterStatus: 'pending',   // 'pending' | 'completed' | 'all'
  globalSearch: '',
  colSearch: {},              // colIndex -> search text
  sortCol: null,
  sortDir: 'asc',
  page: 1,
  pageSize: 50,
  colWidths: {},               // colIndex -> px width (resizable columns)
  hiddenCols: {},               // colIndex -> true if hidden
  columnPanelOpen: false,
  justResized: false,
  cacheKey: null
};

// Remembers column width/visibility choices PER STEP (like the data cache),
// so switching steps and coming back keeps your resize/hide preferences.
FMS.columnPrefs = {}; // cacheKey -> { colWidths: {}, hiddenCols: {} }

function getColumnPrefs(cacheKey) {
  if (!FMS.columnPrefs[cacheKey]) {
    FMS.columnPrefs[cacheKey] = { colWidths: {}, hiddenCols: {}, hasSavedPrefs: false };
  }
  return FMS.columnPrefs[cacheKey];
}

/**
 * Applies the backend's defaultHiddenCols (currently just the audit-trail
 * "Modified By"/"Modified At" columns) ONLY if the user hasn't already
 * made their own Show/Hide choices for this step - so a user's manual
 * "unhide Modified By" choice is never silently re-hidden on a later
 * background refresh.
 */
function applyDefaultHiddenCols(defaultHiddenCols) {
  if (FMS.table.hasSavedColPrefs) return; // user already customized - don't override
  (defaultHiddenCols || []).forEach(function(idx) {
    FMS.table.hiddenCols[idx] = true;
  });
}

/**
 * Loads a Step's table. If we already have cached data for this exact
 * header+step (from a previous visit or a background auto-refresh), it is
 * rendered INSTANTLY with no spinner - the header/questions/columns are
 * "remembered". A fresh copy is then fetched silently in the background
 * to pick up any new rows, without blocking or re-showing a loader.
 */
function loadStepTable(headerName, stepName) {
  var main = document.getElementById('mainContent');
  var cacheKey = headerName + '|||' + stepName;
  var cached = FMS.tableCache[cacheKey];

  FMS.table.filterStatus = 'pending';
  FMS.table.globalSearch = '';
  FMS.table.colSearch = {};
  FMS.table.sortCol = null;
  FMS.table.page = 1;
  FMS.table.cacheKey = cacheKey;
  FMS.table.columnPanelOpen = false;
  var prefs = getColumnPrefs(cacheKey);
  FMS.table.colWidths = prefs.colWidths;
  FMS.table.hiddenCols = prefs.hiddenCols;
  FMS.table.hasSavedColPrefs = prefs.hasSavedPrefs;

  // Compact page-title strip (step name + header as a small breadcrumb)
  // is placed INLINE with the status tabs (same row) - saves one whole
  // line of vertical space so more table rows are visible on screen.
  var pageShell =
    '<div class="table-page">' +
    '<div id="tableContainer"></div>' +
    '</div>';

  if (cached) {
    // Instant render from cache - no spinner, no "circle ghoomna"
    main.innerHTML = pageShell;
    FMS.table.columns = cached.columns;
    FMS.table.columnTypes = cached.columnTypes || [];
    FMS.table.rows = cached.rows;
    applyDefaultHiddenCols(cached.defaultHiddenCols);
    renderDataTable(headerName, stepName);
    fetchStepTableInBackground(headerName, stepName, cacheKey, false);
  } else {
    // First time opening this step - show loader once
    main.innerHTML = pageShell;
    document.getElementById('tableContainer').innerHTML = '<div class="pending-loading">Loading data...</div>';
    fetchStepTableInBackground(headerName, stepName, cacheKey, true);
  }
}

function fetchStepTableInBackground(headerName, stepName, cacheKey, showErrorsInline) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        if (showErrorsInline) {
          document.getElementById('tableContainer').innerHTML =
            '<div class="pending-empty"><span class="material-icons-round">error_outline</span>' + escapeHtml(res.message || 'Error loading data') + '</div>';
        }
        return;
      }
      FMS.tableCache[cacheKey] = { columns: res.columns, columnTypes: res.columnTypes || [], defaultHiddenCols: res.defaultHiddenCols || [], rows: res.rows, fetchedAt: new Date() };
      // Only update the visible table if the user is still viewing this exact step
      if (FMS.currentHeader === headerName && FMS.currentStep === stepName) {
        FMS.table.columns = res.columns;
        FMS.table.columnTypes = res.columnTypes || [];
        FMS.table.rows = res.rows;
        applyDefaultHiddenCols(res.defaultHiddenCols);
        if (document.getElementById('tableContainer')) {
          renderDataTable(headerName, stepName);
        }
      }
      setLastUpdatedNow(false);
    })
    .withFailureHandler(function(err) {
      if (showErrorsInline) {
        document.getElementById('tableContainer').innerHTML =
          '<div class="pending-empty">' + escapeHtml(err.message) + '</div>';
      }
    })
    .wfGetStepTableData(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet, headerName, stepName);
}

// The cell itself holds a formatted string produced by formatResult() in
// TAT_Calculator.gs, always in the fixed "DD Mon YY HH:MM:SS" style (e.g.
// "24 Jul 26 17:43:32"). Parsed explicitly (not via new Date(str)) so this
// works identically across every browser, instead of relying on each
// browser's own date-string parsing quirks.
var FMS_MONTH_LOOKUP = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };

function parseFmsDate(str) {
  str = String(str || '').trim();
  // Full "DD Mon YY HH:MM:SS" (normal case)
  var m = /^(\d{2})\s+([A-Za-z]{3})\s+(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/.exec(str);
  if (m) {
    var monthIdx = FMS_MONTH_LOOKUP[m[2]];
    if (monthIdx === undefined) return null;
    var year = 2000 + parseInt(m[3], 10); // "26" -> 2026
    return new Date(year, monthIdx, parseInt(m[1], 10), parseInt(m[4], 10), parseInt(m[5], 10), parseInt(m[6], 10));
  }
  // Date-only "DD Mon YY" (formatResult() omits a 00:00:00 time entirely)
  var m2 = /^(\d{2})\s+([A-Za-z]{3})\s+(\d{2})$/.exec(str);
  if (m2) {
    var monthIdx2 = FMS_MONTH_LOOKUP[m2[2]];
    if (monthIdx2 === undefined) return null;
    var year2 = 2000 + parseInt(m2[3], 10);
    return new Date(year2, monthIdx2, parseInt(m2[1], 10), 0, 0, 0);
  }
  return null;
}

/**
 * Matches a cell's date against a { start: Date, end: Date } range
 * (inclusive, whole calendar days - time-of-day is ignored on both
 * sides). A null/undefined range means "no filter" (always matches).
 */
function cellMatchesDateRange(cellValue, range) {
  if (!range || (!range.start && !range.end)) return true;
  var str = String(cellValue || '').trim();
  if (!str) return false;
  var parsed = parseFmsDate(str) || new Date(str); // fallback for any non-FMS-formatted date text
  if (!parsed || isNaN(parsed.getTime())) return false;

  var cellDay = new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
  if (range.start) {
    var startDay = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate());
    if (cellDay.getTime() < startDay.getTime()) return false;
  }
  if (range.end) {
    var endDay = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate());
    if (cellDay.getTime() > endDay.getTime()) return false;
  }
  return true;
}

function isDateColumn(idx) {
  return (FMS.table.columnTypes || [])[idx] === 'DATE';
}

function getFilteredSortedRows() {
  var t = FMS.table;
  var rows = t.rows.filter(function(r) {
    if (t.filterStatus === 'overdue') {
      if (!r.overdue) return false;
    } else if (t.filterStatus !== 'all' && r.status !== t.filterStatus) {
      return false;
    }

    if (t.globalSearch) {
      var hay = r.cells.join(' ').toLowerCase();
      if (hay.indexOf(t.globalSearch.toLowerCase()) === -1) return false;
    }

    for (var colIdx in t.colSearch) {
      var term = t.colSearch[colIdx];
      if (!term) continue;
      if (isDateColumn(colIdx)) {
        if (!cellMatchesDateRange(r.cells[colIdx], term)) return false;
      } else {
        var cellVal = String(r.cells[colIdx] || '').toLowerCase();
        if (cellVal.indexOf(term.toLowerCase()) === -1) return false;
      }
    }
    return true;
  });

  if (t.sortCol !== null) {
    rows.sort(function(a, b) {
      var va = a.cells[t.sortCol] || '';
      var vb = b.cells[t.sortCol] || '';
      var na = parseFloat(va), nb = parseFloat(vb);
      var cmp;
      if (!isNaN(na) && !isNaN(nb) && va !== '' && vb !== '') {
        cmp = na - nb;
      } else {
        cmp = String(va).localeCompare(String(vb));
      }
      return t.sortDir === 'asc' ? cmp : -cmp;
    });
  }

  return rows;
}

// Detects a bare http(s) URL and renders it as a short "Click Here" link
// instead of dumping the raw URL into the cell (per user request).
var URL_PATTERN = /^https?:\/\/\S+$/i;

function renderCellValue(rawValue) {
  var value = String(rawValue == null ? '' : rawValue).trim();
  if (URL_PATTERN.test(value)) {
    return '<a href="' + escapeAttr(value) + '" target="_blank" rel="noopener noreferrer" class="cell-link" onclick="event.stopPropagation()">Click Here</a>';
  }
  // Also handle cells with MULTIPLE comma/space separated URLs (e.g. multi-file uploads)
  var parts = value.split(/,\s*/);
  if (parts.length > 1 && parts.every(function(p) { return URL_PATTERN.test(p.trim()); })) {
    return parts.map(function(p, i) {
      return '<a href="' + escapeAttr(p.trim()) + '" target="_blank" rel="noopener noreferrer" class="cell-link" onclick="event.stopPropagation()">Click Here' + (parts.length > 1 ? ' ' + (i + 1) : '') + '</a>';
    }).join(', ');
  }
  return escapeHtml(value);
}

function renderDataTable(headerName, stepName) {
  var t = FMS.table;
  var allRows = t.rows;
  var pendingCount = allRows.filter(function(r){ return r.status === 'pending'; }).length;
  var completedCount = allRows.filter(function(r){ return r.status === 'completed'; }).length;
  var overdueCount = allRows.filter(function(r){ return r.overdue; }).length;

  var filtered = getFilteredSortedRows();
  var totalPages = Math.max(1, Math.ceil(filtered.length / t.pageSize));
  if (t.page > totalPages) t.page = totalPages;
  var startIdx = (t.page - 1) * t.pageSize;
  var pageRows = filtered.slice(startIdx, startIdx + t.pageSize);

  var visibleIdx = [];
  t.columns.forEach(function(col, idx) { if (!t.hiddenCols[idx]) visibleIdx.push(idx); });

  // A vertical divider line is drawn right BEFORE the "Planned" column -
  // it visually separates the base/identifying columns (Timestamp, Item
  // Name, etc.) from this Step's own workflow columns (Planned, Actual,
  // and everything the user fills in). Explicitly requested by the user.
  var plannedColIdx = t.columns.indexOf('Planned');

  var html = '';

  // ---- Breadcrumb title + Status filter tabs on the SAME row (saves a
  // whole line of vertical space vs. having the title on its own row) ----
  html += '<div class="status-tabs-row">';
  html += '<div class="table-page-title"><span class="material-icons-round">assignment</span>' +
    '<strong>' + escapeHtml(stepName) + '</strong><span class="breadcrumb-sep">/</span>' + escapeHtml(headerName) + '</div>';
  html += '<div class="status-tabs">';
  html += statusTabHtml('pending', 'Pending', pendingCount, t.filterStatus);
  html += statusTabHtml('completed', 'Completed', completedCount, t.filterStatus);
  html += statusTabHtml('all', 'All', allRows.length, t.filterStatus);
  if (overdueCount > 0) {
    html += '<button class="status-tab status-tab-overdue' + (t.filterStatus === 'overdue' ? ' active' : '') + '" onclick="onStatusFilter(\'overdue\')">' +
      '<span class="material-icons-round" style="font-size:13px;">warning</span>Overdue <span class="status-tab-count">' + overdueCount + '</span></button>';
  }
  html += '</div>';
  html += '</div>';

  // ---- Global search + column visibility toggle + page size ----
  html += '<div class="table-toolbar">';
  html += '<div class="table-search"><span class="material-icons-round">search</span>' +
    '<input type="text" id="tableGlobalSearch" placeholder="Search all columns..." value="' + escapeAttr(t.globalSearch) + '" oninput="onGlobalSearch(this.value)"></div>';
  html += '<div class="table-toolbar-right">';
  html += '<div class="column-toggle-wrap">' +
    '<button type="button" class="icon-btn" title="Show/Hide Columns" onclick="toggleColumnPanel(event)"><span class="material-icons-round">view_column</span></button>' +
    renderColumnPanel(t) +
    '</div>';
  html += '<div class="page-size-select">Show ' +
    '<select id="pageSizeSelect" onchange="onPageSizeChange(this.value)">' +
    [50, 100, 500, 1000].map(function(n) { return '<option value="' + n + '"' + (t.pageSize === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
    '</select> entries</div>';
  html += '</div>';
  html += '</div>';

  // ---- Table ----
  // Every column gets an EXPLICIT pixel width (a sensible default of 150px
  // if the user hasn't dragged it yet). Combined with table-layout:fixed
  // and the table itself being width:auto (not 100%), this guarantees that
  // resizing ONE column never causes any other column to grow/shrink to
  // compensate - the total table width is simply the sum of all column
  // widths, and leftover space (if any) stays blank after the last column.
  var DEFAULT_COL_WIDTH = 150;
  html += '<div class="table-scroll-wrap"><table class="data-table" id="fmsDataTable"><thead>';
  html += '<tr>';
  html += '<th class="col-serial">S.No</th>';
  visibleIdx.forEach(function(idx) {
    var arrow = t.sortCol === idx ? (t.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    var w = t.colWidths[idx] || DEFAULT_COL_WIDTH;
    var style = ' style="width:' + w + 'px; min-width:' + w + 'px; max-width:' + w + 'px;"';
    var dividerClass = (idx === plannedColIdx) ? ' col-before-planned' : '';
    html += '<th data-col="' + idx + '" class="' + dividerClass.trim() + '"' + style + '>' +
      '<span class="th-label" onclick="onSortColumn(' + idx + ')">' + escapeHtml(t.columns[idx]) + arrow + '</span>' +
      '<span class="col-resize-handle" onmousedown="startColResize(event,' + idx + ')"></span>' +
      '</th>';
  });
  html += '<th class="col-action">Action</th>';
  html += '</tr><tr class="col-search-row">';
  html += '<th></th>';
  visibleIdx.forEach(function(idx) {
    var dividerClass = (idx === plannedColIdx) ? ' col-before-planned' : '';
    if (isDateColumn(idx)) {
      // Any column holding a Date/Time value (Planned, Actual, Timestamp,
      // or any Row6 "DATE" type) gets the dual-calendar date-RANGE picker
      // in its search box instead of a plain text box.
      var range = t.colSearch[idx];
      var label = formatDateRangeLabel(range);
      html += '<th class="' + dividerClass.trim() + '"><div class="date-search-wrap">' +
        '<button type="button" class="date-range-trigger" onclick="openDateRangePicker(event, ' + idx + ')">' +
        '<span class="material-icons-round">date_range</span><span class="date-range-trigger-label">' + escapeHtml(label || 'Any date') + '</span>' +
        '</button>' +
        (range ? '<span class="date-search-clear material-icons-round" onclick="onColumnSearch(' + idx + ', null)">close</span>' : '') +
        '</div></th>';
    } else {
      html += '<th class="' + dividerClass.trim() + '"><input type="text" placeholder="Search..." value="' + escapeAttr(t.colSearch[idx] || '') + '" oninput="onColumnSearch(' + idx + ', this.value)"></th>';
    }
  });
  html += '<th></th>';
  html += '</tr></thead><tbody>';

  if (pageRows.length === 0) {
    html += '<tr><td colspan="' + (visibleIdx.length + 2) + '" class="table-empty-cell">No matching records found.</td></tr>';
  } else {
    pageRows.forEach(function(r, i) {
      html += '<tr class="' + (r.overdue ? 'row-overdue' : '') + '">';
      html += '<td class="col-serial">' + (startIdx + i + 1) + '</td>';
      visibleIdx.forEach(function(idx) {
        var dividerClass = (idx === plannedColIdx) ? ' col-before-planned' : '';
        html += '<td class="' + dividerClass.trim() + '">' + renderCellValue(r.cells[idx]) + '</td>';
      });
      html += '<td class="col-action">';
      if (r.status === 'pending') {
        // No "Overdue" text/badge - the red row tint (tr.row-overdue) is
        // the only visual indicator, per user request.
        html += '<button class="btn-fill" onclick="openStepForm(\'' + escapeAttr(headerName) + '\',\'' + escapeAttr(stepName) + '\',' + r.row + ')">Fill</button>';
      } else {
        html += '<span class="status-badge-done">Done</span>';
      }
      html += '</td></tr>';
    });
  }

  html += '</tbody></table></div>';

  // ---- Pagination ----
  html += '<div class="table-pagination">';
  html += '<span class="pagination-info">Showing ' + (filtered.length === 0 ? 0 : startIdx + 1) + '-' + Math.min(startIdx + t.pageSize, filtered.length) + ' of ' + filtered.length + '</span>';
  html += '<div class="pagination-controls">';
  html += '<button class="page-btn" ' + (t.page <= 1 ? 'disabled' : '') + ' onclick="onPageChange(' + (t.page - 1) + ')">Prev</button>';
  html += '<span class="page-indicator">Page ' + t.page + ' of ' + totalPages + '</span>';
  html += '<button class="page-btn" ' + (t.page >= totalPages ? 'disabled' : '') + ' onclick="onPageChange(' + (t.page + 1) + ')">Next</button>';
  html += '</div></div>';

  // Preserve the table's horizontal scroll position across re-renders
  // (sorting, filtering, searching, resizing, etc. all rebuild this HTML
  // from scratch, which would otherwise reset scrollLeft back to 0 every
  // time - very disorienting if the user had scrolled right to see a
  // far-right column before clicking a header to sort it).
  var existingWrap = document.querySelector('#tableContainer .table-scroll-wrap');
  var savedScrollLeft = existingWrap ? existingWrap.scrollLeft : 0;

  document.getElementById('tableContainer').innerHTML = html;

  var newWrap = document.querySelector('#tableContainer .table-scroll-wrap');
  if (newWrap && savedScrollLeft) newWrap.scrollLeft = savedScrollLeft;
}

// ===== COLUMN SHOW/HIDE PANEL =====
function renderColumnPanel(t) {
  if (!t.columnPanelOpen) return '<div class="column-panel" id="columnPanel"></div>';
  var html = '<div class="column-panel open" id="columnPanel" onclick="event.stopPropagation()">';
  html += '<div class="column-panel-title">Show / Hide Columns</div>';
  t.columns.forEach(function(col, idx) {
    var checked = !t.hiddenCols[idx] ? ' checked' : '';
    html += '<label class="column-panel-item">' +
      '<input type="checkbox"' + checked + ' onchange="toggleColumnVisibility(' + idx + ', this.checked)">' +
      '<span>' + escapeHtml(col) + '</span>' +
      '</label>';
  });
  html += '<button type="button" class="column-panel-reset" onclick="resetAllColumns()">Show All</button>';
  html += '</div>';
  return html;
}

function toggleColumnPanel(e) {
  e.stopPropagation();
  FMS.table.columnPanelOpen = !FMS.table.columnPanelOpen;
  renderDataTable(FMS.currentHeader, FMS.currentStep);
}

function toggleColumnVisibility(idx, isVisible) {
  var t = FMS.table;
  if (isVisible) {
    delete t.hiddenCols[idx];
  } else {
    // Never allow hiding every single column (keep at least 1 visible)
    var visibleCount = t.columns.filter(function(c, i) { return !t.hiddenCols[i]; }).length;
    if (visibleCount <= 1) return;
    t.hiddenCols[idx] = true;
  }
  t.hasSavedColPrefs = true; // user has now made an explicit choice - never auto-override again
  persistColumnPrefs();
  t.columnPanelOpen = true; // keep panel open while toggling checkboxes
  renderDataTable(FMS.currentHeader, FMS.currentStep);
}

function resetAllColumns() {
  FMS.table.hiddenCols = {};
  FMS.table.hasSavedColPrefs = true;
  persistColumnPrefs();
  renderDataTable(FMS.currentHeader, FMS.currentStep);
}

function persistColumnPrefs() {
  if (!FMS.table.cacheKey) return;
  var prefs = getColumnPrefs(FMS.table.cacheKey);
  prefs.colWidths = FMS.table.colWidths;
  prefs.hiddenCols = FMS.table.hiddenCols;
  prefs.hasSavedPrefs = FMS.table.hasSavedColPrefs;
}

// Close the column panel when clicking anywhere outside it
document.addEventListener('click', function(e) {
  if (FMS.table && FMS.table.columnPanelOpen) {
    var panel = document.getElementById('columnPanel');
    var toggleBtn = e.target.closest ? e.target.closest('.column-toggle-wrap') : null;
    if (panel && !panel.contains(e.target) && !toggleBtn) {
      FMS.table.columnPanelOpen = false;
      if (document.getElementById('tableContainer')) {
        renderDataTable(FMS.currentHeader, FMS.currentStep);
      }
    }
  }
});

// ===== COLUMN RESIZE (drag the handle on the right edge of a <th>) =====
var colResizeState = null;

function startColResize(e, idx) {
  e.preventDefault();
  e.stopPropagation();
  var th = e.target.closest('th');
  colResizeState = { idx: idx, startX: e.clientX, startWidth: th.offsetWidth, th: th };
  document.addEventListener('mousemove', onColResizeMove);
  document.addEventListener('mouseup', onColResizeEnd);
}

function onColResizeMove(e) {
  if (!colResizeState) return;
  var delta = e.clientX - colResizeState.startX;
  var newWidth = Math.max(50, colResizeState.startWidth + delta);
  colResizeState.th.style.width = newWidth + 'px';
  colResizeState.th.style.minWidth = newWidth + 'px';
  colResizeState.th.style.maxWidth = newWidth + 'px';
  colResizeState.liveWidth = newWidth;
}

function onColResizeEnd() {
  if (!colResizeState) return;
  if (colResizeState.liveWidth) {
    FMS.table.colWidths[colResizeState.idx] = colResizeState.liveWidth;
    persistColumnPrefs();
  }
  document.removeEventListener('mousemove', onColResizeMove);
  document.removeEventListener('mouseup', onColResizeEnd);
  colResizeState = null;
}

function statusTabHtml(key, label, count, active) {
  return '<button class="status-tab' + (active === key ? ' active' : '') + '" onclick="onStatusFilter(\'' + key + '\')">' +
    label + ' <span class="status-tab-count">' + count + '</span></button>';
}

function onStatusFilter(status) {
  FMS.table.filterStatus = status;
  FMS.table.page = 1;
  renderDataTable(FMS.currentHeader, FMS.currentStep);
}

function onGlobalSearch(value) {
  FMS.table.globalSearch = value;
  FMS.table.page = 1;
  renderDataTable(FMS.currentHeader, FMS.currentStep);
  // restore focus after re-render
  var el = document.getElementById('tableGlobalSearch');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function onColumnSearch(colIdx, value) {
  FMS.table.colSearch[colIdx] = value;
  FMS.table.page = 1;
  renderDataTable(FMS.currentHeader, FMS.currentStep);
  var inputs = document.querySelectorAll('.col-search-row input');
  var target = inputs[colIdx];
  if (target && typeof target.setSelectionRange === 'function') {
    target.focus();
    target.setSelectionRange(target.value.length, target.value.length);
  }
}

// ================================================================
// DATE-RANGE PICKER (dual calendar + presets, matches MerTraCode UI)
// ================================================================
FMS.dateRangePicker = {
  open: false,
  colIdx: null,
  viewMonth: null,      // Date - first of the LEFT calendar's visible month (right = +1 month)
  selecting: null,       // 'start' | null - which end of the range the next click sets
  pendingRange: null     // { start: Date|null, end: Date|null } - working copy until Apply
};

var DATE_RANGE_PRESETS = [
  { key: 'today', label: 'Today' },
  { key: 'yesterday', label: 'Yesterday' },
  { key: 'thisWeek', label: 'This Week' },
  { key: 'lastWeek', label: 'Last Week' },
  { key: 'last7', label: 'Last 7 Days' },
  { key: 'last30', label: 'Last 30 Days' },
  { key: 'thisMonth', label: 'This Month' },
  { key: 'lastMonth', label: 'Last Month' },
  { key: 'all', label: 'All' }
];

function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function computePresetRange(key) {
  var today = startOfDay(new Date());
  switch (key) {
    case 'today': return { start: today, end: today };
    case 'yesterday': { var y = new Date(today); y.setDate(y.getDate() - 1); return { start: y, end: y }; }
    case 'thisWeek': { var s = new Date(today); s.setDate(today.getDate() - today.getDay()); return { start: s, end: today }; }
    case 'lastWeek': { var e = new Date(today); e.setDate(today.getDate() - today.getDay() - 1); var s2 = new Date(e); s2.setDate(e.getDate() - 6); return { start: s2, end: e }; }
    case 'last7': { var s3 = new Date(today); s3.setDate(today.getDate() - 6); return { start: s3, end: today }; }
    case 'last30': { var s4 = new Date(today); s4.setDate(today.getDate() - 29); return { start: s4, end: today }; }
    case 'thisMonth': return { start: new Date(today.getFullYear(), today.getMonth(), 1), end: today };
    case 'lastMonth': { var lm = new Date(today.getFullYear(), today.getMonth() - 1, 1); var lmEnd = new Date(today.getFullYear(), today.getMonth(), 0); return { start: lm, end: lmEnd }; }
    case 'all': return null; // no filter
    default: return null;
  }
}

function ensureDateRangePickerExists() {
  if (document.getElementById('fmsDateRangePicker')) return;
  var html =
    '<div class="date-range-overlay" id="fmsDateRangeOverlay" onclick="closeDateRangePicker()"></div>' +
    '<div class="date-range-picker" id="fmsDateRangePicker">' +
      '<div class="drp-presets" id="drpPresets"></div>' +
      '<div class="drp-calendars">' +
        '<div class="drp-calendars-row">' +
          '<div class="drp-month" id="drpMonthLeft"></div>' +
          '<div class="drp-month" id="drpMonthRight"></div>' +
        '</div>' +
        '<div class="drp-footer">' +
          '<button type="button" class="btn btn-secondary" onclick="closeDateRangePicker()">Cancel</button>' +
          '<button type="button" class="btn btn-primary" onclick="applyDateRangePicker()">Apply</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('fmsDateRangePicker').addEventListener('click', function(e) { e.stopPropagation(); });
}

function openDateRangePicker(e, colIdx) {
  e.stopPropagation();
  ensureDateRangePickerExists();
  var p = FMS.dateRangePicker;
  p.open = true;
  p.colIdx = colIdx;
  var existing = FMS.table.colSearch[colIdx];
  p.pendingRange = existing ? { start: existing.start, end: existing.end } : { start: null, end: null };
  p.selecting = null;
  var anchor = p.pendingRange.start || p.pendingRange.end || new Date();
  p.viewMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);

  var picker = document.getElementById('fmsDateRangePicker');
  var overlay = document.getElementById('fmsDateRangeOverlay');
  overlay.classList.add('active');
  picker.classList.add('open');

  // Position the picker near the trigger button that was clicked
  var btn = e.target.closest ? e.target.closest('.date-range-trigger') : null;
  if (btn && btn.getBoundingClientRect) {
    var rect = btn.getBoundingClientRect();
    picker.style.top = (rect.bottom + 6) + 'px';
    picker.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 660)) + 'px';
  }

  renderDateRangePicker();
}

function closeDateRangePicker() {
  var picker = document.getElementById('fmsDateRangePicker');
  var overlay = document.getElementById('fmsDateRangeOverlay');
  if (picker) picker.classList.remove('open');
  if (overlay) overlay.classList.remove('active');
  FMS.dateRangePicker.open = false;
}

function applyDateRangePicker() {
  var p = FMS.dateRangePicker;
  var range = p.pendingRange;
  onColumnSearch(p.colIdx, (range && (range.start || range.end)) ? range : null);
  closeDateRangePicker();
}

function renderDateRangePicker() {
  var p = FMS.dateRangePicker;
  if (!p.viewMonth) p.viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); // defensive fallback

  // Presets sidebar
  var presetsHtml = DATE_RANGE_PRESETS.map(function(preset) {
    var isActive = isPresetActive(preset.key, p.pendingRange);
    return '<button type="button" class="drp-preset-btn' + (isActive ? ' active' : '') + '" onclick="selectDateRangePreset(\'' + preset.key + '\')">' + preset.label + '</button>';
  }).join('');
  document.getElementById('drpPresets').innerHTML = presetsHtml;

  // Two month calendars: left = viewMonth, right = viewMonth+1
  var rightMonth = new Date(p.viewMonth.getFullYear(), p.viewMonth.getMonth() + 1, 1);
  document.getElementById('drpMonthLeft').innerHTML = renderCalendarMonth(p.viewMonth, true);
  document.getElementById('drpMonthRight').innerHTML = renderCalendarMonth(rightMonth, false);
}

function isPresetActive(key, range) {
  if (key === 'all') return !range || (!range.start && !range.end);
  if (!range || !range.start || !range.end) return false;
  var expected = computePresetRange(key);
  if (!expected) return false;
  return startOfDay(range.start).getTime() === startOfDay(expected.start).getTime() &&
    startOfDay(range.end).getTime() === startOfDay(expected.end).getTime();
}

function selectDateRangePreset(key) {
  var p = FMS.dateRangePicker;
  p.pendingRange = computePresetRange(key) || { start: null, end: null };
  if (p.pendingRange.start) p.viewMonth = new Date(p.pendingRange.start.getFullYear(), p.pendingRange.start.getMonth(), 1);
  renderDateRangePicker();
}

function renderCalendarMonth(monthDate, isLeft) {
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dayLabels = ['MO','TU','WE','TH','FR','SA','SU'];
  var year = monthDate.getFullYear(), month = monthDate.getMonth();
  var p = FMS.dateRangePicker;

  var html = '<div class="drp-month-header">';
  if (isLeft) html += '<button type="button" class="drp-nav-btn" onclick="navigateDateRangeMonth(-1)"><span class="material-icons-round">chevron_left</span></button>';
  else html += '<span class="drp-nav-spacer"></span>';
  html += '<span class="drp-month-label">' + monthNames[month] + ' ' + year + '</span>';
  if (!isLeft) html += '<button type="button" class="drp-nav-btn" onclick="navigateDateRangeMonth(1)"><span class="material-icons-round">chevron_right</span></button>';
  else html += '<span class="drp-nav-spacer"></span>';
  html += '</div>';

  html += '<div class="drp-day-labels">' + dayLabels.map(function(d) { return '<span>' + d + '</span>'; }).join('') + '</div>';

  var firstOfMonth = new Date(year, month, 1);
  var startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-first grid
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var daysInPrevMonth = new Date(year, month, 0).getDate();

  var cells = [];
  for (var i = 0; i < startOffset; i++) {
    cells.push({ day: daysInPrevMonth - startOffset + 1 + i, otherMonth: true, date: new Date(year, month - 1, daysInPrevMonth - startOffset + 1 + i) });
  }
  for (var d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, otherMonth: false, date: new Date(year, month, d) });
  }
  while (cells.length % 7 !== 0 || cells.length < 42) {
    var nextDay = cells.length - startOffset - daysInMonth + 1;
    cells.push({ day: nextDay, otherMonth: true, date: new Date(year, month + 1, nextDay) });
  }

  html += '<div class="drp-day-grid">';
  cells.forEach(function(cell) {
    var classes = ['drp-day'];
    if (cell.otherMonth) classes.push('other-month');
    var dayStart = startOfDay(cell.date).getTime();
    var isToday = dayStart === startOfDay(new Date()).getTime();
    if (isToday) classes.push('today');

    var range = p.pendingRange;
    if (range && range.start && range.end) {
      var s = startOfDay(range.start).getTime(), e = startOfDay(range.end).getTime();
      if (dayStart === s) classes.push('range-start');
      if (dayStart === e) classes.push('range-end');
      if (dayStart > s && dayStart < e) classes.push('in-range');
    } else if (range && range.start && !range.end) {
      if (dayStart === startOfDay(range.start).getTime()) classes.push('range-start', 'range-end');
    }

    html += '<button type="button" class="' + classes.join(' ') + '" onclick="pickDateRangeDay(\'' + cell.date.toISOString() + '\')">' + cell.day + '</button>';
  });
  html += '</div>';

  return html;
}

function navigateDateRangeMonth(delta) {
  var p = FMS.dateRangePicker;
  p.viewMonth = new Date(p.viewMonth.getFullYear(), p.viewMonth.getMonth() + delta, 1);
  renderDateRangePicker();
}

function pickDateRangeDay(isoStr) {
  var p = FMS.dateRangePicker;
  var clicked = startOfDay(new Date(isoStr));

  if (!p.pendingRange.start || (p.pendingRange.start && p.pendingRange.end)) {
    // Starting a fresh selection
    p.pendingRange = { start: clicked, end: null };
  } else {
    // Completing the range (ensure start <= end)
    if (clicked.getTime() < p.pendingRange.start.getTime()) {
      p.pendingRange = { start: clicked, end: p.pendingRange.start };
    } else {
      p.pendingRange.end = clicked;
    }
  }
  renderDateRangePicker();
}

/**
 * Short label shown on the column header's date-range trigger button,
 * e.g. "20 Jul - 26 Jul" or "Today" if it matches a preset exactly.
 */
function formatDateRangeLabel(range) {
  if (!range || (!range.start && !range.end)) return '';
  for (var i = 0; i < DATE_RANGE_PRESETS.length; i++) {
    if (DATE_RANGE_PRESETS[i].key !== 'all' && isPresetActive(DATE_RANGE_PRESETS[i].key, range)) {
      return DATE_RANGE_PRESETS[i].label;
    }
  }
  var fmt = function(d) { return d.getDate() + ' ' + FMS_MONTHS[d.getMonth()]; };
  if (range.start && range.end) {
    if (startOfDay(range.start).getTime() === startOfDay(range.end).getTime()) return fmt(range.start);
    return fmt(range.start) + ' - ' + fmt(range.end);
  }
  return fmt(range.start || range.end);
}

// Close the date-range picker on outside click / Escape (mirrors the
// column show/hide panel's behavior)
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && FMS.dateRangePicker && FMS.dateRangePicker.open) closeDateRangePicker();
});

function onSortColumn(colIdx) {
  var t = FMS.table;
  if (t.sortCol === colIdx) {
    t.sortDir = t.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    t.sortCol = colIdx;
    t.sortDir = 'asc';
  }
  renderDataTable(FMS.currentHeader, FMS.currentStep);
}

function onPageSizeChange(value) {
  FMS.table.pageSize = parseInt(value, 10);
  FMS.table.page = 1;
  renderDataTable(FMS.currentHeader, FMS.currentStep);
}

function onPageChange(newPage) {
  FMS.table.page = newPage;
  renderDataTable(FMS.currentHeader, FMS.currentStep);
}

// ===== WORKFLOW: POPUP FORM =====
FMS.uploadedFiles = {}; // fieldName -> [{base64, fileName, mimeType}]
FMS.requiredFileFields = {}; // fieldName -> true, for every FILE-type question in the CURRENT form
FMS.currentFormRow = null;
FMS.currentFormHeader = null;
FMS.currentFormStep = null;

// The form's FIELD STRUCTURE (which fields exist, their Data Type, and
// their Dropdown options) is identical for every row of the same Step -
// only the "Planned" value differs per row. So the structure is cached
// per header+step (like the table cache) and reused instantly on every
// subsequent "Fill" click for that step, instead of re-fetching and
// re-showing "Loading form..." every single time.
FMS.formStructureCache = {}; // "header|||step" -> fields[] (from last successful fetch)

function openStepForm(headerName, stepName, rowNumber) {
  FMS.currentFormRow = rowNumber;
  FMS.currentFormHeader = headerName;
  FMS.currentFormStep = stepName;
  FMS.uploadedFiles = {};

  ensureModalExists();
  var modal = document.getElementById('fmsModal');
  document.getElementById('modalTitle').textContent = stepName;
  document.getElementById('modalMsg').className = 'form-msg';
  document.getElementById('modalMsg').style.display = 'none';
  modal.classList.add('active');

  var cacheKey = headerName + '|||' + stepName;
  var cachedFields = FMS.formStructureCache[cacheKey];

  if (cachedFields) {
    // Instant render from cache - no spinner. Every field is safe to reuse
    // as-is EXCEPT "Planned" (row-specific), which is shown as a quick
    // "Loading..." placeholder until the background fetch confirms the
    // real value for THIS row (usually resolves in well under a second).
    renderStepForm({ success: true, fields: cachedFields }, true);
    fetchStepFormInBackground(headerName, stepName, rowNumber, cacheKey, false);
  } else {
    // First time ever opening this step's form - show the loader once.
    var body = document.getElementById('modalBody');
    if (body) delete body.dataset.formLoadedOnce;
    document.getElementById('modalBody').innerHTML = '<div class="pending-loading">Loading form...</div>';
    fetchStepFormInBackground(headerName, stepName, rowNumber, cacheKey, true);
  }
}

/**
 * Patches only the "Planned" read-only display in-place, without touching
 * any other field the user may already be filling in. Used when the
 * background confirmation fetch resolves after an instant cache-render.
 */
function updatePlannedDisplay(fields) {
  var plannedField = fields.filter(function(f) { return f.type === 'PLANNED_DISPLAY'; })[0];
  if (!plannedField) return;
  var fieldDiv = document.querySelector('.form-field[data-field-name="' + plannedField.name.replace(/"/g, '\\"') + '"]');
  if (!fieldDiv) return;
  var display = fieldDiv.querySelector('.readonly-display');
  if (display) {
    display.innerHTML = '<span class="material-icons-round">event</span>' +
      (plannedField.value ? escapeHtml(plannedField.value) : 'Not set yet');
  }
}

function fetchStepFormInBackground(headerName, stepName, rowNumber, cacheKey, showErrorsInline) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        if (showErrorsInline) {
          document.getElementById('modalBody').innerHTML = '<div class="pending-empty">' + escapeHtml(res.message || 'Could not load form') + '</div>';
        }
        return;
      }
      FMS.formStructureCache[cacheKey] = res.fields;
      // Only touch the modal if the user is still on this exact step+row
      // (they may have closed it or clicked a different row already).
      if (FMS.currentFormHeader === headerName && FMS.currentFormStep === stepName && FMS.currentFormRow === rowNumber) {
        var formBody = document.getElementById('modalBody');
        if (formBody && formBody.dataset.formLoadedOnce) {
          // Form was already rendered from cache and the user may already
          // be typing - only patch the ONE row-specific field ("Planned")
          // in place, instead of re-rendering the whole form and wiping
          // out whatever the user has already entered.
          updatePlannedDisplay(res.fields);
        } else {
          renderStepForm(res, false);
        }
      }
    })
    .withFailureHandler(function(err) {
      if (showErrorsInline) {
        document.getElementById('modalBody').innerHTML = '<div class="pending-empty">' + escapeHtml(err.message) + '</div>';
      }
    })
    .wfGetStepForm(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.dropdownSheet || 'DROPDPWN', headerName, stepName, rowNumber);
}

function renderStepForm(res, isInstantFromCache) {
  var body = document.getElementById('modalBody');
  if (!res.success) {
    body.innerHTML = '<div class="pending-empty">' + escapeHtml(res.message || 'Could not load form') + '</div>';
    return;
  }

  // Recomputed fresh on every render: which FILE-type fields this form has
  // (their Submit-disable state is tracked live in handleFileSelect/removeFile).
  FMS.requiredFileFields = {};

  var html = '';
  res.fields.forEach(function(field, idx) {
    var fid = 'field_' + idx;
    html += '<div class="form-field" data-field-name="' + escapeAttr(field.name) + '">';
    html += '<label>' + escapeHtml(field.name) + '</label>';

    if (field.type === 'PLANNED_DISPLAY') {
      // "Planned" is the ONE field that's genuinely row-specific, so when
      // instantly rendering from cache it must show a neutral placeholder
      // (not the previous row's cached date) until the quick background
      // fetch confirms the real value for this exact row.
      var plannedText = isInstantFromCache ? 'Loading...' : (field.value ? escapeHtml(field.value) : 'Not set yet');
      html += '<div class="readonly-display"><span class="material-icons-round">event</span>' + plannedText + '</div>';
    } else if (field.type.indexOf('DROPDOWN') !== -1 || field.type.indexOf('CHECKBOX') !== -1) {
      html += '<select id="' + fid + '" onchange="onFormFieldChanged(this)"><option value="">-- Select --</option>';
      (field.options || []).forEach(function(opt) {
        html += '<option value="' + escapeAttr(opt) + '">' + escapeHtml(opt) + '</option>';
      });
      html += '</select>';
    } else if (field.type.indexOf('LONG TEXT') !== -1) {
      html += '<textarea id="' + fid + '" oninput="onFormFieldChanged(this)"></textarea>';
    } else if (field.type.indexOf('NUMBER') !== -1) {
      html += '<input type="number" id="' + fid + '" oninput="onFormFieldChanged(this)">';
    } else if (field.type.indexOf('FILE') !== -1) {
      FMS.requiredFileFields[field.name] = true; // tracked so Submit stays disabled until uploaded
      html += '<div class="file-drop" id="' + fid + '_drop" onclick="document.getElementById(\'' + fid + '\').click()">' +
        '<span class="material-icons-round" style="font-size:24px;display:block;margin-bottom:4px;">cloud_upload</span>' +
        '<span class="file-drop-text">Click to upload (multiple files allowed)</span>' +
        '<input type="file" id="' + fid + '" multiple onchange="handleFileSelect(this, \'' + escapeAttr(field.name) + '\')">' +
        '</div>' +
        '<div class="file-list" id="' + fid + '_list"></div>' +
        '<div class="file-required-hint" id="' + fid + '_hint">File upload required before you can submit</div>';
    } else {
      html += '<input type="text" id="' + fid + '" oninput="onFormFieldChanged(this)">';
    }
    html += '</div>';
  });

  body.innerHTML = html || '<div class="pending-empty">No fields to fill for this step.</div>';
  body.dataset.formLoadedOnce = '1';
  updateSubmitButtonState();
  applyAdaptiveFormLayout(res.fields);
}

/**
 * Decides whether this form should use a 2-column layout instead of a
 * single column. Goal: user should NEVER have to scroll the modal to
 * reach Submit. Uses a simple heuristic based on field count/type first
 * (fast, no layout thrash), then double-checks against the ACTUAL
 * rendered height vs. available viewport height and only widens if the
 * single-column version would truly overflow.
 */
function applyAdaptiveFormLayout(fields) {
  var body = document.getElementById('modalBody');
  var modalBox = document.querySelector('.modal-box');
  if (!body || !modalBox) return;

  // Heuristic: long-form fields (textarea, file-drop) take much more
  // vertical room than a single input/select, so weight them higher when
  // deciding if the form is "long" for a single column.
  var weight = 0;
  fields.forEach(function(f) {
    if (f.type === 'PLANNED_DISPLAY') weight += 1;
    else if (f.type && f.type.indexOf('LONG TEXT') !== -1) weight += 2.5;
    else if (f.type && f.type.indexOf('FILE') !== -1) weight += 2.5;
    else weight += 1;
  });

  var shouldTryTwoColumns = weight >= 6; // roughly: more than ~6 simple fields, or fewer with big ones

  if (shouldTryTwoColumns) {
    body.classList.add('form-fields-grid');
    modalBox.classList.add('modal-wide');
    markFullWidthFields();
  } else {
    body.classList.remove('form-fields-grid');
    modalBox.classList.remove('modal-wide');
  }

  // Final safety check: if it STILL overflows the viewport after applying
  // (or without needing) the grid, nudge the modal to use more of the
  // available height so Submit stays reachable without page-level scroll
  // (the modal body itself still scrolls internally as a last resort,
  // but this keeps that from being needed in the vast majority of cases).
  requestAnimationFrameSafe(function() {
    var footer = modalBox.querySelector('.modal-footer:last-child');
    var header = modalBox.querySelector('.modal-header');
    var available = window.innerHeight * 0.88 - (header ? header.offsetHeight : 60) - (footer ? footer.offsetHeight * 2 : 100);
    if (body.scrollHeight > available && !shouldTryTwoColumns) {
      // Single column still doesn't fit - switch to 2 columns as a fallback
      body.classList.add('form-fields-grid');
      modalBox.classList.add('modal-wide');
      markFullWidthFields();
    }
  });
}

function requestAnimationFrameSafe(fn) {
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(fn);
  else setTimeout(fn, 0);
}

// Long Text / File-upload fields always span both columns in the 2-column
// grid (they need the extra horizontal room and don't pair well side by
// side with a short field).
function markFullWidthFields() {
  var fieldDivs = document.querySelectorAll('#modalBody .form-field');
  fieldDivs.forEach(function(div) {
    var hasTextarea = div.querySelector('textarea');
    var hasFileDrop = div.querySelector('.file-drop');
    if (hasTextarea || hasFileDrop) {
      div.classList.add('field-span-2');
    } else {
      div.classList.remove('field-span-2');
    }
  });
}

/**
 * If this Step's form has any FILE-type question, the Submit button stays
 * disabled until EVERY required file field has at least one uploaded
 * file. Steps with no file question are unaffected (button always enabled
 * once the form is loaded).
 */
function updateSubmitButtonState() {
  var submitBtn = document.getElementById('modalSubmitBtn');
  if (!submitBtn) return;

  var requiredNames = Object.keys(FMS.requiredFileFields || {});
  var allUploaded = requiredNames.every(function(name) {
    return FMS.uploadedFiles[name] && FMS.uploadedFiles[name].length > 0;
  });

  submitBtn.disabled = !allUploaded;
  submitBtn.classList.toggle('btn-disabled-upload', !allUploaded);

  // Show/hide the "File upload required" hint under each pending file field
  // + mark/unmark the field as "filled" (colored label) alongside every
  // other answered question in the form.
  requiredNames.forEach(function(name) {
    var uploaded = FMS.uploadedFiles[name] && FMS.uploadedFiles[name].length > 0;
    var fieldDiv = document.querySelector('.form-field[data-field-name="' + name.replace(/"/g, '\\"') + '"]');
    if (!fieldDiv) return;
    var hint = fieldDiv.querySelector('.file-required-hint');
    var drop = fieldDiv.querySelector('.file-drop');
    if (hint) hint.style.display = uploaded ? 'none' : 'block';
    if (drop) drop.classList.toggle('file-drop-done', uploaded);
    fieldDiv.classList.toggle('field-filled', uploaded);
  });
}

/**
 * Marks a question's label with the "answered" color (via .field-filled
 * on its wrapping .form-field) as soon as the user types/selects a value,
 * and un-marks it if they clear it back out - applies to every question
 * type except Planned (never editable) and File-upload (handled inside
 * updateSubmitButtonState() instead, since it isn't a simple input value).
 */
function onFormFieldChanged(inputEl) {
  var fieldDiv = inputEl.closest('.form-field');
  if (!fieldDiv) return;
  var hasValue = String(inputEl.value || '').trim() !== '';
  fieldDiv.classList.toggle('field-filled', hasValue);
}

function handleFileSelect(input, fieldName) {
  var files = Array.prototype.slice.call(input.files);
  if (!FMS.uploadedFiles[fieldName]) FMS.uploadedFiles[fieldName] = [];

  // Keep Submit disabled while files are still being read/encoded, even if
  // this field already had a previous upload - only flip back to enabled
  // once every selected file has finished reading (see the counter below).
  updateSubmitButtonState();

  var pendingReads = files.length;
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      FMS.uploadedFiles[fieldName].push({ base64: base64, fileName: file.name, mimeType: file.type || 'application/octet-stream' });
      renderFileList(fieldName);
      pendingReads--;
      if (pendingReads === 0) updateSubmitButtonState();
    };
    reader.onerror = function() {
      pendingReads--;
      if (pendingReads === 0) updateSubmitButtonState();
    };
    reader.readAsDataURL(file);
  });
}

function renderFileList(fieldName) {
  var fieldDiv = document.querySelector('.form-field[data-field-name="' + fieldName.replace(/"/g, '\\"') + '"]');
  if (!fieldDiv) return;
  var listDiv = fieldDiv.querySelector('.file-list');
  if (!listDiv) return;

  var files = FMS.uploadedFiles[fieldName] || [];
  listDiv.innerHTML = files.map(function(f, i) {
    return '<div class="file-chip"><span>' + escapeHtml(f.fileName) + '</span>' +
      '<span class="remove-file material-icons-round" onclick="removeFile(\'' + escapeAttr(fieldName) + '\',' + i + ')">close</span></div>';
  }).join('');
}

function removeFile(fieldName, index) {
  if (FMS.uploadedFiles[fieldName]) {
    FMS.uploadedFiles[fieldName].splice(index, 1);
    renderFileList(fieldName);
    updateSubmitButtonState(); // re-disable Submit if this was the only file for a required field
  }
}

function submitStepForm() {
  var body = document.getElementById('modalBody');
  var formValues = {};

  var fieldDivs = body.querySelectorAll('.form-field');
  fieldDivs.forEach(function(div, idx) {
    var name = div.getAttribute('data-field-name');
    var input = div.querySelector('input[type="text"], input[type="number"], textarea, select');
    if (input) formValues[name] = input.value;
  });

  var submitBtn = document.getElementById('modalSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving...';

  google.script.run
    .withSuccessHandler(function(res) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
      var msg = document.getElementById('modalMsg');
      if (res.success) {
        msg.className = 'form-msg success';
        msg.textContent = res.message;
        msg.style.display = 'block';
        setTimeout(function() {
          closeModal();
          // IMPORTANT: do NOT delete the table cache here. loadStepTable()
          // already renders instantly from the existing cache (so the
          // header row + pagination bar NEVER disappear/flash) and then
          // silently re-fetches fresh rows in the background - the exact
          // same "instant + silent refresh" pattern used everywhere else.
          // Force-clearing the cache used to make every single submit
          // show a full-page loader that wiped out the header+pagination.
          loadStepTable(FMS.currentHeader, FMS.currentStep);
        }, 1000);
      } else {
        msg.className = 'form-msg error';
        msg.textContent = res.message;
        msg.style.display = 'block';
      }
    })
    .withFailureHandler(function(err) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
      var msg = document.getElementById('modalMsg');
      msg.className = 'form-msg error';
      msg.textContent = 'Error: ' + err.message;
      msg.style.display = 'block';
    })
    .wfSubmitStep(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet,
      FMS.currentHeader, FMS.currentStep, FMS.currentFormRow, formValues, FMS.uploadedFiles, FMS_SESSION.userName);
}

function ensureModalExists() {
  if (document.getElementById('fmsModal')) return;

  var modalHtml =
    '<div class="modal-overlay" id="fmsModal">' +
    '<div class="modal-box">' +
    '<div class="modal-header"><h3 id="modalTitle">Step Form</h3>' +
    '<button class="icon-btn" onclick="closeModal()"><span class="material-icons-round">close</span></button></div>' +
    '<div class="modal-body" id="modalBody"></div>' +
    '<div class="modal-footer">' +
    '<div class="form-msg" id="modalMsg" style="width:100%; margin: 0 0 10px 0; display:none;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="modalSubmitBtn" onclick="submitStepForm()">Submit</button>' +
    '</div>' +
    '</div>' +
    '</div>';

  document.body.insertAdjacentHTML('beforeend', modalHtml);

  document.getElementById('fmsModal').addEventListener('click', function(e) {
    if (e.target.id === 'fmsModal') closeModal();
  });
}

function closeModal() {
  var modal = document.getElementById('fmsModal');
  if (modal) modal.classList.remove('active');
}

// ===== LOAD PERMISSIONS (sidebar headers/steps - remembered across refreshes) =====
function loadPermissions() {
  if (typeof FMS_SESSION === 'undefined') return;
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        FMS.permissionsCache = res.permissions;
        renderSidebar(res.permissions);
        setLastUpdatedNow(false);
      } else {
        document.getElementById('sidebarNav').innerHTML = 
          '<div style="padding:20px; color:var(--danger); font-size:12px; text-align:center;">' + 
          (res.message || 'No permissions found') + '</div>';
      }
    })
    .withFailureHandler(function(err) {
      document.getElementById('sidebarNav').innerHTML = 
        '<div style="padding:20px; color:var(--danger); font-size:12px; text-align:center;">Error: ' + err.message + '</div>';
    })
    .getUserPermissions(FMS_SESSION.userName);
}

// ===== UTILITY =====
/**
 * Derives 1-2 letter initials from a user's name for the topbar avatar
 * chip, e.g. "ANKUR" -> "AN", "ANKUR SHARMA" -> "AS".
 */
function getInitials(name) {
  var trimmed = String(name || '').trim();
  if (!trimmed) return '?';
  var parts = trimmed.split(/\s+/);
  if (parts.length >= 2) {
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  return trimmed.substring(0, 2).toUpperCase();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
}

// ===== EVENT LISTENERS =====
document.addEventListener('click', function(e) {
  if (FMS.sidebarOpen) {
    var sidebar = document.getElementById('sidebar');
    var menuBtn = document.querySelector('.icon-btn');
    if (sidebar && !sidebar.contains(e.target) && menuBtn && !menuBtn.contains(e.target)) {
      closeSidebar();
    }
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSidebar();
});
