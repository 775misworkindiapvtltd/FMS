  var parts = value.split(/,\s*/);
  var safeParts = parts.map(function(part) { return safeHttpUrl(part); });
  if (parts.length > 1 && safeParts.every(function(part) { return !!part; })) {
    return safeParts.map(function(part, index) { return 'Click Here ' + (index + 1); }).join(', ');
  }
  return value;
}

function measureAutoFitColumn(key) {
  var t = FMS.table;
  var bounds = columnWidthBounds(key);
  var width;

  if (key === '__serial') {
    var maxSerial = Math.max(1, (t.rows || []).length);
    width = Math.max(measureAutoFitText('S.No', true, 10.5) + 24, measureAutoFitText(String(maxSerial), false, 11.5) + 22);
  } else if (key === '__action') {
    var label = FMS.viewMode === 'table' ? 'Steps' : 'Action';
    width = measureAutoFitText(label, true, 10.5) + 28;
    if (FMS.viewMode === 'table') {
      width = Math.max(width, compactStepsColumnWidth());
    } else {
      width = Math.max(width, measureAutoFitText('Fill Step', true, 10) + 34);
    }
  } else {
    var index = parseInt(key, 10);
    var heading = t.columns[index] || '';
    // Header needs room for its filter icon, spacing and the visible grip.
    width = measureAutoFitText(heading, true, 10.5) + 48;
    (t.rows || []).forEach(function(row) {
      var rawCellText = row && row.cells ? String(row.cells[index] == null ? '' : row.cells[index]).trim() : '';
      var cellText = autoFitDisplayText(rawCellText);
      var renderedAsLink = cellText !== rawCellText;
      width = Math.max(width, measureAutoFitText(cellText, renderedAsLink, 11.5) + 24);
    });
  }

  return Math.ceil(Math.max(bounds.min, Math.min(bounds.max, width)));
}

function autoFitColumn(key, e) {
  if (e) {
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();
  }
  FMS.table.colWidths[key] = measureAutoFitColumn(key);
  FMS.table.hasSavedColPrefs = true;
  persistColumnPrefs();
  rerenderCurrentTable();
}

function autoFitAllColumns(e) {
  if (e) {
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();
  }
  var t = FMS.table;
  t.colWidths.__serial = measureAutoFitColumn('__serial');
  t.columns.forEach(function(column, index) {
    t.colWidths[index] = measureAutoFitColumn(index);
  });
  t.colWidths.__action = measureAutoFitColumn('__action');
  t.hasSavedColPrefs = true;
  t.columnPanelOpen = true;
  persistColumnPrefs();
  rerenderCurrentTable();
}

function onColumnResizeKeydown(e, key) {
  if (e.key === 'Enter' || e.key === ' ') {
    autoFitColumn(key, e);
    return;
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  e.stopPropagation();
  var direction = e.key === 'ArrowLeft' ? -1 : 1;
  if (key === '__action') direction *= -1;
  var bounds = columnWidthBounds(key);
  var nextWidth = getConfiguredColumnWidth(FMS.table, key) + (direction * 8);
  FMS.table.colWidths[key] = Math.max(bounds.min, Math.min(bounds.max, nextWidth));
  FMS.table.hasSavedColPrefs = true;
  persistColumnPrefs();
  rerenderCurrentTable();
}

function resetColumnWidth(key) {
  delete FMS.table.colWidths[key];
  FMS.table.hasSavedColPrefs = true;
  FMS.table.columnPanelOpen = true;
  persistColumnPrefs();
  rerenderCurrentTable();
}

function resetAllColumnWidths() {
  FMS.table.colWidths = {};
  FMS.table.hasSavedColPrefs = true;
  FMS.table.columnPanelOpen = true;
  persistColumnPrefs();
  rerenderCurrentTable();
}

function persistColumnPrefs() {
  if (!FMS.table.cacheKey) return;
  var prefs = getColumnPrefs(FMS.table.cacheKey);
  prefs.colWidths = FMS.table.colWidths;
  prefs.hiddenCols = FMS.table.hiddenCols;
  prefs.hasSavedPrefs = FMS.table.hasSavedColPrefs;
  fmsStoreSet(COLUMN_PREFS_STORAGE_KEY, JSON.stringify(FMS.columnPrefs));
}

// Close the column panel when clicking anywhere outside it
document.addEventListener('click', function(e) {
  if (FMS.table && FMS.table.columnPanelOpen) {
    var panel = document.getElementById('columnPanel');
    var toggleBtn = e.target.closest ? e.target.closest('.column-toggle-wrap') : null;
    if (panel && !panel.contains(e.target) && !toggleBtn) {
      FMS.table.columnPanelOpen = false;
      if (document.getElementById('tableContainer')) {
        rerenderCurrentTable();
      }
    }
  }
});

// ===== COLUMN RESIZE (drag the handle on the right edge of a <th>) =====
var colResizeState = null;

function resizeClientX(e) {
  if (e.touches && e.touches.length) return e.touches[0].clientX;
  if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
  return e.clientX;
}

function startColResize(e, idx) {
  if (e.cancelable) e.preventDefault();
  e.stopPropagation();
  var th = e.target.closest('th');
  // The <colgroup> entry is what actually controls width under
  // table-layout:fixed, so drag updates that element (not just the <th>).
  var col = document.querySelector('#fmsDataTable colgroup col[data-col="' + idx + '"]');
  colResizeState = {
    idx: idx,
    startX: resizeClientX(e),
    startWidth: th.offsetWidth,
    th: th,
    col: col,
    direction: idx === '__action' ? -1 : 1
  };
  document.body.classList.add('column-resizing');
  document.addEventListener('mousemove', onColResizeMove);
  document.addEventListener('mouseup', onColResizeEnd);
  document.addEventListener('touchmove', onColResizeMove, { passive: false });
  document.addEventListener('touchend', onColResizeEnd);
  document.addEventListener('touchcancel', onColResizeEnd);
}

function onColResizeMove(e) {
  if (!colResizeState) return;
  if (e.cancelable) e.preventDefault();
  var bounds = columnWidthBounds(colResizeState.idx);
  var delta = (resizeClientX(e) - colResizeState.startX) * colResizeState.direction;
  var newWidth = Math.max(bounds.min, Math.min(bounds.max, colResizeState.startWidth + delta));
  if (colResizeState.col) colResizeState.col.style.width = newWidth + 'px';
  colResizeState.th.style.width = newWidth + 'px';
  colResizeState.th.style.minWidth = newWidth + 'px';
  colResizeState.th.style.maxWidth = newWidth + 'px';
  colResizeState.liveWidth = newWidth;
}

function onColResizeEnd() {
  if (!colResizeState) return;
  if (colResizeState.liveWidth) {
    FMS.table.colWidths[colResizeState.idx] = colResizeState.liveWidth;
    FMS.table.hasSavedColPrefs = true;
    persistColumnPrefs();
  }
  document.body.classList.remove('column-resizing');
  document.removeEventListener('mousemove', onColResizeMove);
  document.removeEventListener('mouseup', onColResizeEnd);
  document.removeEventListener('touchmove', onColResizeMove);
  document.removeEventListener('touchend', onColResizeEnd);
  document.removeEventListener('touchcancel', onColResizeEnd);
  colResizeState = null;
}

function statusTabHtml(key, label, count, active) {
  return '<button class="status-tab' + (active === key ? ' active' : '') + '" onclick="onStatusFilter(\'' + key + '\')">' +
    label + ' <span class="status-tab-count">' + count + '</span></button>';
}

function onStatusFilter(status) {
  FMS.table.filterStatus = status;
  FMS.table.page = 1;
  rerenderCurrentTable();
}

function onGlobalSearch(value) {
  FMS.table.globalSearch = value;
  FMS.table.page = 1;
  rerenderCurrentTable();
  // restore focus after re-render
  var el = document.getElementById('tableGlobalSearch');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function onColumnSearch(colIdx, value) {
  FMS.table.colSearch[colIdx] = value;
  FMS.table.page = 1;
  rerenderCurrentTable();
  // NOTE: no refocus-the-input logic needed here anymore - the text/date
  // filter popovers now live at the document.body level (see
  // ensureTextFilterPopoverExists()/ensureDateRangePickerExists()), so
  // re-rendering the table's innerHTML never touches or unmounts them;
  // their input never loses focus in the first place.
}

/**
 * Resets every active filter back to the page's original defaults:
 * clears the global search box, every per-column filter (text search AND
 * date ranges), any active sort, jumps back to page 1, and switches the
 * status tab back to "Pending" (the tab shown when a step is first
 * opened). Column visibility/width preferences are NOT touched - those
 * aren't filters, they're a display preference.
 */
function resetAllFilters() {
  var t = FMS.table;
  t.globalSearch = '';
  t.colSearch = {};
  t.sortCol = null;
  t.sortDir = 'asc';
  t.filterStatus = 'pending';
  t.page = 1;
  closeColumnTextFilter();
  closeDateRangePicker();
  rerenderCurrentTable();
}

  e.stopPropagation();

function onTextFilterInput(value) {

function clearColumnTextFilter() {

document.addEventListener('keydown', function(e) {

// ================================================================
// DATE-RANGE PICKER (dual calendar + presets, matches MerTraCode UI)
// ================================================================
FMS.dateRangePicker = {
  open: false,
  colIdx: null,
  viewMonth: null,      // Date - first of the LEFT calendar's visible month (right = +1 month)
  selecting: null,       // 'start' | null - which end of the range the next click sets
  pendingRange: null     // { start: Date|null, end: Date|null } - working copy until Apply
};

var DATE_RANGE_PRESETS = [
  { key: 'today', label: 'Today' },
  { key: 'yesterday', label: 'Yesterday' },
  { key: 'thisWeek', label: 'This Week' },
  { key: 'lastWeek', label: 'Last Week' },
  { key: 'last7', label: 'Last 7 Days' },
  { key: 'last30', label: 'Last 30 Days' },
  { key: 'thisMonth', label: 'This Month' },
  { key: 'lastMonth', label: 'Last Month' },
  { key: 'all', label: 'All' }
];

function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function computePresetRange(key) {
  var today = startOfDay(new Date());
  switch (key) {
    case 'today': return { start: today, end: today };
    case 'yesterday': { var y = new Date(today); y.setDate(y.getDate() - 1); return { start: y, end: y }; }
    case 'thisWeek': { var s = new Date(today); s.setDate(today.getDate() - today.getDay()); return { start: s, end: today }; }
    case 'lastWeek': { var e = new Date(today); e.setDate(today.getDate() - today.getDay() - 1); var s2 = new Date(e); s2.setDate(e.getDate() - 6); return { start: s2, end: e }; }
    case 'last7': { var s3 = new Date(today); s3.setDate(today.getDate() - 6); return { start: s3, end: today }; }
    case 'last30': { var s4 = new Date(today); s4.setDate(today.getDate() - 29); return { start: s4, end: today }; }
    case 'thisMonth': return { start: new Date(today.getFullYear(), today.getMonth(), 1), end: today };
    case 'lastMonth': { var lm = new Date(today.getFullYear(), today.getMonth() - 1, 1); var lmEnd = new Date(today.getFullYear(), today.getMonth(), 0); return { start: lm, end: lmEnd }; }
    case 'all': return null; // no filter
    default: return null;
  }
}

function ensureDateRangePickerExists() {
  if (document.getElementById('fmsDateRangePicker')) return;
  var html =
    '<div class="date-range-overlay" id="fmsDateRangeOverlay" onclick="closeDateRangePicker()"></div>' +
    '<div class="date-range-picker" id="fmsDateRangePicker">' +
      '<div class="drp-presets" id="drpPresets"></div>' +
      '<div class="drp-calendars">' +
        '<div class="drp-calendars-row">' +
          '<div class="drp-month" id="drpMonthLeft"></div>' +
          '<div class="drp-month" id="drpMonthRight"></div>' +
        '</div>' +
        '<div class="drp-footer">' +
          '<button type="button" class="btn btn-secondary" onclick="closeDateRangePicker()">Cancel</button>' +
          '<button type="button" class="btn btn-primary" onclick="applyDateRangePicker()">Apply</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('fmsDateRangePicker').addEventListener('click', function(e) { e.stopPropagation(); });
}

function openDateRangePicker(e, colIdx) {
  e.stopPropagation();
  ensureDateRangePickerExists();
  var p = FMS.dateRangePicker;
  p.open = true;
  p.colIdx = colIdx;
  var existing = FMS.table.colSearch[colIdx];
  p.pendingRange = existing ? { start: existing.start, end: existing.end } : { start: null, end: null };
  p.selecting = null;
  var anchor = p.pendingRange.start || p.pendingRange.end || new Date();
  p.viewMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);

  var picker = document.getElementById('fmsDateRangePicker');
  var overlay = document.getElementById('fmsDateRangeOverlay');
  overlay.classList.add('active');
  picker.classList.add('open');

  // Position the picker near the trigger button that was clicked
  var btn = e.target.closest ? e.target.closest('.col-filter-btn') : null;
  if (btn && btn.getBoundingClientRect) {
    var rect = btn.getBoundingClientRect();
    picker.style.top = (rect.bottom + 6) + 'px';
    picker.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 660)) + 'px';
  }

  renderDateRangePicker();
}

function closeDateRangePicker() {
  var picker = document.getElementById('fmsDateRangePicker');
  var overlay = document.getElementById('fmsDateRangeOverlay');
  if (picker) picker.classList.remove('open');
  if (overlay) overlay.classList.remove('active');
  FMS.dateRangePicker.open = false;
}

function applyDateRangePicker() {
  var p = FMS.dateRangePicker;
  var range = p.pendingRange;
  onColumnSearch(p.colIdx, (range && (range.start || range.end)) ? range : null);
  closeDateRangePicker();
}

function renderDateRangePicker() {
  var p = FMS.dateRangePicker;
  if (!p.viewMonth) p.viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); // defensive fallback

  // Presets sidebar
  var presetsHtml = DATE_RANGE_PRESETS.map(function(preset) {
    var isActive = isPresetActive(preset.key, p.pendingRange);
    return '<button type="button" class="drp-preset-btn' + (isActive ? ' active' : '') + '" onclick="selectDateRangePreset(\'' + preset.key + '\')">' + preset.label + '</button>';
  }).join('');
  document.getElementById('drpPresets').innerHTML = presetsHtml;

  // Two month calendars: left = viewMonth, right = viewMonth+1
  var rightMonth = new Date(p.viewMonth.getFullYear(), p.viewMonth.getMonth() + 1, 1);
  document.getElementById('drpMonthLeft').innerHTML = renderCalendarMonth(p.viewMonth, true);
  document.getElementById('drpMonthRight').innerHTML = renderCalendarMonth(rightMonth, false);
}

function isPresetActive(key, range) {
  if (key === 'all') return !range || (!range.start && !range.end);
  if (!range || !range.start || !range.end) return false;
  var expected = computePresetRange(key);
  if (!expected) return false;
  return startOfDay(range.start).getTime() === startOfDay(expected.start).getTime() &&
    startOfDay(range.end).getTime() === startOfDay(expected.end).getTime();
}

function selectDateRangePreset(key) {
  var p = FMS.dateRangePicker;
  p.pendingRange = computePresetRange(key) || { start: null, end: null };
  if (p.pendingRange.start) p.viewMonth = new Date(p.pendingRange.start.getFullYear(), p.pendingRange.start.getMonth(), 1);
  renderDateRangePicker();
}

function renderCalendarMonth(monthDate, isLeft) {
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dayLabels = ['MO','TU','WE','TH','FR','SA','SU'];
  var year = monthDate.getFullYear(), month = monthDate.getMonth();
  var p = FMS.dateRangePicker;

  var html = '<div class="drp-month-header">';
  if (isLeft) html += '<button type="button" class="drp-nav-btn" onclick="navigateDateRangeMonth(-1)"><span class="material-icons-round">chevron_left</span></button>';
  else html += '<span class="drp-nav-spacer"></span>';
  html += '<span class="drp-month-label">' + monthNames[month] + ' ' + year + '</span>';
  if (!isLeft) html += '<button type="button" class="drp-nav-btn" onclick="navigateDateRangeMonth(1)"><span class="material-icons-round">chevron_right</span></button>';
  else html += '<span class="drp-nav-spacer"></span>';
  html += '</div>';

  html += '<div class="drp-day-labels">' + dayLabels.map(function(d) { return '<span>' + d + '</span>'; }).join('') + '</div>';

  var firstOfMonth = new Date(year, month, 1);
  var startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-first grid
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var daysInPrevMonth = new Date(year, month, 0).getDate();

  var cells = [];
  for (var i = 0; i < startOffset; i++) {
    cells.push({ day: daysInPrevMonth - startOffset + 1 + i, otherMonth: true, date: new Date(year, month - 1, daysInPrevMonth - startOffset + 1 + i) });
  }
  for (var d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, otherMonth: false, date: new Date(year, month, d) });
  }
  while (cells.length % 7 !== 0 || cells.length < 42) {
    var nextDay = cells.length - startOffset - daysInMonth + 1;
    cells.push({ day: nextDay, otherMonth: true, date: new Date(year, month + 1, nextDay) });
  }

  html += '<div class="drp-day-grid">';
  cells.forEach(function(cell) {
    var classes = ['drp-day'];
    if (cell.otherMonth) classes.push('other-month');
    var dayStart = startOfDay(cell.date).getTime();
    var isToday = dayStart === startOfDay(new Date()).getTime();
    if (isToday) classes.push('today');

    var range = p.pendingRange;
    if (range && range.start && range.end) {
      var s = startOfDay(range.start).getTime(), e = startOfDay(range.end).getTime();
      if (dayStart === s) classes.push('range-start');
      if (dayStart === e) classes.push('range-end');
      if (dayStart > s && dayStart < e) classes.push('in-range');
    } else if (range && range.start && !range.end) {
      if (dayStart === startOfDay(range.start).getTime()) classes.push('range-start', 'range-end');
    }

    html += '<button type="button" class="' + classes.join(' ') + '" onclick="pickDateRangeDay(\'' + cell.date.toISOString() + '\')">' + cell.day + '</button>';
  });
  html += '</div>';

  return html;
}

function navigateDateRangeMonth(delta) {
  var p = FMS.dateRangePicker;
  p.viewMonth = new Date(p.viewMonth.getFullYear(), p.viewMonth.getMonth() + delta, 1);
  renderDateRangePicker();
}

function pickDateRangeDay(isoStr) {
  var p = FMS.dateRangePicker;
  var clicked = startOfDay(new Date(isoStr));

  if (!p.pendingRange.start || (p.pendingRange.start && p.pendingRange.end)) {
    // Starting a fresh selection
    p.pendingRange = { start: clicked, end: null };
  } else {
    // Completing the range (ensure start <= end)
    if (clicked.getTime() < p.pendingRange.start.getTime()) {
      p.pendingRange = { start: clicked, end: p.pendingRange.start };
    } else {
      p.pendingRange.end = clicked;
    }
  }
  renderDateRangePicker();
}

/**
 * Short label shown on the column header's date-range trigger button,
 * e.g. "20 Jul - 26 Jul" or "Today" if it matches a preset exactly.
 */
function formatDateRangeLabel(range) {
  if (!range || (!range.start && !range.end)) return '';
  for (var i = 0; i < DATE_RANGE_PRESETS.length; i++) {
    if (DATE_RANGE_PRESETS[i].key !== 'all' && isPresetActive(DATE_RANGE_PRESETS[i].key, range)) {
      return DATE_RANGE_PRESETS[i].label;
    }
  }
  var fmt = function(d) { return d.getDate() + ' ' + FMS_MONTHS[d.getMonth()]; };
  if (range.start && range.end) {
    if (startOfDay(range.start).getTime() === startOfDay(range.end).getTime()) return fmt(range.start);
    return fmt(range.start) + ' - ' + fmt(range.end);
  }
  return fmt(range.start || range.end);
}

// Close the date-range picker on outside click / Escape (mirrors the
// column show/hide panel's behavior)
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && FMS.dateRangePicker && FMS.dateRangePicker.open) closeDateRangePicker();
});

function onSortColumn(colIdx) {
  var t = FMS.table;
  if (t.sortCol === colIdx) {
    t.sortDir = t.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    t.sortCol = colIdx;
    t.sortDir = 'asc';
  }
  rerenderCurrentTable();
}

function onPageSizeChange(value) {
  FMS.table.pageSize = parseInt(value, 10);
  FMS.table.page = 1;
  rerenderCurrentTable();
}

function onPageChange(newPage) {
  FMS.table.page = newPage;
  rerenderCurrentTable();
}

// ===== WORKFLOW: POPUP FORM =====
FMS.uploadedFiles = {}; // fieldName -> [{base64, fileName, mimeType}]
FMS.requiredFileFields = {}; // fieldName -> true, for every FILE-type question in the CURRENT form
FMS.currentFormRow = null;
FMS.currentFormHeader = null;
FMS.currentFormStep = null;
FMS.currentFormSchemaVersion = '';
FMS.currentFormGeneration = 0;
FMS.formDirty = false;
FMS.formSchemaOutdated = false;

// The field schema/options are identical for every row of a Step. Cache
// them in memory AND localStorage so the modal opens instantly even after
// a browser reload. Row-specific Planned/order details come from the table
// row already on screen and are refreshed silently in the background.
FMS.formStructureCache = FMS.formStructureCache || {}; // key -> {fields, version, fetchedAt}
FMS.formFetchInFlight = {};
FMS.formFetchLatest = {};
FMS.formFetchSequence = 0;

function formSchemaSignature(fields) {
  return JSON.stringify((fields || []).map(function(field) {
    return { name: field.name, type: field.type, options: field.options || [] };
  }));
}

function getFormCacheEntry(cacheKey) {
  var entry = FMS.formStructureCache[cacheKey];
  if (!entry) return null;
  // Backward compatibility with the old fields[]-only memory cache. It can
  // render immediately, but without a server version it is never treated as
  // fresh or allowed to submit until the background confirmation returns.
  if (Array.isArray(entry)) entry = { fields: entry, version: '', fetchedAt: 0 };
  return entry && Array.isArray(entry.fields) ? entry : null;
}

function isFormCacheFresh(entry) {
  return !!(entry && entry.version && entry.fetchedAt && (Date.now() - entry.fetchedAt < FORM_SCHEMA_CACHE_MS));
}

function basicContextFields(fields) {
  var source = (fields || []).filter(function(item) {
    return item && String(item.value == null ? '' : item.value).trim() !== '';
  });
  var priority = /(^|\s)(order|po|invoice|customer|party|vendor|style|item|sku|qty|quantity|amount|code|name|date|id)(\s|$)/i;
  var preferred = source.filter(function(item) { return priority.test(String(item.name || '')); });
  var others = source.filter(function(item) { return !priority.test(String(item.name || '')); });
  return preferred.concat(others).slice(0, 8);
}

function getOrderContextDetail(context) {
  var details = basicContextFields(context);
  var exact = /^(order|purchase order|po)(\s*(id|no|number|#))?$/i;
  for (var i = 0; i < details.length; i++) {
    var name = String(details[i].name || '').trim().replace(/[._-]+/g, ' ');
    if (exact.test(name)) return details[i];
  }
  for (var j = 0; j < details.length; j++) {
    var fallbackName = String(details[j].name || '');
    if (/order/i.test(fallbackName) && /(id|no|number|#)/i.test(fallbackName)) return details[j];
  }
  return null;
}

function formIdentitySubtitle(headerName, context, rowNumber) {
  var orderDetail = getOrderContextDetail(context);
  var parts = [];
  if (orderDetail) {
    parts.push(String(orderDetail.name || 'Order No') + ': ' + String(orderDetail.value || ''));
  }
  if (headerName) parts.push(String(headerName));
  parts.push('Record #' + String(rowNumber || ''));
  return parts.join('  •  ');
}

function updateModalIdentity(headerName, stepName, rowNumber, context) {
  var title = document.getElementById('modalTitle');
  var subtitle = document.getElementById('modalSubtitle');
  if (title) title.textContent = stepName || 'Step Form';
  if (subtitle) {
    var identity = formIdentitySubtitle(headerName, context || [], rowNumber);
    subtitle.textContent = identity;
    subtitle.title = identity;
  }
}

function snapshotFromTableEntry(entry, rowNumber, baseColCount, plannedStart, plannedEnd) {
  var row = findCachedRowByNumber(entry, rowNumber);
  if (!entry || !row || !entry.columns || !row.cells) return null;
  var count = Math.max(0, Math.min(baseColCount || 0, entry.columns.length));
  var context = [];
  for (var i = 0; i < count; i++) {
    if (String(row.cells[i] == null ? '' : row.cells[i]).trim() !== '') {
      context.push({ name: entry.columns[i], value: row.cells[i] });
    }
  }

  var start = plannedStart == null ? count : plannedStart;
  var end = plannedEnd == null ? entry.columns.length - 1 : plannedEnd;
  var planned = '';
  for (var p = start; p <= end && p < entry.columns.length; p++) {
    if (String(entry.columns[p]).toLowerCase().indexOf('planned') !== -1) {
      planned = row.cells[p] || '';
      break;
    }
  }
  return { context: basicContextFields(context), planned: planned };
}

function getCachedFormSnapshot(headerName, stepName, rowNumber) {
  var stepEntry = FMS.tableCache[headerName + '|||' + stepName];
  if (stepEntry) {
    var stepSnapshot = snapshotFromTableEntry(
      stepEntry,
      rowNumber,
      stepEntry.baseColCount || 0,
      stepEntry.baseColCount || 0,
      stepEntry.columns ? stepEntry.columns.length - 1 : 0
    );
    if (stepSnapshot) return stepSnapshot;
  }

  var multiEntry = FMS.multiTableCache[headerName];
  if (multiEntry) {
    var stepMeta = null;
    (multiEntry.steps || []).forEach(function(meta) {
      if (String(meta.step).trim().toUpperCase() === String(stepName).trim().toUpperCase()) stepMeta = meta;
    });
    var multiSnapshot = snapshotFromTableEntry(
      multiEntry,
      rowNumber,
      multiEntry.baseColCount || 0,
      stepMeta ? stepMeta.colIdxStart : null,
      stepMeta ? stepMeta.colIdxEnd : null
    );
    if (multiSnapshot) return multiSnapshot;
  }
  return { context: [], planned: '' };
}

function formStructureFields(fields) {
  return (fields || []).map(function(field) {
    var clone = {};
    for (var key in field) clone[key] = field[key];
    // Planned is row-specific and must never be persisted as reusable schema.
    if (clone.type === 'PLANNED_DISPLAY') clone.value = '';
    return clone;
  });
}

function fieldsWithSnapshot(fields, snapshot) {
  return formStructureFields(fields).map(function(field) {
    if (field.type === 'PLANNED_DISPLAY') {
      field.value = snapshot ? String(snapshot.planned || '') : '';
    }
    return field;
  });
}

function renderFormContextHtml(context, rowNumber) {
  var details = basicContextFields(context);
  var html = '<section class="form-context-card"><div class="form-section-heading">' +
    '<div><span class="material-icons-round">receipt_long</span><strong>Order details</strong></div>' +
    '<span class="form-record-row">Record #' + escapeHtml(String(rowNumber || '')) + '</span></div>';
  if (!details.length) {
    html += '<div class="form-context-empty">Basic record details are syncing in the background.</div>';
  } else {
    html += '<div class="form-context-grid">';
    details.forEach(function(detail) {
      html += '<div class="form-context-item"><span>' + escapeHtml(String(detail.name || 'Detail')) + '</span>' +
        '<strong title="' + escapeHtmlAttr(String(detail.value == null ? '' : detail.value)) + '">' + renderCellValue(detail.value) + '</strong></div>';
    });
    html += '</div>';
  }
  return html + '</section>';
}

function renderFormLoadingShell(snapshot, rowNumber) {
  var body = document.getElementById('modalBody');
  body.innerHTML = renderFormContextHtml(snapshot.context, rowNumber) +
    '<section class="form-entry-card"><div class="form-section-heading"><div><span class="material-icons-round">edit_note</span><strong>Step information</strong></div>' +
    '<span class="form-sync-note"><span class="material-icons-round syncing">sync</span>Preparing form</span></div>' +
    '<div class="form-skeleton"><span></span><span></span><span class="wide"></span></div></section>';
  delete body.dataset.formLoadedOnce;
  updateSubmitButtonState();
}

function openStepForm(headerName, stepName, rowNumber) {
  FMS.currentFormRow = rowNumber;
  FMS.currentFormHeader = headerName;
  FMS.currentFormStep = stepName;
  FMS.currentFormGeneration += 1;
  var formGeneration = FMS.currentFormGeneration;
  FMS.uploadedFiles = {};
  FMS.requiredFileFields = {};
  FMS.currentFormSchemaVersion = '';
  FMS.formDirty = false;
  FMS.formSchemaOutdated = false;

  ensureModalExists();
  var modal = document.getElementById('fmsModal');
  updateModalIdentity(headerName, stepName, rowNumber, []);
  document.getElementById('modalMsg').className = 'form-msg';
  document.getElementById('modalMsg').style.display = 'none';
  modal.classList.add('active');

  var cacheKey = headerName + '|||' + stepName;
  var cachedEntry = getFormCacheEntry(cacheKey);
  var snapshot = getCachedFormSnapshot(headerName, stepName, rowNumber);
  updateModalIdentity(headerName, stepName, rowNumber, snapshot.context);

  if (cachedEntry) {
    renderStepForm({
      success: true,
      fields: fieldsWithSnapshot(cachedEntry.fields, snapshot),
      schemaVersion: cachedEntry.version || '',
      context: snapshot.context,
      rowNumber: rowNumber
    }, true);
    // A fresh cached schema + current table row needs no blocking request.
    // Refresh silently only when stale or when the table had no context.
    if (!isFormCacheFresh(cachedEntry) || !snapshot.context.length) {
      fetchStepFormInBackground(headerName, stepName, rowNumber, cacheKey, false, false, formGeneration);
    }
  } else {
    renderFormLoadingShell(snapshot, rowNumber);
    fetchStepFormInBackground(headerName, stepName, rowNumber, cacheKey, true, false, formGeneration);
  }
}

function markOpenFormSchemaOutdated(cacheKey) {
  var currentKey = FMS.currentFormHeader && FMS.currentFormStep
    ? FMS.currentFormHeader + '|||' + FMS.currentFormStep
    : '';
  if (currentKey !== cacheKey) return;
  FMS.formSchemaOutdated = true;
  var schemaMsg = document.getElementById('modalMsg');
  if (schemaMsg) {
    schemaMsg.className = 'form-msg error';
    schemaMsg.textContent = 'This step form was updated. Close and reopen it before submitting; your current entries were not discarded.';
    schemaMsg.style.display = 'block';
  }
  updateSubmitButtonState();
}

function storeFormStructureEntry(cacheKey, fields, version, fetchedAt) {
  var oldEntry = getFormCacheEntry(cacheKey);
  var cleanFields = formStructureFields(fields);
  var changed = !!(oldEntry && (
    String(oldEntry.version || '') !== String(version || '') ||
    formSchemaSignature(oldEntry.fields) !== formSchemaSignature(cleanFields)
  ));
  FMS.formStructureCache[cacheKey] = {
    fields: cleanFields,
    version: version || '',
    fetchedAt: fetchedAt
  };
  if (changed) markOpenFormSchemaOutdated(cacheKey);
  return changed;
}

function cacheFormSchemasFromTable(headerName, stepName, data) {
  var now = Date.now();
  var stored = false;
  var changed = false;
  if (stepName && data && Array.isArray(data.formSchema)) {
    changed = storeFormStructureEntry(
      headerName + '|||' + stepName,
      data.formSchema,
      data.formSchemaVersion || '',
      now
    ) || changed;
    stored = true;
  }
  var schemas = data && data.formSchemas;
  var versions = (data && data.formSchemaVersions) || {};
  if (schemas) {
    for (var schemaStep in schemas) {
      if (!Array.isArray(schemas[schemaStep])) continue;
      changed = storeFormStructureEntry(
        headerName + '|||' + schemaStep,
        schemas[schemaStep],
        versions[schemaStep] || '',
        now
      ) || changed;
      stored = true;
    }
  }
  if (stored) persistFormStructureCache();
  return changed;
}

function warmStepFormCache(headerName, stepName, rowNumber) {
  if (!rowNumber) return;
  var cacheKey = headerName + '|||' + stepName;
  if (isFormCacheFresh(getFormCacheEntry(cacheKey)) || FMS.formFetchInFlight[cacheKey]) return;
  fetchStepFormInBackground(headerName, stepName, rowNumber, cacheKey, false, true);
}

function warmFormsFromMultiTable(headerName, data) {
  var warmed = {};
  (data.rows || []).some(function(row) {
    (row.steps || []).forEach(function(stepState) {
      if (!warmed[stepState.step] && stepState.status === 'pending') {
        warmed[stepState.step] = true;
        warmStepFormCache(headerName, stepState.step, row.row);
      }
    });
    return Object.keys(warmed).length >= 4; // avoid flooding Apps Script with calls
  });
}

/**
 * Patches only the "Planned" read-only display in-place, without touching
 * any other field the user may already be filling in. Used when the
 * background confirmation fetch resolves after an instant cache-render.
 */
function findFormFieldByName(name) {
  var fields = document.querySelectorAll('#modalFields .form-field');
  for (var i = 0; i < fields.length; i++) {
    if (fields[i].getAttribute('data-field-name') === String(name)) return fields[i];
  }
  return null;
}

function updatePlannedDisplay(fields) {
  var plannedField = fields.filter(function(f) { return f.type === 'PLANNED_DISPLAY'; })[0];
  if (!plannedField) return;
  var fieldDiv = findFormFieldByName(plannedField.name);
  if (!fieldDiv) return;
  var display = fieldDiv.querySelector('.readonly-display');
  if (display) {
    display.innerHTML = '<span class="material-icons-round">event</span>' +
      (plannedField.value ? escapeHtml(plannedField.value) : 'Not set yet');
  }
}

function updateFormContext(context, rowNumber) {
  updateModalIdentity(FMS.currentFormHeader, FMS.currentFormStep, rowNumber, context || []);
  var existing = document.querySelector('#modalBody .form-context-card');
  if (!existing) return;
  var holder = document.createElement('div');
  holder.innerHTML = renderFormContextHtml(context, rowNumber);
  if (holder.firstElementChild) existing.replaceWith(holder.firstElementChild);
}

function beginFormFetch(cacheKey) {
  FMS.formFetchSequence += 1;
  var token = FMS.formFetchSequence;
  FMS.formFetchLatest[cacheKey] = token;
  FMS.formFetchInFlight[cacheKey] = true;
  return token;
}

function completeLatestFormFetch(cacheKey, token) {
  if (FMS.formFetchLatest[cacheKey] !== token) return false;
  delete FMS.formFetchLatest[cacheKey];
  delete FMS.formFetchInFlight[cacheKey];
  return true;
}

function fetchStepFormInBackground(headerName, stepName, rowNumber, cacheKey, showErrorsInline, isWarmOnly, formGeneration) {
  var requestToken = beginFormFetch(cacheKey);
  google.script.run
    .withSuccessHandler(function(res) {
      // Ignore every side effect from an older request for this Step. A
      // newer popup/request owns both the reusable schema cache and UI.
      if (!completeLatestFormFetch(cacheKey, requestToken)) return;
      if (!isWarmOnly && FMS.currentFormGeneration !== formGeneration) return;
      if (!res.success) {
        if (showErrorsInline && !isWarmOnly && FMS.currentFormGeneration === formGeneration) {
          document.getElementById('modalBody').innerHTML = '<div class="pending-empty">' + escapeHtml(res.message || 'Could not load form') + '</div>';
        }
        return;
      }
      var oldEntry = getFormCacheEntry(cacheKey);
      var cleanResponseFields = formStructureFields(res.fields || []);
      var schemaChanged = !!(oldEntry && (
        String(oldEntry.version || '') !== String(res.schemaVersion || '') ||
        formSchemaSignature(oldEntry.fields) !== formSchemaSignature(cleanResponseFields)
      ));
      storeFormStructureEntry(cacheKey, cleanResponseFields, res.schemaVersion || '', Date.now());
      persistFormStructureCache();
      // Only touch the modal if the user is still on this exact step+row.
      if (!isWarmOnly && FMS.currentFormHeader === headerName && FMS.currentFormStep === stepName &&
          FMS.currentFormRow === rowNumber && FMS.currentFormGeneration === formGeneration) {
        FMS.currentFormSchemaVersion = res.schemaVersion || '';
        var formBody = document.getElementById('modalBody');
        if (formBody && formBody.dataset.formLoadedOnce) {
          if (schemaChanged && !FMS.formDirty) {
            // Safe to refresh the complete form because the user has not
            // entered anything yet. This includes newly required uploads.
            renderStepForm(res, false);
          } else if (schemaChanged) {
            // Never allow submission from a stale form that could omit a
            // newly-added required field. Preserve typing and ask to reopen.
            FMS.formSchemaOutdated = true;
            var schemaMsg = document.getElementById('modalMsg');
            if (schemaMsg) {
              schemaMsg.className = 'form-msg error';
              schemaMsg.textContent = 'This step form was updated. Close and reopen it before submitting; your current entries were not discarded.';
              schemaMsg.style.display = 'block';
            }
            updateSubmitButtonState();
            updateFormContext(res.context || [], rowNumber);
          } else {
            // Preserve anything already typed; patch only row-specific data.
            updatePlannedDisplay(res.fields || []);
            updateFormContext(res.context || [], rowNumber);
            updateSubmitButtonState();
          }
        } else {
          renderStepForm(res, false);
        }
      }
    })
    .withFailureHandler(function(err) {
      if (!completeLatestFormFetch(cacheKey, requestToken)) return;
      if (!isWarmOnly && FMS.currentFormGeneration !== formGeneration) return;
      if (showErrorsInline && !isWarmOnly && FMS.currentFormGeneration === formGeneration) {
        document.getElementById('modalBody').innerHTML = '<div class="pending-empty">' + escapeHtml(err.message || 'Could not load form') + '</div>';
      }
    })
    .wfGetStepForm(
      FMS_SESSION.sheetUrl,
      FMS_SESSION.masterSheet,
      FMS_SESSION.dropdownSheet || 'DROPDPWN',
      headerName,
      stepName,
      rowNumber,
      FMS_SESSION.stepsSheet
    );
}

function renderStepForm(res, isInstantFromCache) {
  var body = document.getElementById('modalBody');
  if (!res.success) {
    body.innerHTML = '<div class="pending-empty">' + escapeHtml(res.message || 'Could not load form') + '</div>';
    return;
  }

  // This is a complete schema render, so it is safe to submit again once
  // the response carries the server version used for stale-form validation.
  FMS.currentFormSchemaVersion = res.schemaVersion || '';
  FMS.formSchemaOutdated = false;
  FMS.formDirty = false;

  // Recomputed fresh on every render: which FILE-type fields this form has
  // (their Submit-disable state is tracked live in handleFileSelect/removeFile).
  FMS.requiredFileFields = {};

  var fieldsHtml = '';
  res.fields.forEach(function(field, idx) {
    var fid = 'field_' + idx;
    fieldsHtml += '<div class="form-field" data-field-name="' + escapeHtmlAttr(field.name) + '">';
    fieldsHtml += '<label>' + escapeHtml(field.name) + '</label>';

    if (field.type === 'PLANNED_DISPLAY') {
      // "Planned" is the ONE field that's genuinely row-specific, so when
      // instantly rendering from cache it must show a neutral placeholder
      // (not the previous row's cached date) until the quick background
      // fetch confirms the real value for this exact row.
      var plannedText = field.value ? escapeHtml(field.value) : (isInstantFromCache ? 'Syncing planned date...' : 'Not set yet');
      fieldsHtml += '<div class="readonly-display"><span class="material-icons-round">event</span><span>' + plannedText + '</span></div>';
    } else if (field.type.indexOf('DROPDOWN') !== -1 || field.type.indexOf('CHECKBOX') !== -1) {
      fieldsHtml += '<select id="' + fid + '" onchange="onFormFieldChanged(this)"><option value="">Select ' + escapeHtml(field.name) + '</option>';
      (field.options || []).forEach(function(opt) {
        fieldsHtml += '<option value="' + escapeHtmlAttr(opt) + '">' + escapeHtml(opt) + '</option>';
      });
      fieldsHtml += '</select>';
    } else if (field.type.indexOf('LONG TEXT') !== -1) {
      fieldsHtml += '<textarea id="' + fid + '" placeholder="Enter ' + escapeHtmlAttr(field.name) + '" oninput="onFormFieldChanged(this)"></textarea>';
    } else if (field.type.indexOf('NUMBER') !== -1) {
      fieldsHtml += '<input type="number" id="' + fid + '" placeholder="Enter ' + escapeHtmlAttr(field.name) + '" oninput="onFormFieldChanged(this)">';
    } else if (field.type.indexOf('FILE') !== -1) {
      FMS.requiredFileFields[field.name] = true;
      fieldsHtml += '<div class="file-drop" id="' + fid + '_drop" onclick="document.getElementById(\'' + fid + '\').click()">' +
        '<span class="file-upload-icon material-icons-round">cloud_upload</span>' +
        '<strong>Upload ' + escapeHtml(field.name) + '</strong>' +
        '<span class="file-drop-text">Click to choose one or multiple files</span>' +
        '<input type="file" id="' + fid + '" multiple onchange="handleFileSelect(this)">' +
        '</div>' +
        '<div class="file-list" id="' + fid + '_list"></div>' +
        '<div class="file-required-hint" id="' + fid + '_hint"><span class="material-icons-round">info</span>Upload required before submission</div>';
    } else {
      fieldsHtml += '<input type="text" id="' + fid + '" placeholder="Enter ' + escapeHtmlAttr(field.name) + '" oninput="onFormFieldChanged(this)">';
    }
    fieldsHtml += '</div>';
  });

  var rowNumber = res.rowNumber || FMS.currentFormRow;
  updateModalIdentity(FMS.currentFormHeader, FMS.currentFormStep, rowNumber, res.context || []);
  var contextHtml = renderFormContextHtml(res.context || [], rowNumber);
  var entryHtml = '<section class="form-entry-card"><div class="form-section-heading"><div>' +
    '<span class="material-icons-round">edit_note</span><strong>Step information</strong></div>' +
    '<span class="form-sync-note"><span class="material-icons-round">bolt</span>Ready to fill</span></div>' +
    '<div class="modal-fields" id="modalFields">' +
    (fieldsHtml || '<div class="pending-empty">No fields to fill for this step.</div>') + '</div></section>';

  body.innerHTML = contextHtml + entryHtml;
  body.dataset.formLoadedOnce = '1';
  updateSubmitButtonState();
  applyAdaptiveFormLayout(res.fields);
}

/**
 * Decides whether this form should use a 2-column layout instead of a
 * single column. Goal: user should NEVER have to scroll the modal to
 * reach Submit. Uses a simple heuristic based on field count/type first
 * (fast, no layout thrash), then double-checks against the ACTUAL
 * rendered height vs. available viewport height and only widens if the
 * single-column version would truly overflow.
 */
function applyAdaptiveFormLayout(fields) {
  var fieldsGrid = document.getElementById('modalFields');
  var modalBox = document.querySelector('.modal-box');
  if (!fieldsGrid || !modalBox) return;

  // Heuristic: long-form fields (textarea, file-drop) take much more
  // vertical room than a single input/select, so weight them higher when
  // deciding if the form is "long" for a single column.
  var weight = 0;
  fields.forEach(function(f) {
    if (f.type === 'PLANNED_DISPLAY') weight += 1;
    else if (f.type && f.type.indexOf('LONG TEXT') !== -1) weight += 2.5;
    else if (f.type && f.type.indexOf('FILE') !== -1) weight += 2.5;
    else weight += 1;
  });

  var shouldTryTwoColumns = weight >= 6; // roughly: more than ~6 simple fields, or fewer with big ones

  if (shouldTryTwoColumns) {
    fieldsGrid.classList.add('form-fields-grid');
    modalBox.classList.add('modal-wide');
    markFullWidthFields();
  } else {
    fieldsGrid.classList.remove('form-fields-grid');
    modalBox.classList.remove('modal-wide');
  }

  // Final safety check: if it STILL overflows the viewport after applying
  // (or without needing) the grid, nudge the modal to use more of the
  // available height so Submit stays reachable without page-level scroll
  // (the modal body itself still scrolls internally as a last resort,
  // but this keeps that from being needed in the vast majority of cases).
  requestAnimationFrameSafe(function() {
    var footer = modalBox.querySelector('.modal-footer');
    var header = modalBox.querySelector('.modal-header');
    var body = document.getElementById('modalBody');
    var available = window.innerHeight * 0.9 - (header ? header.offsetHeight : 64) - (footer ? footer.offsetHeight : 74);
    if (body && body.scrollHeight > available && !shouldTryTwoColumns) {
      // Single column still doesn't fit - switch to 2 columns as a fallback
      fieldsGrid.classList.add('form-fields-grid');
      modalBox.classList.add('modal-wide');
      markFullWidthFields();
    }
  });
}

function requestAnimationFrameSafe(fn) {
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(fn);
  else setTimeout(fn, 0);
}

// Long Text / File-upload fields always span both columns in the 2-column
// grid (they need the extra horizontal room and don't pair well side by
// side with a short field).
function markFullWidthFields() {
  var fieldDivs = document.querySelectorAll('#modalFields .form-field');
  fieldDivs.forEach(function(div) {
    var hasTextarea = div.querySelector('textarea');
    var hasFileDrop = div.querySelector('.file-drop');
    if (hasTextarea || hasFileDrop) {
      div.classList.add('field-span-2');
    } else {
      div.classList.remove('field-span-2');
    }
  });
}

/**
 * If this Step's form has any FILE-type question, the Submit button stays
 * disabled until EVERY required file field has at least one uploaded
 * file. Steps with no file question are unaffected (button always enabled
 * once the form is loaded).
 */
function updateSubmitButtonState() {
  var submitBtn = document.getElementById('modalSubmitBtn');
  if (!submitBtn) return;

  var requiredNames = Object.keys(FMS.requiredFileFields || {});
  var allUploaded = requiredNames.every(function(name) {
    return FMS.uploadedFiles[name] && FMS.uploadedFiles[name].length > 0;
  });

  var schemaReady = !!FMS.currentFormSchemaVersion;
  submitBtn.disabled = !allUploaded || FMS.formSchemaOutdated || !schemaReady;
  submitBtn.classList.toggle('btn-disabled-upload', !allUploaded);
  submitBtn.title = schemaReady ? '' : 'Confirming the latest form questions...';

  // Show/hide the "File upload required" hint under each pending file field
  // + mark/unmark the field as "filled" (colored label) alongside every
  // other answered question in the form.
  requiredNames.forEach(function(name) {
    var uploaded = FMS.uploadedFiles[name] && FMS.uploadedFiles[name].length > 0;
    var fieldDiv = findFormFieldByName(name);
    if (!fieldDiv) return;
    var hint = fieldDiv.querySelector('.file-required-hint');
    var drop = fieldDiv.querySelector('.file-drop');
    if (hint) hint.style.display = uploaded ? 'none' : 'block';
    if (drop) drop.classList.toggle('file-drop-done', uploaded);
    fieldDiv.classList.toggle('field-filled', uploaded);
  });
}

/**
 * Marks a question's label with the "answered" color (via .field-filled
 * on its wrapping .form-field) as soon as the user types/selects a value,
 * and un-marks it if they clear it back out - applies to every question
 * type except Planned (never editable) and File-upload (handled inside
 * updateSubmitButtonState() instead, since it isn't a simple input value).
 */
function onFormFieldChanged(inputEl) {
  FMS.formDirty = true;
  var fieldDiv = inputEl.closest('.form-field');
  if (!fieldDiv) return;
  var hasValue = String(inputEl.value || '').trim() !== '';
  fieldDiv.classList.toggle('field-filled', hasValue);
}

function handleFileSelect(input, fieldName) {
  if (!fieldName) {
    var ownerField = input.closest ? input.closest('.form-field') : null;
    fieldName = ownerField ? ownerField.getAttribute('data-field-name') : '';
  }
  if (!fieldName) return;
  FMS.formDirty = true;
  var files = Array.prototype.slice.call(input.files);
  if (!FMS.uploadedFiles[fieldName]) FMS.uploadedFiles[fieldName] = [];

  // Keep Submit disabled while files are still being read/encoded, even if
  // this field already had a previous upload - only flip back to enabled
  // once every selected file has finished reading (see the counter below).
  updateSubmitButtonState();

  var pendingReads = files.length;
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      FMS.uploadedFiles[fieldName].push({ base64: base64, fileName: file.name, mimeType: file.type || 'application/octet-stream' });
      renderFileList(fieldName);
      pendingReads--;
      if (pendingReads === 0) updateSubmitButtonState();
    };
    reader.onerror = function() {
      pendingReads--;
      if (pendingReads === 0) updateSubmitButtonState();
    };
    reader.readAsDataURL(file);
  });
}

function renderFileList(fieldName) {
  var fieldDiv = findFormFieldByName(fieldName);
  if (!fieldDiv) return;
  var listDiv = fieldDiv.querySelector('.file-list');
  if (!listDiv) return;

  var files = FMS.uploadedFiles[fieldName] || [];
  listDiv.innerHTML = files.map(function(f, i) {
    return '<div class="file-chip"><span>' + escapeHtml(f.fileName) + '</span>' +
      '<span class="remove-file material-icons-round" onclick="removeFileByElement(this,' + i + ')">close</span></div>';
  }).join('');
}

function removeFileByElement(element, index) {
  var ownerField = element && element.closest ? element.closest('.form-field') : null;
  var fieldName = ownerField ? ownerField.getAttribute('data-field-name') : '';
  if (fieldName) removeFile(fieldName, index);
}

function removeFile(fieldName, index) {
  FMS.formDirty = true;
  if (FMS.uploadedFiles[fieldName]) {
    FMS.uploadedFiles[fieldName].splice(index, 1);
    renderFileList(fieldName);
    updateSubmitButtonState(); // re-disable Submit if this was the only file for a required field
  }
}

// ================================================================
// OPTIMISTIC STEP COMPLETION
// The moment Submit is clicked, the row is marked "completed" (and the
// pipeline's NEXT owned step is unlocked to "pending") directly in the
// SAME cache objects that both views render from - so the table updates
// instantly, in real time, while the actual save to the Sheet is still
// happening in the background. If the save fails, every change is
// rolled back automatically and the row returns to exactly how it was.
// ================================================================

function findCachedRowByNumber(cacheEntry, rowNumber) {
  if (!cacheEntry || !cacheEntry.rows) return null;
  for (var i = 0; i < cacheEntry.rows.length; i++) {
    if (cacheEntry.rows[i].row === rowNumber) return cacheEntry.rows[i];
  }
  return null;
}

function recomputeMultiRowAggregate(row) {
  var anyPending = false, anyOverdue = false, myTotal = row.steps.length, myDone = 0;
  row.steps.forEach(function(s) {
    if (s.status === 'completed') myDone++;
    if (s.status === 'pending') {
      anyPending = true;
      if (s.overdue) anyOverdue = true;
    }
  });
  row.status = anyPending ? 'pending' : ((myTotal > 0 && myDone === myTotal) ? 'completed' : 'locked');
  row.overdue = anyOverdue;
}

/**
 * Applies the optimistic update in place and returns a revert() function
 * that restores every touched field to its exact previous value, plus
 * flags for which view(s) actually have data to re-render.
 */
function applyOptimisticStepCompletion(headerName, stepName, rowNumber) {
  var changes = [];
  function track(obj, prop, value) {
    changes.push({ obj: obj, prop: prop, prev: obj[prop] });
    obj[prop] = value;
  }

  var touchedStepView = false;
  var touchedMultiView = false;
  var stepNameUpper = String(stepName).trim().toUpperCase();

  // Step View cache: the row this exact step owns moves straight to
  // "completed" (its Actual is what's being written right now).
  var stepCacheEntry = FMS.tableCache[headerName + '|||' + stepName];
  var stepRow = findCachedRowByNumber(stepCacheEntry, rowNumber);
  if (stepRow) {
    track(stepRow, 'status', 'completed');
    track(stepRow, 'overdue', false);
    touchedStepView = true;
  }

  // Table View cache: update this step's chip to "completed", unlock the
  // immediately next PIPELINE step for this row if it's one the user owns
  // and is currently locked (safe because "next step becomes actionable"
  // is exactly what filling THIS step's Actual guarantees), then
  // recompute the row's own aggregate status/overdue from all its steps.
  var multiCacheEntry = FMS.multiTableCache[headerName];
  var multiRow = findCachedRowByNumber(multiCacheEntry, rowNumber);
  if (multiRow && multiRow.steps) {
    var completedEntry = null;
    multiRow.steps.forEach(function(s) {
      if (String(s.step).trim().toUpperCase() === stepNameUpper) completedEntry = s;
    });
    if (completedEntry) {
      track(completedEntry, 'status', 'completed');
      track(completedEntry, 'overdue', false);

      var nextEntry = null;
      multiRow.steps.forEach(function(s) {
        if (s.order === completedEntry.order + 1) nextEntry = s;
      });
      if (nextEntry && nextEntry.status === 'locked') {
        track(nextEntry, 'status', 'pending');
        track(nextEntry, 'overdue', false);
      }

      track(multiRow, 'status', multiRow.status);   // snapshot before recompute
      track(multiRow, 'overdue', multiRow.overdue);
      recomputeMultiRowAggregate(multiRow);
      touchedMultiView = true;
    }
  }

  return {
    touchedStepView: touchedStepView,
    touchedMultiView: touchedMultiView,
    revert: function() {
      for (var i = changes.length - 1; i >= 0; i--) {
        changes[i].obj[changes[i].prop] = changes[i].prev;
      }
    }
  };
}

// Guards against a second Submit firing before the first one resolves
// (double-click, slow network, Enter key). Without this, a second
// optimistic mutation would capture the ALREADY-optimistic values as its
// "previous" state, so a later failure would roll back to the wrong
// values instead of the original server-confirmed ones.
FMS.submitInFlight = false;

function isSubmittedFormStillCurrent(headerName, stepName, rowNumber, schemaVersion, formGeneration) {
  return FMS.currentFormHeader === headerName &&
    FMS.currentFormStep === stepName &&
    FMS.currentFormRow === rowNumber &&
    FMS.currentFormSchemaVersion === schemaVersion &&
    FMS.currentFormGeneration === formGeneration;
}

function submitStepForm() {
  if (FMS.submitInFlight || FMS.formSchemaOutdated || !FMS.currentFormSchemaVersion) return;

  var body = document.getElementById('modalBody');
  var formValues = {};

  var fieldDivs = body.querySelectorAll('.form-field');
  fieldDivs.forEach(function(div, idx) {
    var name = div.getAttribute('data-field-name');
    var input = div.querySelector('input[type="text"], input[type="number"], textarea, select');
    if (input) formValues[name] = input.value;
  });

  FMS.submitInFlight = true;
  var submitBtn = document.getElementById('modalSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="material-icons-round syncing">sync</span>Saving...';

  // Capture NOW - the modal/currentForm* state may change (or the modal
  // may be closed) before the server call resolves.
  var targetHeader = FMS.currentFormHeader;
  var targetStep = FMS.currentFormStep;
  var targetRow = FMS.currentFormRow;
  var targetSchemaVersion = FMS.currentFormSchemaVersion;
  var targetFormGeneration = FMS.currentFormGeneration;

  // Update the UI INSTANTLY - the row flips to completed/unlocks the next
  // step right now, in whichever view is currently on screen, without
  // waiting for the round trip to Google Sheets to finish.
  var optimistic = applyOptimisticStepCompletion(targetHeader, targetStep, targetRow);
  if ((optimistic.touchedStepView && FMS.viewMode !== 'table') ||
      (optimistic.touchedMultiView && FMS.viewMode === 'table')) {
    if (FMS.currentHeader === targetHeader && document.getElementById('tableContainer')) {
      rerenderCurrentTable();
    }
  }

  google.script.run
    .withSuccessHandler(function(res) {
      FMS.submitInFlight = false;
      var sameForm = isSubmittedFormStillCurrent(targetHeader, targetStep, targetRow, targetSchemaVersion, targetFormGeneration);
      var msg = sameForm ? document.getElementById('modalMsg') : null;
      if (sameForm && submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-icons-round">check_circle</span>Submit';
      }
      if (res.success) {
        if (msg) {
          msg.className = 'form-msg success';
          msg.textContent = res.message;
          msg.style.display = 'block';
        }
        setTimeout(function() {
          // Never close or mutate a different form the user opened while
          // this request was in flight.
          if (isSubmittedFormStillCurrent(targetHeader, targetStep, targetRow, targetSchemaVersion, targetFormGeneration)) closeModal();
          // IMPORTANT: keep the optimistic caches and silently confirm the
          // table only when the user is still viewing the submitted flow.
          if (FMS.currentHeader === targetHeader) {
            if (FMS.viewMode === 'table') {
              loadMultiStepTable(targetHeader);
            } else if (FMS.currentStep === targetStep) {
              loadStepTable(targetHeader, targetStep);
            }
          }
        }, 700);
      } else {
        // Server rejected the save (validation, permissions, etc.) - roll
        // the optimistic change back so the row honestly reflects reality.
        optimistic.revert();
        if (res.code === 'FORM_SCHEMA_OUTDATED') {
          var staleKey = targetHeader + '|||' + targetStep;
          var staleEntry = getFormCacheEntry(staleKey);
          // A newer form may already have refreshed this cache while the old
          // request was in flight. Never delete or disable that newer form.
          if (sameForm && staleEntry && staleEntry.version === targetSchemaVersion) {
            delete FMS.formStructureCache[staleKey];
            persistFormStructureCache();
          }
          if (sameForm) {
            FMS.formSchemaOutdated = true;
            updateSubmitButtonState();
          }
        }
        if (FMS.currentHeader === targetHeader && document.getElementById('tableContainer')) {
          rerenderCurrentTable();
        }
        if (msg) {
          msg.className = 'form-msg error';
          msg.textContent = res.message;
          msg.style.display = 'block';
        }
      }
    })
    .withFailureHandler(function(err) {
      FMS.submitInFlight = false;
      var sameForm = isSubmittedFormStillCurrent(targetHeader, targetStep, targetRow, targetSchemaVersion, targetFormGeneration);
      if (sameForm && submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-icons-round">check_circle</span>Submit';
      }
      optimistic.revert();
      if (FMS.currentHeader === targetHeader && document.getElementById('tableContainer')) {
        rerenderCurrentTable();
      }
      if (sameForm) {
        var msg = document.getElementById('modalMsg');
        if (msg) {
          msg.className = 'form-msg error';
          msg.textContent = 'Error: ' + err.message;
          msg.style.display = 'block';
        }
      }
    })
    // Uses currentFormHeader/currentFormStep (set by openStepForm) rather
    // than currentHeader/currentStep - critical in Table View, where the
    // form being submitted belongs to whichever step's chip was clicked,
    // not to a single "currently open" step.
    .wfSubmitStep(FMS_SESSION.sheetUrl, FMS_SESSION.masterSheet, FMS_SESSION.stepsSheet,
      targetHeader, targetStep, targetRow, formValues, FMS.uploadedFiles, FMS_SESSION.userName, targetSchemaVersion);
}

function ensureModalExists() {
  if (document.getElementById('fmsModal')) return;

  var modalHtml =
    '<div class="modal-overlay" id="fmsModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
    '<div class="modal-box">' +
    '<div class="modal-header"><div class="modal-title-wrap">' +
    '<span class="modal-step-icon material-icons-round">task_alt</span>' +
    '<div><h3 id="modalTitle">Step Form</h3><p id="modalSubtitle">Workflow record</p></div></div>' +
    '<button class="icon-btn modal-close-btn" onclick="closeModal()" title="Close form" aria-label="Close form"><span class="material-icons-round">close</span></button></div>' +
    '<div class="modal-body" id="modalBody"></div>' +
    '<div class="modal-footer"><div class="form-msg" id="modalMsg"></div>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-secondary" onclick="closeModal()"><span class="material-icons-round">close</span>Cancel</button>' +
    '<button class="btn btn-primary" id="modalSubmitBtn" onclick="submitStepForm()"><span class="material-icons-round">check_circle</span>Submit</button>' +
    '</div></div>' +
    '</div>' +
    '</div>';

  document.body.insertAdjacentHTML('beforeend', modalHtml);

  document.getElementById('fmsModal').addEventListener('click', function(e) {
    if (e.target.id === 'fmsModal') closeModal();
  });
}

function closeModal() {
  var modal = document.getElementById('fmsModal');
  if (modal) modal.classList.remove('active');
  // Invalidate every callback owned by the closed popup, even if the same
  // row is immediately reopened with the same schema version.
  FMS.currentFormGeneration += 1;
}

// ===== LOAD PERMISSIONS (sidebar headers/steps - remembered across refreshes) =====
function loadPermissions() {
  if (typeof FMS_SESSION === 'undefined') return;
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        FMS.permissionsCache = res.permissions;
        renderSidebar(res.permissions);
        setLastUpdatedNow(false);
      } else {
        document.getElementById('sidebarNav').innerHTML = 
          '<div style="padding:20px; color:var(--danger); font-size:12px; text-align:center;">' + 
          (res.message || 'No permissions found') + '</div>';
      }
    })
    .withFailureHandler(function(err) {
      document.getElementById('sidebarNav').innerHTML = 
        '<div style="padding:20px; color:var(--danger); font-size:12px; text-align:center;">Error: ' + err.message + '</div>';
    })
    .getUserPermissions(FMS_SESSION.userName);
}

// ===== UTILITY =====
/**
 * Derives 1-2 letter initials from a user's name for the topbar avatar
 * chip, e.g. "ANKUR" -> "AN", "ANKUR SHARMA" -> "AS".
 */
function getInitials(name) {
  var trimmed = String(name || '').trim();
  if (!trimmed) return '?';
  var parts = trimmed.split(/\s+/);
  if (parts.length >= 2) {
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  return trimmed.substring(0, 2).toUpperCase();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeHtmlAttr(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escapeAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
}

// ===== EVENT LISTENERS =====
document.addEventListener('click', function(e) {
  if (FMS.sidebarOpen) {
    var sidebar = document.getElementById('sidebar');
    var menuBtn = document.querySelector('.icon-btn');
    if (sidebar && !sidebar.contains(e.target) && menuBtn && !menuBtn.contains(e.target)) {
      closeSidebarAfterNavigation();
    }
  }
});

document.addEventListener('keydown', function(e) {
  // Escape owns the navigation drawer only on mobile. On desktop it must
  // not collapse/persist the sidebar while the user is merely dismissing
  // Appearance, a column filter or the date picker.
  if (e.key === 'Escape' && isMobileLayout() && FMS.sidebarOpen) closeSidebar(false);
});
</script>
