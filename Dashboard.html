<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Explicit viewport meta tag: REQUIRED here because this whole page is
       injected via document.write() from Login.html (see goToDashboard()
       in Login.html) - that REPLACES the entire document, including
       whatever viewport meta tag Code.gs's doGet().addMetaTag() set on
       the original page. Without this, mobile browsers render the
       Dashboard at desktop width and the user sees a tiny zoomed-out page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <?!= include('ThemeEngine') ?>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <?!= include('Styles') ?>
</head>
<body data-theme="dark" class="font-medium">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" onclick="toggleSidebar()" title="Menu">
        <span class="material-icons-round">menu</span>
      </button>
      <div class="topbar-logo-box">
        <span class="material-icons-round">checkroom</span>
      </div>
      <div class="topbar-title-block">
        <div class="topbar-title"><span class="brand-fms">FMS</span> Fashion</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="font-controls">
        <button class="font-btn" onclick="setFontSize('small')" title="Small">A</button>
        <button class="font-btn active" onclick="setFontSize('medium')" title="Medium">A+</button>
        <button class="font-btn" onclick="setFontSize('large')" title="Large">A++</button>
      </div>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">
        <span class="material-icons-round" id="themeIcon">light_mode</span>
      </button>
      <button class="icon-btn" onclick="FMSTheme.openDrawer()" title="Appearance">
        <span class="material-icons-round">palette</span>
      </button>
      <div class="topbar-clock" title="Current time">
        <div class="clock-time" id="liveClock">--:--:--</div>
      </div>
      <!-- Kept in the DOM (hidden) so existing sync/last-updated JS logic
           (setSyncingState/setLastUpdatedNow, used for step-table
           background refreshes) keeps working without errors - the
           visible "Last Updated" indicator now lives on the Home page
           itself instead of the topbar, to keep the topbar a clean
           single row. -->
      <span class="material-icons-round sync-icon" id="syncIcon" style="display:none;">sync</span>
      <span id="lastUpdatedText" style="display:none;">Not synced yet</span>
      <div class="user-avatar-chip" title="Logged in user">
        <div class="user-avatar-initials" id="userInitials">U</div>
        <div class="user-avatar-text">
          <div class="user-avatar-name" id="userDisplay">User</div>
          <div class="user-avatar-role">FMS Fashion</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>&#9776; Navigation</h3>
      <button class="icon-btn" onclick="closeSidebar()" title="Close">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="sidebar-nav" id="sidebarNav">
      <div class="nav-group">
        <div class="nav-item nav-item-home active" id="navHomeItem" onclick="goHome()" title="Home">
          <span class="material-icons-round">home</span>
          <span>Home</span>
        </div>
      </div>
      <div id="sidebarNavGroups">
        <div style="text-align:center; padding:40px 20px; color:var(--text-muted); font-size:12px;">
          Loading permissions...
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="FMSTheme.openDrawer()">
        <span class="material-icons-round">palette</span>
        <span>Appearance</span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">
    <div class="pending-loading">Loading your dashboard...</div>
  </div>

  <?!= include('Scripts') ?>

  <script>
    // Initialize dashboard
    window.onload = function() {
      if (typeof FMS_SESSION !== 'undefined') {
        document.getElementById('userDisplay').textContent = FMS_SESSION.userName;
        var initialsEl = document.getElementById('userInitials');
        if (initialsEl) initialsEl.textContent = getInitials(FMS_SESSION.userName);
        loadPermissions();
        goHome(); // Home dashboard summary is the landing page after login
      }
      startLiveClock();
      startAutoRefresh();
      autoShrinkTopbar();
      window.addEventListener('resize', scheduleTopbarAutoShrink);
    };
  </script>
</body>
</html>
