<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('ThemeEngine') ?>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <?!= include('Styles') ?>
</head>
<body data-theme="dark" class="font-medium">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" onclick="toggleSidebar()" title="Menu">
        <span class="material-icons-round">menu</span>
      </button>
      <div class="topbar-brand"><span>FMS</span> Fashion</div>
    </div>
    <div class="topbar-right">
      <div class="font-controls">
        <button class="font-btn" onclick="setFontSize('small')" title="Small">A</button>
        <button class="font-btn active" onclick="setFontSize('medium')" title="Medium">A+</button>
        <button class="font-btn" onclick="setFontSize('large')" title="Large">A++</button>
      </div>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">
        <span class="material-icons-round" id="themeIcon">light_mode</span>
      </button>
      <button class="icon-btn" onclick="FMSTheme.openDrawer()" title="Appearance">
        <span class="material-icons-round">palette</span>
      </button>
      <div class="topbar-clock" title="Live clock & last data sync time">
        <span class="material-icons-round sync-icon" id="syncIcon">sync</span>
        <div class="clock-block">
          <div class="clock-time" id="liveClock">--:--:--</div>
          <div class="last-updated-text" id="lastUpdatedText">Not synced yet</div>
        </div>
      </div>
      <div class="user-badge">
        <span class="material-icons-round">account_circle</span>
        <span id="userDisplay">User</span>
      </div>
    </div>
  </div>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>&#9776; Navigation</h3>
      <button class="icon-btn" onclick="closeSidebar()" title="Close">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="sidebar-nav" id="sidebarNav">
      <div style="text-align:center; padding:40px 20px; color:var(--text-muted); font-size:12px;">
        Loading permissions...
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="FMSTheme.openDrawer()">
        <span class="material-icons-round">palette</span>
        <span>Appearance</span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">
    <div class="welcome-section">
      <span class="material-icons-round welcome-icon">dashboard</span>
      <h2>Welcome to FMS Fashion</h2>
      <p>Select a menu item from the sidebar to get started. Click the menu icon or press ESC to toggle.</p>
    </div>
  </div>

  <?!= include('Scripts') ?>

  <script>
    // Initialize dashboard
    window.onload = function() {
      if (typeof FMS_SESSION !== 'undefined') {
        document.getElementById('userDisplay').textContent = FMS_SESSION.userName;
        loadPermissions();
      }
      startLiveClock();
      startAutoRefresh();
    };
  </script>
</body>
</html>
