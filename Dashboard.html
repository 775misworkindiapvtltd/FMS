<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Explicit viewport meta tag: REQUIRED here because this whole page is
       injected via document.write() from Login.html (see goToDashboard()
       in Login.html) - that REPLACES the entire document, including
       whatever viewport meta tag Code.gs's doGet().addMetaTag() set on
       the original page. Without this, mobile browsers render the
       Dashboard at desktop width and the user sees a tiny zoomed-out page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <?!= include('ThemeEngine') ?>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <?!= include('Styles') ?>
</head>
<body data-theme="dark" class="font-medium">

  <!-- PROFESSIONAL APPLICATION HEADER -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn topbar-menu-btn" onclick="toggleSidebar()" title="Collapse navigation" aria-label="Toggle navigation">
        <span class="material-icons-round">menu_open</span>
      </button>
      <div class="topbar-logo-box" aria-hidden="true">
        <span class="material-icons-round">checkroom</span>
      </div>
      <div class="topbar-title-block">
        <div class="topbar-title"><span class="brand-fms">FMS</span> Fashion</div>
        <div class="topbar-breadcrumb" id="topbarBreadcrumb"></div>
      </div>
    </div>
    <div class="topbar-right">
      <!-- Always-visible sync status: shows the real last-updated time on
           EVERY page (not just Home), and turns green with a spinning
           icon the moment a background refresh starts - so the user
           always sees data refreshing without ever being blocked by it. -->
      <div class="topbar-last-updated" id="topbarLastUpdated" title="Data syncs automatically in the background">
        <span class="material-icons-round sync-icon">sync</span><span>Loading latest data...</span>
      </div>
      <button class="topbar-action-btn" onclick="FMSTheme.openDrawer()" title="Display and appearance settings">
        <span class="material-icons-round">tune</span>
        <span>Appearance</span>
      </button>
      <!-- Retained as hidden compatibility hooks for the existing live-clock
           and background-sync logic; operational status is shown inside the
           workspace instead of competing for space in the app header. -->
      <div id="liveClock" hidden>--:--:--</div>
      <span class="material-icons-round sync-icon" id="syncIcon" style="display:none;">sync</span>
      <span id="lastUpdatedText" style="display:none;">Not synced yet</span>
      <div class="user-avatar-chip" title="Logged in user">
        <div class="user-avatar-initials" id="userInitials">U</div>
        <div class="user-avatar-text">
          <div class="user-avatar-name" id="userDisplay">User</div>
          <div class="user-avatar-role">Workflow user</div>
        </div>
      </div>
    </div>
  </header>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- STABLE COLLAPSIBLE NAVIGATION -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-brand-mark material-icons-round">account_tree</span>
        <div class="sidebar-brand-copy">
          <strong>FMS Fashion</strong>
          <span>Workflow Management</span>
        </div>
      </div>
      <button class="icon-btn sidebar-toggle-btn" onclick="toggleSidebar()" title="Collapse navigation" aria-label="Collapse navigation">
        <span class="material-icons-round">chevron_left</span>
      </button>
    </div>
    <div class="sidebar-nav" id="sidebarNav">
      <div class="nav-group">
        <div class="nav-item nav-item-home active" id="navHomeItem" onclick="goHome()" title="Home">
          <span class="material-icons-round">home</span>
          <span>Home</span>
        </div>
      </div>
      <div id="sidebarNavGroups">
        <div style="text-align:center; padding:40px 20px; color:var(--text-muted); font-size:12px;">
          Loading permissions...
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="FMSTheme.openDrawer()" title="Appearance settings">
        <span class="material-icons-round">tune</span>
        <span>Appearance</span>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">
    <div class="pending-loading">Loading your dashboard...</div>
  </div>

  <?!= include('Scripts') ?>

  <script>
    // Apply stored shell preferences immediately now that the DOM exists;
    // do not wait for window.onload (which can be delayed by web fonts).
    initializeSidebar();
    restoreFontSize();
    restoreLastSyncTime();
    restorePersistedCaches();

    // Initialize dashboard
    window.onload = function() {
      // Restore the Step/Table view preference BEFORE anything renders, so
      // the very first step the user opens already uses their saved view.
      FMS.viewMode = getStoredViewMode();
      if (typeof FMS_SESSION !== 'undefined') {
        document.getElementById('userDisplay').textContent = FMS_SESSION.userName;
        var initialsEl = document.getElementById('userInitials');
        if (initialsEl) initialsEl.textContent = getInitials(FMS_SESSION.userName);
        loadPermissions();
        goHome(); // Home dashboard summary is the landing page after login
      }
      startLiveClock();
      startAutoRefresh();
      autoShrinkTopbar();
      window.addEventListener('resize', handleDashboardResize);
    };
  </script>
</body>
</html>
