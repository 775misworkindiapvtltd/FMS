<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: rgba(255,255,255,0.03);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.6);
      --text-muted: rgba(255,255,255,0.3);
      --accent: #667eea;
      --accent-hover: #764ba2;
      --border: rgba(255,255,255,0.06);
      --sidebar-width: 280px;
      --sidebar-collapsed: 0px;
      --topbar-height: 60px;
      --font-size: 14px;
    }

    [data-theme="light"] {
      --bg-primary: #f5f7fa;
      --bg-secondary: #ffffff;
      --bg-card: rgba(0,0,0,0.02);
      --text-primary: #1a1a2e;
      --text-secondary: rgba(0,0,0,0.6);
      --text-muted: rgba(0,0,0,0.3);
      --border: rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: var(--font-size);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-height);
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 1000; backdrop-filter: blur(20px);
      transition: background 0.3s;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .menu-toggle {
      width: 40px; height: 40px; border-radius: 10px; border: none;
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s; border: 1px solid var(--border);
    }
    .menu-toggle:hover { background: var(--accent); color: #fff; }
    .topbar-brand { font-size: 18px; font-weight: 700; }
    .topbar-brand span { color: var(--accent); }

    .topbar-right { display: flex; align-items: center; gap: 12px; }

    /* Font Size Controls */
    .font-controls { display: flex; gap: 4px; }
    .font-btn {
      padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
      font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12px;
      transition: 0.2s;
    }
    .font-btn:hover, .font-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Theme Toggle */
    .theme-toggle {
      width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .theme-toggle:hover { background: var(--accent); color: #fff; }

    /* User Badge */
    .user-badge {
      display: flex; align-items: center; gap: 8px; padding: 6px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border-radius: 10px; color: #fff; font-size: 12px; font-weight: 500;
    }
    .user-badge .material-icons-round { font-size: 18px; }

    /* ===== SIDEBAR ===== */
    .sidebar-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 1500; opacity: 0;
      visibility: hidden; transition: 0.3s;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }

    .sidebar {
      position: fixed; top: 0; left: -300px; width: var(--sidebar-width);
      height: 100vh; background: var(--bg-secondary); z-index: 2000;
      border-right: 1px solid var(--border); transition: left 0.3s ease;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar.open { left: 0; }

    .sidebar-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-header h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .sidebar-close {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
      border: 1px solid var(--border);
    }
    .sidebar-close:hover { background: #ff5252; color: #fff; }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Nav Groups */
    .nav-group { margin-bottom: 8px; }
    .nav-group-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 10px; cursor: pointer;
      background: var(--bg-card); border: 1px solid var(--border);
      transition: 0.2s; user-select: none;
    }
    .nav-group-header:hover { background: rgba(102,126,234,0.1); border-color: var(--accent); }
    .nav-group-header .header-text { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .nav-group-header .arrow { font-size: 18px; color: var(--text-muted); transition: transform 0.3s; }
    .nav-group.expanded .nav-group-header .arrow { transform: rotate(180deg); }
    .nav-group.expanded .nav-group-header { background: rgba(102,126,234,0.1); border-color: var(--accent); }

    .nav-group-items {
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
      padding-left: 12px;
    }
    .nav-group.expanded .nav-group-items { max-height: 500px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; margin-top: 4px; border-radius: 8px;
      cursor: pointer; transition: 0.2s; color: var(--text-secondary);
      font-size: 12px; font-weight: 400;
    }
    .nav-item:hover { background: rgba(102,126,234,0.08); color: var(--accent); }
    .nav-item .material-icons-round { font-size: 16px; }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      margin-top: var(--topbar-height); padding: 30px;
      min-height: calc(100vh - var(--topbar-height));
      transition: 0.3s;
    }

    .welcome-section {
      text-align: center; padding: 80px 20px;
    }
    .welcome-section .welcome-icon {
      font-size: 80px; color: var(--accent); margin-bottom: 20px; opacity: 0.6;
    }
    .welcome-section h2 {
      font-size: 28px; font-weight: 700; margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .welcome-section p { color: var(--text-secondary); font-size: 14px; max-width: 400px; margin: 0 auto; }

    /* Content Page */
    .content-page {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 30px; min-height: 300px;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .content-page h3 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .content-page p { color: var(--text-secondary); font-size: 13px; }

    /* Responsive */
    @media (max-width: 768px) {
      .topbar { padding: 0 12px; }
      .main-content { padding: 16px; }
      .user-badge span:not(.material-icons-round) { display: none; }
    }
  </style>
</head>
<body data-theme="dark">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" title="Menu">
        <span class="material-icons-round">menu</span>
      </button>
      <div class="topbar-brand"><span>FMS</span> Dashboard</div>
    </div>
    <div class="topbar-right">
      <div class="font-controls">
        <button class="font-btn" onclick="setFontSize('small')" title="Small Font">A</button>
        <button class="font-btn active" onclick="setFontSize('medium')" title="Medium Font">A+</button>
        <button class="font-btn" onclick="setFontSize('large')" title="Large Font">A++</button>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <span class="material-icons-round" id="themeIcon">light_mode</span>
      </button>
      <div class="user-badge">
        <span class="material-icons-round">account_circle</span>
        <span id="userDisplay">User</span>
      </div>
    </div>
  </div>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>&#9776; Menu</h3>
      <button class="sidebar-close" onclick="closeSidebar()">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="sidebar-nav" id="sidebarNav">
      <!-- Dynamic nav items will be loaded here -->
      <div style="text-align:center; padding:40px 20px; color:var(--text-muted); font-size:12px;">
        Loading permissions...
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">
    <div class="welcome-section">
      <span class="material-icons-round welcome-icon">dashboard</span>
      <h2>Welcome to FMS</h2>
      <p>Flow Management System - Select a menu item from the sidebar to get started.</p>
    </div>
  </div>

  <script>
    // ===== GLOBAL STATE =====
    var currentTheme = 'dark';
    var currentFontSize = 'medium';
    var sidebarOpen = false;

    // ===== INIT DASHBOARD =====
    window.onload = function() {
      // Get session from injected script
      if (typeof FMS_SESSION !== 'undefined') {
        document.getElementById('userDisplay').textContent = FMS_SESSION.userName;
        loadPermissions();
      }
    };

    // ===== LOAD PERMISSIONS =====
    function loadPermissions() {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            renderSidebar(res.permissions);
          } else {
            document.getElementById('sidebarNav').innerHTML = '<div style="padding:20px; color:#ff5252; font-size:12px; text-align:center;">' + (res.message || 'No permissions found') + '</div>';
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('sidebarNav').innerHTML = '<div style="padding:20px; color:#ff5252; font-size:12px; text-align:center;">Error: ' + err.message + '</div>';
        })
        .getUserPermissions(FMS_SESSION.userName, FMS_SESSION.sheetUrl, FMS_SESSION.stepsSheet);
    }

    // ===== RENDER SIDEBAR =====
    function renderSidebar(permissions) {
      var nav = document.getElementById('sidebarNav');
      var html = '';

      for (var header in permissions) {
        var items = permissions[header];
        html += '<div class="nav-group">';
        html += '<div class="nav-group-header" onclick="toggleGroup(this)">';
        html += '<span class="header-text">' + header + '</span>';
        html += '<span class="material-icons-round arrow">expand_more</span>';
        html += '</div>';
        html += '<div class="nav-group-items">';
        for (var i = 0; i < items.length; i++) {
          html += '<div class="nav-item" onclick="openPage(\'' + escapeHtml(items[i]) + '\', \'' + escapeHtml(header) + '\')">';
          html += '<span class="material-icons-round">chevron_right</span>';
          html += items[i];
          html += '</div>';
        }
        html += '</div></div>';
      }

      if (!html) {
        html = '<div style="padding:30px; text-align:center; color:var(--text-muted); font-size:12px;">No permissions assigned.</div>';
      }

      nav.innerHTML = html;
    }

    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // ===== TOGGLE NAV GROUP =====
    function toggleGroup(el) {
      var group = el.parentElement;
      group.classList.toggle('expanded');
    }

    // ===== OPEN PAGE =====
    function openPage(pageName, headerName) {
      var main = document.getElementById('mainContent');
      main.innerHTML = '<div class="content-page"><h3>' + pageName + '</h3><p>Category: ' + headerName + '</p><br><p style="color:var(--text-muted); font-style:italic;">This page content will be configured later.</p></div>';
      closeSidebar();
    }

    // ===== SIDEBAR TOGGLE =====
    function toggleSidebar() {
      if (sidebarOpen) { closeSidebar(); } else { openSidebar(); }
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').classList.add('active');
      sidebarOpen = true;
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('active');
      sidebarOpen = false;
    }

    // ===== THEME TOGGLE =====
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', currentTheme);
      document.getElementById('themeIcon').textContent = currentTheme === 'dark' ? 'light_mode' : 'dark_mode';
    }

    // ===== FONT SIZE =====
    function setFontSize(size) {
      var sizes = { small: '12px', medium: '14px', large: '17px' };
      document.body.style.fontSize = sizes[size];
      currentFontSize = size;
      // Update active button
      var btns = document.querySelectorAll('.font-btn');
      btns.forEach(function(b) { b.classList.remove('active'); });
      var idx = size === 'small' ? 0 : (size === 'medium' ? 1 : 2);
      btns[idx].classList.add('active');
    }

    // ===== CLICK OUTSIDE TO CLOSE SIDEBAR =====
    document.addEventListener('click', function(e) {
      if (sidebarOpen) {
        var sidebar = document.getElementById('sidebar');
        var menuBtn = document.querySelector('.menu-toggle');
        if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
          closeSidebar();
        }
      }
    });

    // ===== KEYBOARD SHORTCUT =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeSidebar();
    });
  </script>
</body>
</html>
